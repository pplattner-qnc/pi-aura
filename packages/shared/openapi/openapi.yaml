          description: Term already exists
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: deleteGlossaryEntry
      summary: "Glossary: Delete"
