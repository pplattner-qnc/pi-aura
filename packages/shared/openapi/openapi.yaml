          type: string
        score:
          type: number
        match_type:
          type: string
          enum: [semantic, exact]
        portal_url:
          type: string

    ArtifactSearchHit:
      description: A single artifact search hit — full ArtifactListItem fields plus a relevance score and snippet
      allOf:
        - $ref: "#/components/schemas/ArtifactListItem"
        - type: object
          required: [source_type, score, snippet]
          properties:
            source_type:
              type: string
              enum: [ARTIFACT]
            score:
              type: number
              format: float
              minimum: 0
              maximum: 1
