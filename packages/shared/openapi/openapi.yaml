          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /glossary/{uuid}/reject:
    parameters:
      - name: uuid
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: rejectGlossaryEntry
      summary: "Glossary: Reject a pending proposal (admin-only)"
      description: Deletes a PENDING entry (it was never embedded). Requires MANAGE_GLOSSARY capability (ADMIN only).
      tags:
        - Glossary
      responses:
        "204":
          description: Rejected and deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
