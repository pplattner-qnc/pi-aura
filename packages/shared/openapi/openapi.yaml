  /artifacts:
    get:
      operationId: listArtifacts
      summary: "Artifacts: List all (paginated)"
      description: Returns paginated artifacts owned by or shared with the authenticated user.
      tags:
        - Artifacts
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/SearchParam"
        - name: sort_by
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ArtifactSortField"
          description: Field to sort by
        - $ref: "#/components/parameters/SortDirParam"
        - name: shared
          in: query
          required: false
          schema:
            type: boolean
          description: When true, returns only artifacts shared via task cascade (not directly owned)
        - name: owned
          in: query
          required: false
          schema:
            type: boolean
          description: When true, returns only artifacts directly owned by the current user (no task cascade)
        - name: broad_shared
          in: query
          required: false
          schema:
            type: boolean
          description: When true, returns only artifacts of a task carrying a direct company-wide or user access grant (excludes owned, direct-membership, and ancestor-membership artifacts, which surface in the default list instead)
        - name: pending_review
          in: query
          required: false
          schema:
            type: boolean
          description: When true, returns only artifacts where the current user has an open review obligation for the current version
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactList"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /artifacts/{id}:
    get:
      operationId: getArtifact
      summary: "Artifacts: Get detail"
      description: >-
        Returns the detail of an artifact including its latest version body.
        404 when the artifact does not exist (or is inactive/deleted); 403
        (ANW-7662) when it exists but the caller lacks access — naming the
        owner in `meta`.
      tags:
        - Artifacts
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Artifact UUID
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AccessDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: deleteArtifact
      summary: "Artifacts: Delete (soft-delete, owner-only)"
      description: Soft-deletes an artifact by setting status to DELETED (no data is removed). Owner-only (Permission MANAGE) — a task member with EDIT access gets 404. 404 if the artifact does not exist, is already deleted, or is not owned by the current user.
      tags:
        - Artifacts
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Artifact UUID
      responses:
        "204":
          description: Artifact soft-deleted
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /artifacts/{id}/review-request:
    post:
      operationId: requestArtifactReview
      summary: "Artifacts: Request review"
      description: Triggers the review obligation for an artifact. The artifact's current status must have triggersReview=true and at least one review role. Notifies all role-holders in linked tasks via SSE (excluding the actor). Records artifact.review_requested activity.
      tags:
        - Artifacts
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Artifact UUID
      responses:
        "204":
          description: No Content
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalError"

  /artifacts/{id}/review-preview:
    get:
      operationId: getArtifactReviewPreview
      summary: "Artifacts: Preview review recipients"
      description: >
        Returns the deduplicated list of users who would be notified and the linked tasks
        affected, for the given roles and explicitly added users. Read-only — no notifications sent.
        The calling user is excluded from the reviewers list (matching actual dispatch behaviour).
      tags:
        - Artifacts
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Artifact UUID
        - name: roles
          in: query
          required: false
          schema:
            type: string
          description: Comma-separated list of TaskRole enum values to resolve reviewers from (e.g. "OWNER,CONTRIBUTOR")
        - name: user_ids
          in: query
          required: false
          schema:
            type: string
          description: Comma-separated list of user UUIDs to include as explicit reviewers
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactReviewPreview"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /artifacts/{id}/decisions:
    post:
      operationId: submitArtifactDecision
      summary: "Artifacts: Submit approval/rejection decision"
      description: Submits or updates an APPROVED or REJECTED decision for a specific version. Version-bound and idempotent (upsert). After all role-holders decide, the artifact is auto-transitioned to the isApproved or isRevision status. Bot-callable.
      tags:
        - Artifacts
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Artifact UUID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArtifactDecisionRequest"
      responses:
        "204":
          description: No Content
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /artifacts/{id}/approvals:
    get:
      operationId: getArtifactApprovals
      summary: "Artifacts: Get approval status"
      description: Returns the approval/review status for a specific version of an artifact. Includes X/Y count, list of deciders, and pending reviewers. Defaults to latest version.
      tags:
        - Artifacts
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Artifact UUID
        - name: version
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
          description: Version to query; defaults to latest
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactApprovalsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /artifacts/{id}/review-start:
    post:
      operationId: startArtifactReview
      summary: "Artifacts: Start review"
      description: >
        Starts a review for a specific version of an artifact. Resolves reviewers from roles
        and explicit userIds, creates ArtifactReviewAssignment rows, sets reviewState to IN_REVIEW,
        and notifies all assigned reviewers (except the actor). If the version already has a
        completed run (APPROVED or NEEDS_REVISION), the old assignments and decisions are cleared first.
        Requires EDIT permission.
      tags:
        - Artifacts
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Artifact UUID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArtifactReviewStartRequest"
      responses:
        "201":
          description: Created — review run started
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalError"

  /artifacts/{id}/review-cancel:
    post:
      operationId: cancelArtifactReview
      summary: "Artifacts: Cancel review"
      description: >
        Cancels the running review for a specific version. Deletes all ArtifactReviewAssignment
        and ArtifactApproval rows for (artifactId, version) and sets reviewState back to UNCHECKED.
        Notifies all still-pending reviewers (those without a decision). Requires EDIT permission.
      tags:
        - Artifacts
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Artifact UUID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArtifactReviewVersionRequest"
      responses:
        "204":
          description: No Content
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /artifacts/{id}/review-override:
    post:
      operationId: overrideArtifactReview
      summary: "Artifacts: Override review (force approved)"
      description: >
        Forces the artifact version to APPROVED regardless of the current review state.
        Keeps all ArtifactReviewAssignment and ArtifactApproval rows intact so the approval can be reopened later.
        Notifies still-pending reviewers. Records artifact.review_overridden activity.
        Requires EDIT permission.
      tags:
        - Artifacts
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Artifact UUID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArtifactReviewVersionRequest"
      responses:
        "204":
          description: No Content
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /artifacts/{id}/review-reopen:
    post:
      operationId: reopenArtifactReview
      summary: "Artifacts: Reopen approved review"
      description: >
        Reopens an approved review run for a specific version: sets reviewState from APPROVED
        back to IN_REVIEW while keeping all ArtifactReviewAssignment and ArtifactApproval rows
        intact. Inverse of review-override. Requires EDIT permission.
      tags:
        - Artifacts
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Artifact UUID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArtifactReviewVersionRequest"
      responses:
        "204":
          description: No Content
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /artifacts/{id}/review-reviewers:
    post:
      operationId: addArtifactReviewer
      summary: "Artifacts: Add reviewer mid-run"
      description: >
        Adds a reviewer to a running review. Creates a new ArtifactReviewAssignment row for
        (artifactId, version, userId) if not already present. Notifies the newly added reviewer.
        Requires EDIT permission.
      tags:
        - Artifacts
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Artifact UUID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArtifactReviewAddReviewerRequest"
      responses:
        "201":
          description: Created — reviewer added
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Reviewer already assigned for this version
        "500":
          $ref: "#/components/responses/InternalError"

  /artifacts/{id}/review-reviewers/{userId}:
    delete:
      operationId: removeArtifactReviewer
      summary: "Artifacts: Remove reviewer mid-run"
      description: >
        Removes a reviewer from the running review. Deletes the ArtifactReviewAssignment and
        any ArtifactApproval row for this user and version. Re-evaluates quorum immediately —
        removing the last pending reviewer can close the review. Requires EDIT permission.
      tags:
        - Artifacts
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Artifact UUID
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: UUID of the user to remove
        - name: version
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
          description: Version number of the review run
      responses:
        "204":
          description: No Content
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /artifacts/{id}/review:
    get:
      operationId: getArtifactReview
      summary: "Artifacts: Get review overview"
      description: >
        Returns the current review state: the version under review (IN_REVIEW or latest),
        per-person status for each assigned reviewer, and the list of review artifacts
        linked via reviewOf for this run. Requires at minimum READ access.
      tags:
        - Artifacts
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Artifact UUID
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactReviewOverview"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /artifacts/{id}/review/revise-context:
    get:
      operationId: getArtifactReviseContext
      summary: "Artifacts: Get ReviseBot context"
      description: >
        Returns the review artifacts linked to the current IN_REVIEW run of this artifact
        (via reviewOfArtifactId + reviewOfVersion). Read-only data contract for the ReviseBot
        (ANW-7116). Requires at minimum READ access.
      tags:
        - Artifacts
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Artifact UUID
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactReviseContext"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /artifacts/{id}/versions:
    get:
      operationId: listArtifactVersions
      summary: "Artifacts: List versions"
      description: Returns all versions of an artifact sorted by version DESC, without body. User-scoped — 404 if not found or not owned by the current user.
      tags:
        - Artifacts
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Artifact UUID
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactVersionList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /artifacts/{id}/versions/{n}:
    get:
      operationId: getArtifactVersion
      summary: "Artifacts: Get version detail"
      description: Returns the full body and metadata of a specific artifact version. 400 for non-numeric version, 404 for unknown artifact UUID or version number.
      tags:
        - Artifacts
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Artifact UUID
        - name: n
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
          description: Version number
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactVersionDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /artifacts/{id}/accept-memory:
    post:
      operationId: acceptArtifactMemory
      summary: "Artifacts: Accept into memory"
      description: |
        Explicit validation signal (D9) for aura-native memory ingest. Enqueues Lane A
        embed + optional KG extract for the artifact's latest version body. Owner-only.
        Idempotent when content hash is unchanged.
      tags:
        - Artifacts
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Artifact UUID
      responses:
        "202":
          description: Memory ingest enqueued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptArtifactMemoryResponse"
        "200":
          description: Content unchanged — ingest skipped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptArtifactMemoryResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /artifacts/{id}/tasks:
    get:
      operationId: listArtifactTasks
      summary: "Artifacts: List linked tasks"
      description: Returns the non-paginated list of tasks linked to this artifact, sorted by updatedAt DESC. 404 if artifact not found or not owned by the current user.
      tags:
        - Artifacts
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Artifact UUID
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactTaskList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /artifacts/{id}/access-overview:
    get:
      operationId: getArtifactAccessOverview
      summary: "Artifacts: Access overview (flat)"
      description: >
        Returns a flat, deduplicated list of users who have access to this artifact
        (owner + direct members of linked tasks), for the share modal (ANW-7754).
        Requires READ access on the artifact. Purely informational — no mutation affordances.
      tags:
        - Artifacts
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Artifact UUID
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactAccessOverview"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /artifacts/{id}/grants:
    post:
      operationId: grantArtifactAccess
      summary: "Artifacts: Grant or update access"
      description: >
        Upserts an entry in the artifact's own access list (S3, AURA-923): creates
        it if the principal has none yet, or changes its level if it already does.
        Requires MANAGE permission on the artifact. Returns the updated access
        overview so the share dialog can be refreshed from a single response.
      tags:
        - Artifacts
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Artifact UUID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArtifactGrantRequest"
      responses:
        "200":
          description: OK — updated access overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactAccessOverview"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalError"

    delete:
      operationId: revokeArtifactAccess
      summary: "Artifacts: Revoke access"
      description: >
        Removes the matching entry from the artifact's own access list, if
        present (S3, AURA-923). Requires MANAGE permission on the artifact.
        Idempotent — revoking an entry that does not exist still returns 200
        with the current overview. Returns the updated access overview.
      tags:
        - Artifacts
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Artifact UUID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArtifactGrantRevokeRequest"
      responses:
        "200":
          description: OK — updated access overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactAccessOverview"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalError"

