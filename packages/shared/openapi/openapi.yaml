          description: Created asset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillAsset"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /skills/{uuid}/assets/{assetId}:
    parameters:
      - name: uuid
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: assetId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: downloadSkillAsset
      tags: [Skills]
      summary: Download a skill asset
      responses:
        "200":
          description: Asset binary content
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteSkillAsset
      tags: [Skills]
      summary: Delete a skill asset (owner only)
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /skills/import/validate:
    post:
      operationId: validateSkillImport
      tags: [Skills]
      summary: Upload a plugin ZIP and receive a validation preview
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Preview of the ZIP contents
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PluginZipPreview"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          description: ZIP too large

  /skills/import/confirm:
    post:
      operationId: confirmSkillImport
      tags: [Skills]
      summary: Confirm import of selected skills and start background indexing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SkillImportConfirmRequest"
      responses:
        "202":
          description: Import accepted; indexing started in background
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillImportRun"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: import_token not found or expired

  /processes:
    get:
      operationId: listProcesses
      tags: [Processes]
      summary: "Processes: List registered processes (admin)"
      description: Returns the catalog of all registered background processes. Requires ADMIN role.
      responses:
        "200":
          description: Process catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessCatalogList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /runs:
    get:
      operationId: listRuns
      tags: [Runs]
      summary: "Runs: List all runs (admin)"
      description: Returns a paginated list of all runs across all process kinds, read from the run_overview view. Requires ADMIN role.
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/LimitParam"
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/RunStatus"
          description: Filter by run status
        - name: kind
          in: query
          required: false
          schema:
            type: string
          description: Filter by run kind (e.g. DOC_RUN, DOC_INGEST, SKILL_IMPORT)
        - name: category
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/RunCategory"
          description: Filter by run category (AGENT or SCRIPT)
        - name: repository_id
          in: query
          required: false
          schema:
            type: integer
          description: Filter by repository ID
        - name: trigger
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/RunTrigger"
          description: Filter by trigger type
      responses:
        "200":
          description: Paginated list of runs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunOverviewList"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /runs/{uuid}:
    parameters:
      - name: uuid
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getRun
      tags: [Runs]
      summary: "Runs: Get run detail (admin)"
      description: Returns the full detail of a single run (AgentRun or ScriptRun). Requires ADMIN role.
      responses:
        "200":
          description: Run detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /runs/{uuid}/cancel:
    parameters:
      - name: uuid
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: cancelRun
      tags: [Runs]
      summary: "Runs: Cancel a running run (admin)"
      description: Sets the run status to CANCELLING and signals the pg-boss job to abort cooperatively. The worker sets CANCELLED once the process exits. Requires ADMIN role.
      responses:
        "200":
          description: Cancel accepted (status CANCELLING) or already CANCELLING (idempotent)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancelRunResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Run is already in a terminal state (SUCCEEDED, FAILED, or CANCELLED)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

  /runs/{uuid}/retry:
    parameters:
      - name: uuid
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: retryRun
      tags: [Runs]
      summary: "Runs: Retry a failed run (admin)"
      description: Resets a FAILED run to PENDING and re-queues its pg-boss job with the same run UUID. Requires ADMIN role.
      responses:
        "200":
          description: Retry accepted — run reset to PENDING and job re-queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetryRunResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Run is not FAILED, or the job could not be re-queued
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

  /ontology-proposals:
    get:
      operationId: listOntologyProposals
      tags: [OntologyProposals]
      summary: "Ontology: List proposals (admin)"
      description: Returns paginated ontology proposals for human review. Requires ADMIN role.
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/LimitParam"
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/OntologyProposalStatus"
      responses:
        "200":
          description: Paginated ontology proposals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OntologyProposalList"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /ontology-proposals/{uuid}/approve:
    parameters:
      - name: uuid
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: approveOntologyProposal
      tags: [OntologyProposals]
      summary: "Ontology: Approve proposal (admin)"
      description: Enqueues KG_ONTOLOGY_APPLY for a pending proposal. Requires ADMIN role.
      responses:
        "200":
          description: Approval accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OntologyProposalApproveResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /ontology-proposals/{uuid}/reject:
    parameters:
      - name: uuid
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: rejectOntologyProposal
      tags: [OntologyProposals]
      summary: "Ontology: Reject proposal (admin)"
      description: Marks a pending proposal as rejected without changing the graph. Requires ADMIN role.
      responses:
        "200":
          description: Proposal rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OntologyProposalRejectResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /runs/{uuid}/events:
    parameters:
      - name: uuid
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: afterSeq
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
        description: Return only events with seq strictly greater than this value (for Replay-then-Tail reconnect).
    get:
      operationId: listAgentRunEvents
      tags: [Runs]
      summary: "Runs: List structured events for a run"
      description: Returns persisted agent-run events (reasoning, tool calls, …) for a given run. Pass afterSeq for lossless reconnect (returns only events with seq > afterSeq). Any authenticated user may access runs they can see.
      responses:
        "200":
          description: List of agent run events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentRunEventList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /skills/import/runs/active:
    get:
      operationId: getActiveSkillImportRun
      tags: [Skills]
      summary: Get the active skill import run for the current user
      description: >-
        Returns the most recent PENDING or RUNNING skill import run triggered by
        the current user, or null if no active run exists.
      responses:
        "200":
          description: Active run or null
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActiveSkillImportRun"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /skills/import/runs/{uuid}:
    parameters:
      - name: uuid
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getSkillImportRun
      tags: [Skills]
      summary: Poll the status of a skill import run
      responses:
        "200":
          description: Run status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillImportRun"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /jira-issues:
    get:
      operationId: listJiraIssues
      tags: [JiraIssues]
      summary: "Jira Issues: List locally mirrored (admin)"
      description: Returns a paginated list of all locally mirrored Jira issues. Requires ADMIN role.
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/SearchParam"
        - name: sort_by
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/JiraIssueSortField"
          description: Field to sort by
        - $ref: "#/components/parameters/SortDirParam"
        - name: team_id
          in: query
          required: false
          schema:
            type: string
          description: Filter by team UUID (from JiraTeam / customfield_10001)
        - name: status_category
          in: query
          required: false
          schema:
            type: string
          description: >-
            Comma-separated status category keys to filter by (e.g. "new,indeterminate").
            No server-side default — omitting this parameter returns all categories.
        - name: issue_key
          in: query
          required: false
          schema:
            type: string
          description: >-
            Exact issue key match (e.g. "ANW-7896"), used to resolve the ?issue=<key>
            deep-link. Distinct from `q`, which searches with `contains` across
            issueKey, summary, and status — a prefix would otherwise match unrelated tickets.
      responses:
        "200":
          description: Paginated list of Jira issues
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JiraIssueList"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /jira-issues/sync:
    post:
      operationId: triggerJiraSync
      tags: [JiraIssues]
      summary: "Jira Issues: Trigger topic sync (admin)"
      description: Triggers a background sync that mirrors all Jira issues for a given team/topic. Returns 409 if a sync for the same topic is already running. Requires ADMIN role.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [team_id]
              properties:
                team_id:
                  type: string
                  format: uuid
                  description: Team UUID to sync (from JiraTeam / customfield_10001)
      responses:
        "202":
          description: Sync enqueued
          content:
            application/json:
              schema:
                type: object
                required: [run_id]
                properties:
                  run_id:
                    type: string
                    format: uuid
                    description: UUID of the created ScriptRun
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: A sync for this topic is already running
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

  /jira-issues/{cloudId}/{issueKey}:
    parameters:
      - name: cloudId
        in: path
        required: true
        schema:
          type: string
        description: Atlassian cloud ID
      - name: issueKey
        in: path
        required: true
        schema:
          type: string
        description: Jira issue key (e.g. ANW-1234)
    get:
      operationId: getJiraIssue
      tags: [JiraIssues]
      summary: "Jira Issues: Get locally mirrored detail (admin)"
      description: Returns the full detail of a single locally mirrored Jira issue, addressed by cloudId + issueKey. Requires ADMIN role.
      responses:
        "200":
          description: Jira issue detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JiraIssueDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /integrations/asana/status:
    get:
      operationId: getAsanaStatus
      tags: [Asana]
      summary: "Asana: Connection status"
      description: >-
        Returns whether the authenticated user has a connected Asana account.
        When a PAT is stored, validates it against Asana's `GET /users/me` so
        "token invalid" is distinguishable from "not connected".
      responses:
        "200":
          description: Asana connection status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AsanaStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /integrations/asana/link:
    post:
      operationId: confirmAsanaLink
      tags: [Asana]
      summary: "Asana: Confirm a proposed link"
      description: >-
        Confirms an `asana_propose_link` chat-tool proposal identified by
        `toolCallId`: sets the Asana link on the task the proposal targeted.
        Idempotent — confirming the same proposal twice returns the existing
        link instead of erroring. Returns 409 when the Asana object is already
        linked to a different task.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [toolCallId]
              properties:
                toolCallId:
                  type: string
                  format: uuid
                  description: UUID of the ChatToolCall record created by asana_propose_link
      responses:
        "200":
          description: Link confirmed (or already confirmed for this toolCallId)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AsanaLinkResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The Asana object is already linked to a different task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AsanaLinkConflict"

  /asana-tasks:
    get:
      operationId: listAsanaTasks
      tags: [Asana]
      summary: "Asana Tasks: List locally mirrored"
      description: >-
        Returns a paginated list of every locally mirrored Asana task row
        (resourceKind TASK); project rows (Sagas) are excluded, whether or not
        a sync has touched a given row. No Asana account is required to read
        this list.
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/SearchParam"
        - name: sort_by
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/AsanaTaskSortField"
          description: Field to sort by
        - $ref: "#/components/parameters/SortDirParam"
        - name: project_gid
          in: query
          required: false
          schema:
            type: string
          description: Filter by Asana project gid
        - name: completed
          in: query
          required: false
          schema:
            type: boolean
          description: >-
            When false (the default), only tasks not yet completed are
            returned. Pass true to include completed tasks as well.
        - name: gid
          in: query
          required: false
          schema:
            type: string
          description: >-
            Exact Asana task gid match, used to resolve a deep-link. Distinct
            from `q`, which searches with `contains` across name and gid.
        - name: level
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: "#/components/schemas/AsanaTaskLevel"
          description: Filter by derived Aura level, repeatable.
      responses:
        "200":
          description: Paginated list of mirrored Asana tasks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AsanaTaskList"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /asana-tasks/{gid}:
    parameters:
      - name: gid
        in: path
        required: true
        schema:
          type: string
        description: Asana task gid
    get:
      operationId: getAsanaTask
      tags: [Asana]
      summary: "Asana Tasks: Get locally mirrored detail"
      description: >-
        Returns the full detail of a single locally mirrored Asana task,
        addressed by gid. Project rows (Sagas) are not exposed (404). No
        Asana account is required.
      responses:
        "200":
          description: Asana task detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AsanaTaskDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /asana-tasks/sync:
    post:
      operationId: triggerAsanaSync
      tags: [Asana]
      summary: "Asana: Trigger project sync (admin)"
      description: Triggers a background sync that mirrors all member tasks of a given Asana project. Returns 409 if a sync for the same project is already running. Requires ADMIN role.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_gid]
              properties:
                project_gid:
                  type: string
                  description: Asana project gid to sync
      responses:
        "202":
          description: Sync enqueued
          content:
            application/json:
              schema:
                type: object
                required: [run_id]
                properties:
                  run_id:
                    type: string
                    format: uuid
                    description: UUID of the created ScriptRun
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: A sync for this project is already running
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

  /asana-tasks/projects:
    get:
      operationId: listAsanaMirrorProjects
      tags: [Asana]
      summary: "Asana: List mirrored projects (filter source)"
      description: >-
        Distinct projects already seen by the Asana mirror, with a task
        count and per-project sync freshness (latest completed run: success,
        failure, or truncated). Reads only the local mirror — no Asana
        account is required. Backs the project filter dropdown; contrast
        with GET /asana-tasks/asana-projects, which reads live from Asana
        for the sync trigger selection.
      responses:
        "200":
          description: Distinct mirrored projects
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/AsanaMirrorProjectItem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /asana-tasks/asana-projects:
    get:
      operationId: listAsanaProjects
      tags: [Asana]
      summary: "Asana: List own projects (sync trigger selection, admin)"
      description: >-
        The caller's own Asana projects, read live from the Asana API, for
        the project picker used to trigger a sync. Requires
        MANAGE_ASANA_SYNC and a connected personal Asana token; a missing or
        invalid token is reported as `status`, never a 500.
      responses:
        "200":
          description: Project selection, or an explanation why none is available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AsanaProjectSelection"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /boards:
    get:
      operationId: getBoardSummary
      summary: "Boards: Personal attention summary"
      description: >
        Aggregates personal attention projections for the authenticated user —
        waiting_on_me, waiting_on_others, and overdue (yellow/red traffic light
        against TaskPhaseGoal deadlines). Notifications are NOT included; use
        GET /notifications. No new DB model — pure reads over existing tables.
      tags:
        - Boards
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BoardSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /boards/briefing:
    get:
      operationId: getBoardBriefing
      summary: "Boards: AI-generated personal briefing"
      description: >
        Returns a short AI-generated situation report for the authenticated user's
        personal board. Cached with a content-hash signature — returns stored text
        without an LLM call when the user's situation has not changed.
      tags:
        - Boards
      parameters:
        - name: locale
          in: query
          required: false
          schema:
            type: string
            default: de
          description: Locale code for the generated text (e.g. 'de', 'en').
        - name: refresh
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: >
            When true, bypass the signature/TTL cache and regenerate the briefing
            via a fresh LLM call.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BoardBriefing"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /notifications:
    get:
      operationId: listNotifications
      summary: "Notifications: List (paginated)"
      description: Returns paginated notifications for the authenticated user, newest first.
      tags:
        - Notifications
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/LimitParam"
        - name: sort_by
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/NotificationSortField"
          description: Field to sort by
        - $ref: "#/components/parameters/SortDirParam"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationList"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /notifications/read-all:
    post:
      operationId: markAllNotificationsRead
      summary: "Notifications: Mark all as read"
      description: Marks all unread notifications for the authenticated user as read. Idempotent.
      tags:
        - Notifications
      responses:
        "200":
          description: OK — returns updated unread count (always 0)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationReadResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /notifications/preferences:
    get:
      operationId: getNotificationPreferences
      summary: "Notifications: Get preference matrix"
      description: Returns the effective preference matrix (all registered types × channels), merging registry defaults with stored user rows. Absence of a stored row means the registry default applies.
      tags:
        - Notifications
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPreferencesMatrix"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      operationId: updateNotificationPreferences
      summary: "Notifications: Update preferences"
      description: Saves deviations from defaults. Rows matching the registry default are deleted (sparse storage); rows differing from defaults are upserted.
      tags:
        - Notifications
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationPreferencesUpdate"
      responses:
        "200":
          description: OK — returns the updated effective preference matrix
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPreferencesMatrix"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /notifications/{id}/read:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: UUID of the notification
    post:
      operationId: markNotificationRead
      summary: "Notifications: Mark one as read"
      description: Marks a single notification as read. Idempotent — calling it a second time returns 200 with no error.
      tags:
        - Notifications
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationReadResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /comments:
    get:
      operationId: listComments
      summary: "Comments: List for an entity"
      description: Returns paginated flat comments for a given entity, ordered by createdAt according to sort_dir (default DESC). The caller must have at least READ access to the entity.
      tags:
        - Comments
      parameters:
        - name: entity_type
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/EntityType"
          description: The entity type to filter by
        - name: entity_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
          description: The public UUID of the entity
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/SortDirParam"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommentList"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    post:
      operationId: createComment
      summary: "Comments: Create"
      description: Creates a new comment on an entity. Caller must have at least READ access.
      tags:
        - Comments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCommentRequest"
      responses:
        "201":
          description: Comment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /comments/mention-candidates:
    get:
      operationId: listMentionCandidates
      summary: "Comments: Mention candidates"
      description: Returns users that can be @-mentioned in a comment, with a has_access flag per candidate relative to the target entity.
      tags:
        - Comments
      parameters:
        - name: entity_type
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/EntityType"
        - name: entity_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/SearchParam"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/MentionCandidate"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /comments/{uuid}:
    patch:
      operationId: updateComment
      summary: "Comments: Update"
      description: Updates the body and mentions of an existing comment. Only the comment author may update their own comment.
      tags:
        - Comments
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchCommentRequest"
      responses:
        "200":
          description: Updated comment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: deleteComment
      summary: "Comments: Delete"
      description: Hard-deletes a comment. Allowed for the comment author or a user with MANAGE permission on the entity. Mentions are cascade-deleted.
      tags:
        - Comments
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /comments/images:
    post:
      operationId: uploadCommentImage
      summary: "Comments: Upload image"
      description: Uploads an image for use in a comment or a task description. The image is entity-scoped. For comments, it is linked once the comment is saved (commentId set on submit). For TASK entities a missing commentId means the image is bound to the task description (not an orphan); a future sweep must check the task description for the image URL before deleting. Comment uploads that stay unlinked (commentId null after abandon) may still be cleaned by a periodic sweep.
      tags:
        - Comments
      parameters:
        - name: entity_type
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/EntityType"
        - name: entity_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: Uploaded image
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommentImageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          description: Payload too large (exceeds 10 MB)
        "415":
          description: Unsupported media type (only JPEG, PNG, WebP allowed)
        "500":
          $ref: "#/components/responses/InternalError"

  /comments/images/{id}:
    get:
      operationId: getCommentImage
      summary: "Comments: Get image"
      description: Returns the binary image. Requires READ access on the parent entity.
      tags:
        - Comments
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Image binary
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Personal Access Token aus den Einstellungen (`/settings/mcp-access`), Präfix `aura_pat_`. Gilt für MCP und REST gleichermaßen.
    cookieAuth:
      type: apiKey
      in: cookie
      name: aura-session

  parameters:
    PageParam:
      name: page
      in: query
      required: false
      schema:
        type: integer
        default: 1
        minimum: 1
      description: Page number (1-based)

    LimitParam:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100
      description: Number of items per page

    SearchParam:
      name: q
      in: query
      required: false
      schema:
        type: string
      description: Search query (full-text filter across relevant fields)

    SortDirParam:
      name: sort_dir
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/SortDirection"
      description: Sort direction

    RankContextScopeParam:
      name: scope
      in: query
      required: false
      schema:
        type: string
        enum: [siblings, children]
        default: siblings
      description: >
        Which priority-ordering context to address (AURA-930).
        `siblings` (default) is the context the named task itself sits in;
        `children` is the context of its direct children (`task:<this>`).

    MemoryExplorerEntityTypeParam:
      name: entity_type
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/MemoryGraphNodeType"
      description: Filter to entities or nodes of this wiki-graph type

    MemoryExplorerEdgeOriginParam:
      name: edge_origin
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/MemoryEdgeOrigin"
      description: Filter edges by provenance origin (knowledge graph vs mirrored operational links)

    MemoryExplorerFactLayerParam:
      name: fact_layer
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/MemoryFactLayerFilter"
      description: Filter edges by fact layer

    MemoryExplorerConfidenceMinParam:
      name: confidence_min
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/MemoryConfidenceMin"
      description: Minimum confidence threshold for edges

    MemoryExplorerEdgeStatusParam:
      name: status
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/MemoryEdgeStatusFilter"
      description: Filter edges by trust status

    MemoryExplorerSensitivityParam:
      name: sensitivity
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/MemorySensitivityFilter"
      description: Filter edges or entities by memory sensitivity label

  responses:
    BadRequest:
      description: Bad request - the request payload is malformed or invalid.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"

    ValidationError:
      description: Validation error - query parameters or body failed validation.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ValidationProblemDetail"

    Unauthorized:
      description: Unauthorized - missing or invalid session.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"

    Forbidden:
      description: Forbidden - insufficient permissions.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"

    AccessDenied:
      description: >-
        Forbidden - per-object access denied (ANW-7662). `meta.reason` is
        `no_access` (no relationship to the object at all) or
        `insufficient_permission` (has some access, but not enough for this
        action); `meta.owners` names who can grant more access.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/AccessDeniedProblemDetail"

    NotFound:
      description: Resource not found.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"

    InternalError:
      description: Internal server error.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"

    Conflict:
      description: Conflict — resource already exists.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"

    UnprocessableEntity:
      description: Unprocessable Entity — request is well-formed but semantically invalid.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"

  schemas:
    EntityType:
      type: string
      enum: [TASK, ARTIFACT]
      description: Supported entity types for polymorphic resources (comments, activity events)

    AuthorRef:
      type: object
      required: [id, display_name]
      properties:
        id:
          type: string
          format: uuid
        display_name:
          type: string

    MentionCandidate:
      type: object
      required: [id, display_name, has_access]
      properties:
        id:
          type: string
          format: uuid
        display_name:
          type: string
        has_access:
          type: boolean
          description: Whether this user already has access to the target entity

    Comment:
      type: object
      required: [id, entity_type, entity_id, author, body, is_ai_generated, created_at, updated_at, edited, can_delete, can_edit]
      properties:
        id:
          type: string
          format: uuid
        entity_type:
          $ref: "#/components/schemas/EntityType"
        entity_id:
          type: string
          format: uuid
        author:
          $ref: "#/components/schemas/AuthorRef"
        body:
          type: string
        is_ai_generated:
          type: boolean
          description: True when this comment's text was generated by an AI/bot; the author still reflects the calling user.
        version:
          type: integer
          nullable: true
        mentions:
          type: array
          items:
            $ref: "#/components/schemas/AuthorRef"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        edited:
          type: boolean
          description: True when the comment body was modified after initial creation
        can_delete:
          type: boolean
          description: Whether the authenticated user may delete this comment
        can_edit:
          type: boolean
          description: Whether the authenticated user may edit this comment (author only)

    CommentList:
      type: object
      required: [items, pagination, read_watermark_at]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Comment"
        pagination:
          $ref: "#/components/schemas/Pagination"
        read_watermark_at:
          type: string
          format: date-time
          nullable: true
          description: >
            For entity_type=TASK: the viewer's comment-read watermark as it stood
            when this response was computed — comments newer than this by another
            author are the unread ones (AURA-999). Null for ARTIFACT, which has no
            per-viewer read state.

    CreateCommentRequest:
      type: object
      required: [entity_type, entity_id, body]
      properties:
        entity_type:
          $ref: "#/components/schemas/EntityType"
        entity_id:
          type: string
          format: uuid
          description: Public UUID of the target entity
        body:
          type: string
          minLength: 1
          maxLength: 10000
        mentioned_user_ids:
          type: array
          items:
            type: string
            format: uuid
          description: UUIDs of users to @-mention in this comment
        image_ids:
          type: array
          items:
            type: string
            format: uuid
          description: UUIDs of previously uploaded CommentImages to link to this comment
        is_ai_generated:
          type: boolean
          default: false
          description: Mark this comment's text as AI/bot-generated. The author still stays the calling user/PAT owner.

    PatchCommentRequest:
      type: object
      required: [body]
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 10000
        mentioned_user_ids:
          type: array
          items:
            type: string
            format: uuid
          description: UUIDs of users to @-mention in the updated comment
        image_ids:
          type: array
          items:
            type: string
            format: uuid
          description: UUIDs of CommentImages to link to this comment (newly added during edit)

    CommentImageResponse:
      type: object
      required: [id, url, mime_type, byte_size, created_at]
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
          description: Relative URL to fetch the image binary
        mime_type:
          type: string
        byte_size:
          type: integer
        created_at:
          type: string
          format: date-time

    SortDirection:
      type: string
      enum: [asc, desc]
      description: Sort direction (ascending or descending)

    NotificationSortField:
      type: string
      enum: [created_at]
      description: Field to sort notifications by

    NotificationSeverity:
      type: string
      enum: [info, success, warning, error]
      description: Visual severity of the notification

    Notification:
      type: object
      required: [id, type, title_key, body_key, i18n_params, icon, severity, read, created_at]
      description: A persisted inbox notification for the authenticated user.
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier of the notification
        type:
          type: string
          description: Notification type code (e.g. "system.test")
        title_key:
          type: string
          description: i18n key for the notification title (e.g. "notifications.question_assigned.title")
        body_key:
          type: string
          description: i18n key for the notification body text
        i18n_params:
          type: object
          additionalProperties: true
          description: Interpolation parameters for the i18n keys
        icon:
          type: string
          description: Lucide icon name (e.g. "i-lucide-bell")
          nullable: true
        severity:
          $ref: "#/components/schemas/NotificationSeverity"
        link:
          type: string
          description: Navigation target URL
          nullable: true
        read:
          type: boolean
          description: Whether the notification has been read
        created_at:
          type: string
          format: date-time
          description: ISO 8601 timestamp of creation

    NotificationList:
      type: object
      required: [items, pagination]
      description: Paginated list of notifications
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Notification"
        pagination:
          $ref: "#/components/schemas/Pagination"

    BoardTaskRef:
      type: object
      required: [uuid, human_key, title, status, status_type]
      description: Lightweight task reference embedded in dashboard attention/overdue items
      properties:
        uuid:
          type: string
          format: uuid
        human_key:
          type: string
        title:
          type: string
        status:
          $ref: "#/components/schemas/TaskStatus"
        status_type:
          $ref: "#/components/schemas/TaskStatusType"

    BoardAttentionKind:
      type: string
      description: Discriminator for attention-panel items
      enum:
        - review_request
        - open_question_assigned
        - participation_directive
        - artifact_in_review
        - open_question_asked
        - owner_waiting_task

    BoardAttentionItem:
      type: object
      required: [kind, task, title, since, link]
      description: One deterministic attention item for waiting_on_me or waiting_on_others
      properties:
        kind:
          $ref: "#/components/schemas/BoardAttentionKind"
        task:
          $ref: "#/components/schemas/BoardTaskRef"
        title:
          type: string
          description: Short human-readable label for the item
        since:
          type: string
          format: date-time
          description: When this obligation / wait started
        link:
          type: string
          description: Deep-link to the source entity
        waiting_days:
          type: integer
          description: Whole days waited (waiting_on_others); omitted for waiting_on_me when not meaningful
        approvals_pending:
          type: integer
          description: Pending review approvals (artifact_in_review only)

    BoardAmpel:
      type: string
      description: Traffic-light for phase-goal deadlines (green is never listed)
      enum:
        - YELLOW
        - RED

    BoardOverdueItem:
      type: object
      required: [task, target_status, deadline, ampel, days]
      description: Most urgent yellow/red phase-goal deadline for a task the user belongs to
      properties:
        task:
          $ref: "#/components/schemas/BoardTaskRef"
        target_status:
          $ref: "#/components/schemas/TaskStatus"
        deadline:
          type: string
          format: date
          description: Date-only phase-goal deadline (YYYY-MM-DD)
        ampel:
          $ref: "#/components/schemas/BoardAmpel"
        days:
          type: integer
          description: Signed calendar days — negative = overdue, positive = remaining until deadline

    BoardAttentionBucket:
      type: object
      required: [count, items]
      description: Counted bucket of attention items
      properties:
        count:
          type: integer
          minimum: 0
        items:
          type: array
          items:
            $ref: "#/components/schemas/BoardAttentionItem"

    BoardOverdueBucket:
      type: object
      required: [count, items]
      description: Counted bucket of overdue/upcoming-deadline items
      properties:
        count:
          type: integer
          minimum: 0
        items:
          type: array
          items:
            $ref: "#/components/schemas/BoardOverdueItem"

    BoardSummary:
      type: object
      required: [waiting_on_me, waiting_on_others, overdue]
      description: Personal boards attention aggregate for the authenticated user
      properties:
        waiting_on_me:
          $ref: "#/components/schemas/BoardAttentionBucket"
        waiting_on_others:
          $ref: "#/components/schemas/BoardAttentionBucket"
        overdue:
          $ref: "#/components/schemas/BoardOverdueBucket"

    BoardBriefing:
      type: object
      required: [text, generated_at, stale]
      description: AI-generated personal briefing for the board
      properties:
        text:
          type: string
          nullable: true
          description: The briefing text, or null when no briefing could be generated yet.
        generated_at:
          type: string
          format: date-time
          nullable: true
          description: When the text was generated, or null when no briefing exists.
        stale:
          type: boolean
          description: True when the text is from a previous generation (LLM call failed).

    NotificationReadResult:
      type: object
      required: [unread_count]
      description: Result of a mark-read operation
      properties:
        unread_count:
          type: integer
          description: Remaining unread notification count for the user

    NotificationChannelPreference:
      type: object
      required: [channel, enabled, locked, is_override]
      description: Effective preference for a single channel of a notification type
      properties:
        channel:
          type: string
          description: Channel identifier (e.g. "TOAST", "TEAMS")
        enabled:
          type: boolean
          description: Whether this channel is currently enabled for the user
        locked:
          type: boolean
          description: True if the user cannot change this preference (systemCritical TOAST is always locked-on)
        is_override:
          type: boolean
          description: True when a stored row overrides the registry default; locked cells are always false

    NotificationTypePreference:
      type: object
      required: [type_code, label_key, channels]
      description: Effective preferences for all channels of a single notification type
      properties:
        type_code:
          type: string
          description: Notification type code (e.g. "task.member_added")
        label_key:
          type: string
          description: i18n key for the human-readable type label
        system_critical:
          type: boolean
          description: Whether this type is system-critical (TOAST always forced on)
        channels:
          type: array
          items:
            $ref: "#/components/schemas/NotificationChannelPreference"

    NotificationPreferencesMatrix:
      type: object
      required: [types]
      description: Full effective preferences matrix for the authenticated user
      properties:
        types:
          type: array
          items:
            $ref: "#/components/schemas/NotificationTypePreference"

    NotificationPreferenceEntry:
      type: object
      required: [type_code, channel, enabled]
      description: A single preference to update
      properties:
        type_code:
          type: string
          description: Notification type code
        channel:
          type: string
          description: Channel identifier
        enabled:
          type: boolean
          description: Whether to enable this channel for this type

    NotificationPreferencesUpdate:
      type: object
      required: [preferences]
      description: Batch preference update
      properties:
        preferences:
          type: array
          items:
            $ref: "#/components/schemas/NotificationPreferenceEntry"

    ActivityEvent:
      type: object
      required: [id, type, entity_type, entity_id, actor_id, source_type, title_key, payload, icon, is_ai_generated, created_at]
      description: One activity event on a task or artifact
      properties:
        id:
          type: string
          format: uuid
          description: Unique event UUID
        type:
          type: string
          description: Activity type code (e.g. "task.status_changed")
        entity_type:
          type: string
          enum: [TASK, ARTIFACT]
          description: Entity type discriminator
        entity_id:
          type: integer
          description: Internal entity ID
        actor_id:
          type: integer
          nullable: true
          description: ID of the user who triggered the event, or null for system events
        source_type:
          type: string
          enum: [AURA, USER, AGENT, EXTERNAL]
          description: Origin of the event (UI/CLI, a signed-in user action, a chat agent, or an external MCP client)
        title_key:
          type: string
          description: i18n key for the event title (e.g. "activity.task_status_changed")
        payload:
          type: object
          additionalProperties: true
          description: Machine-readable event payload (also used as interpolation parameters for the title key)
        icon:
          type: string
          nullable: true
          description: Lucide icon name (e.g. "i-lucide-flag")
        is_ai_generated:
          type: boolean
          description: True when this event's payload text (e.g. task.progress's note) was generated by an AI/skill; the actor still reflects the calling user.
        created_at:
          type: string
          format: date-time
          description: ISO 8601 timestamp of creation

    TaskLevelCascadeMove:
      type: object
      required: [task_id, human_key, title, from_level, to_level, from_status, to_status]
      description: One descendant a level-change cascade would re-level (AURA-1226).
      properties:
        task_id:
          type: string
          format: uuid
        human_key:
          type: string
        title:
          type: string
        from_level:
          $ref: "#/components/schemas/TaskLevel"
        to_level:
          $ref: "#/components/schemas/TaskLevel"
        from_status:
          $ref: "#/components/schemas/TaskStatus"
        to_status:
          $ref: "#/components/schemas/TaskStatus"

    TaskLevelCascadePreview:
      type: object
      required: [can_edit, primary, moves, denied_tasks]
      description: Dry-run result of a level-change cascade (AURA-1226) — nothing is persisted.
      properties:
        can_edit:
          type: boolean
          description: Whether the caller has TASK_EDIT_CONTENT on the task itself (independent of the cascade).
        primary:
          type: object
          required: [from_status, to_status, status_reset]
          description: The status effect of the level change on the task itself.
          properties:
            from_status:
              $ref: "#/components/schemas/TaskStatus"
            to_status:
              $ref: "#/components/schemas/TaskStatus"
            status_reset:
              type: boolean
              description: True when to_status differs from from_status because it did not exist in the target level's status series.
        moves:
          type: array
          items:
            $ref: "#/components/schemas/TaskLevelCascadeMove"
        denied_tasks:
          type: array
          description: Affected descendants the caller lacks TASK_EDIT_CONTENT on — submitting this change would fail with CASCADE_PERMISSION_DENIED.
          items:
            type: object
            required: [human_key, title]
            properties:
              human_key:
                type: string
              title:
                type: string

    ActivityEventList:
      type: object
      required: [items, pagination]
      description: Paginated list of activity events
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ActivityEvent"
        pagination:
          $ref: "#/components/schemas/Pagination"

    Pagination:
      type: object
      required: [page, limit, total, total_pages]
      description: Pagination metadata for list responses
      properties:
        page:
          type: integer
          description: Current page (1-based)
        limit:
          type: integer
          description: Number of items per page
        total:
          type: integer
          description: Total number of items
        total_pages:
          type: integer
          description: Total number of pages

    ProblemDetail:
      type: object
      description: "RFC 9457 Problem Details (https://www.rfc-editor.org/rfc/rfc9457)"
      required: [title, status]
      additionalProperties: true
      properties:
        type:
          type: string
          description: URI reference identifying the problem type
          default: "about:blank"
        title:
          type: string
          description: Short human-readable summary (stable per problem type)
        status:
          type: integer
          description: HTTP status code
        detail:
          type: string
          description: Human-readable explanation specific to this occurrence
        instance:
          type: string
          description: URI reference identifying this specific occurrence
        meta:
          type: object
          additionalProperties: true
          description: "Optional structured context for this occurrence (e.g. access-denied contact info, see AccessDeniedProblemDetail)"

    AccessDeniedProblemDetail:
      description: >
        RFC 9457 Problem Details for a per-object access denial (ANW-7662).
        `meta.reason` distinguishes a total stranger (`no_access`) from a
        member with too little permission for the requested action
        (`insufficient_permission`, e.g. has READ, the action needs EDIT).
      allOf:
        - $ref: "#/components/schemas/ProblemDetail"
        - type: object
          required: [meta]
          properties:
            meta:
              type: object
              required: [reason, owners]
              properties:
                reason:
                  type: string
                  enum: [no_access, insufficient_permission]
                owners:
                  type: array
                  description: Owner(s) who can grant more access (falls back to the creator on legacy objects without an OWNER member).
                  items:
                    type: object
                    required: [display_name]
                    properties:
                      display_name:
                        type: string

    JiraIssueLinkProblemDetail:
      description: >
        RFC 9457 Problem Details for the POST /tasks/{uuid}/jira-issues endpoint.
        `type` distinguishes the concrete failure reason so the frontend can show
        a localized message per case. On `already_linked`, `meta` names the
        blocking task when the caller can see it, otherwise only its owners
        (AURA-969). `meta.reason` is never set here — it would collide with
        AccessDeniedProblemDetail.
      allOf:
        - $ref: "#/components/schemas/ProblemDetail"
        - type: object
          required: [type]
          properties:
            type:
              type: string
              enum: [not_connected, already_linked, not_found, error, token_invalid]
            meta:
              type: object
              additionalProperties: false
              properties:
                blocking_task:
                  type: object
                  required: [uuid, title]
                  properties:
                    uuid:
                      type: string
                      format: uuid
                    human_key:
                      type: string
                      nullable: true
                    title:
                      type: string
                blocking_task_owners:
                  type: array
                  items:
                    type: string

    AsanaTaskLinkProblemDetail:
      description: >
        RFC 9457 Problem Details for the POST /tasks/{uuid}/asana-tasks endpoint.
        `type` distinguishes the concrete failure reason so the frontend can show
        a localized message per case. On `already_linked`, `meta` names the
        blocking task when the caller can see it, otherwise only its owners
        (AURA-969). `meta.reason` is never set here — it would collide with
        AccessDeniedProblemDetail.
      allOf:
        - $ref: "#/components/schemas/ProblemDetail"
        - type: object
          required: [type]
          properties:
            type:
              type: string
              enum: [not_connected, already_linked, not_found, error, token_invalid]
            meta:
              type: object
              additionalProperties: false
              properties:
                blocking_task:
                  type: object
                  required: [uuid, title]
                  properties:
                    uuid:
                      type: string
                      format: uuid
                    human_key:
                      type: string
                      nullable: true
                    title:
                      type: string
                blocking_task_owners:
                  type: array
                  items:
                    type: string

    AsanaCreateTarget:
      type: object
      description: >
        Where a new Asana counterpart for a task would be created (S6,
        AURA-1423). `subtask` means it becomes a child of the named Asana task;
        `project` means it is created in the project itself.
      required: [mode, project_name, parent_task_name]
      properties:
        mode:
          type: string
          enum: [subtask, project]
          description: Whether the object becomes a subtask or a project-level task.
        project_name:
          type: string
          nullable: true
          description: Name of the target Asana project, when the mirror knows it.
        parent_task_name:
          type: string
          nullable: true
          description: Name of the Asana task it would hang under; null in `project` mode.

    AsanaTaskCreateProblemDetail:
      description: >
        RFC 9457 Problem Details for the POST /tasks/{uuid}/asana-tasks/create
        endpoint (S6, AURA-1423). `no_target` means no ancestor is linked to
        Asana, so no project could be derived — nothing was created.
      allOf:
        - $ref: "#/components/schemas/ProblemDetail"
        - type: object
          required: [type]
          properties:
            type:
              type: string
              enum: [not_connected, token_invalid, already_linked, no_target, error]

    TaskJiraIssueDraft:
      type: object
      description: Derived Jira issue fields for a task, plus the statuses the "Create in Jira" dialog can offer (AURA-1239). Carries no team — that is the user's explicit choice in the dialog (AURA-1429).
      required: [issue_type, project_key, summary, allowed_statuses]
      properties:
        issue_type:
          type: string
          description: Jira issue type derived from the task level (or "Delivery Story" when the task has no level).
        project_key:
          type: string
          description: Jira project key the issue would be created in.
        summary:
          type: string
          description: Issue title, taken from the task title.
        description:
          type: string
          nullable: true
          description: Issue description, taken from the task description.
        allowed_statuses:
          type: array
          description: Target statuses the created issue may be transitioned to, for the dialog's status selector.
          items:
            type: string

    TaskJiraIssueDraftProblemDetail:
      description: RFC 9457 Problem Details for the GET /tasks/{uuid}/jira-issues/draft endpoint.
      allOf:
        - $ref: "#/components/schemas/ProblemDetail"
        - type: object
          required: [type]
          properties:
            type:
              type: string
              enum: [saga_not_supported, already_linked]

    TaskJiraIssueCreateRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          description: Target Jira status to transition the new issue to, e.g. "Selected". Chosen by the user in the dialog.
        team:
          type: string
          description: >-
            Jira team name the user picked in the dialog (AURA-1429). Required
            for every issue type except Sub-Task, which inherits its parent's
            team; there is no default, and omitting it for a top-level issue
            fails with 422.

    TaskJiraIssueCreateResult:
      type: object
      description: Result of creating (or discovering an already-linked) Jira issue for a task (AURA-1239).
      required: [issue_key, issue_url]
      properties:
        issue_key:
          type: string
          nullable: true
        issue_url:
          type: string
          nullable: true
        summary:
          type: string
          description: Present when a new issue was created.
        final_status:
          type: string
          nullable: true
          description: Present when a new issue was created.
        status_warning:
          type: string
          description: Set when the issue's status could not be transitioned to the requested target — created, but success with a warning.
        linking_warning:
          type: string
          description: Set when the issue was created in Jira but mirroring/linking it locally failed — success, not an error; the next sync repairs it.
        already_linked:
          type: boolean
          description: True when a concurrent request had already linked the task; no new issue was created.

    TaskJiraIssueCreateProblemDetail:
      description: RFC 9457 Problem Details for the POST /tasks/{uuid}/jira-issues/create endpoint.
      allOf:
        - $ref: "#/components/schemas/ProblemDetail"
        - type: object
          required: [type]
          properties:
            type:
              type: string
              enum: [saga_not_supported, jira_not_connected, jira_create_failed]

    AsanaWorkspaceRef:
      type: object
      description: A workspace visible to the connected Asana account
      required: [gid, name]
      properties:
        gid:
          type: string
          description: Asana workspace gid
        name:
          type: string
          description: Asana workspace display name

    AsanaStatus:
      type: object
      description: Asana connection status for the authenticated user
      required: [connected]
      properties:
        connected:
          type: boolean
          description: Whether an Asana PAT is stored for this user
        tokenInvalid:
          type: boolean
          description: Present and true when a stored PAT was rejected by Asana
        accountLabel:
          type: string
          description: Email or display name of the connected Asana account
        workspaceName:
          type: string
          description: Name of the primary workspace, when exactly one is visible
        workspaceGid:
          type: string
          description: Gid of the primary workspace, when exactly one is visible
        workspaces:
          type: array
          description: All workspaces visible to the connected account
          items:
            $ref: "#/components/schemas/AsanaWorkspaceRef"

    AsanaLinkResult:
      type: object
      description: Result of confirming an asana_propose_link proposal
      required: [status, gid, name, resourceType]
      properties:
        status:
          type: string
          enum: [ok]
        alreadyLinked:
          type: boolean
          description: True when this toolCallId or task was already confirmed (idempotent no-op)
        gid:
          type: string
          description: Gid of the linked Asana object
        name:
          type: string
          description: Name of the linked Asana object
        url:
          type: string
          nullable: true
          description: Deep link to the object in Asana
        resourceType:
          type: string
          description: "Asana resource type of the linked object, e.g. task or project"

    AsanaLinkConflict:
      type: object
      description: Returned when the Asana object is already linked to a different task
      required: [status, gid, name]
      properties:
        status:
          type: string
          enum: [already_linked]
        gid:
          type: string
          description: Gid of the Asana object that is already linked elsewhere
        name:
          type: string
          description: Name of the Asana object that is already linked elsewhere

    AsanaTaskSortField:
      type: string
      enum: [name, assignee, due_on, status_level, asana_updated_at, synced_at, created_at, updated_at]
      description: Fields by which Asana task lists can be sorted

    AsanaTaskLevel:
      type: string
      enum: [EPIC, STORY, SUBTASK]
      description: Aura level derived from the Asana structure (project-level task, its subtask, one level deeper)

    AsanaTaskListItem:
      type: object
      required: [id, gid, name, completed, created_at, updated_at]
      description: Lightweight, project-level Asana task row for list views
      properties:
        id:
          type: string
          format: uuid
          description: Local mirror UUID
        gid:
          type: string
          description: Asana task gid
        name:
          type: string
          description: Task name
        project_gid:
          type: string
          nullable: true
          description: Asana project gid the task belongs to
        project_name:
          type: string
          nullable: true
          description: Asana project display name
        section_name:
          type: string
          nullable: true
          description: Section the task currently sits in
        assignee:
          type: string
          nullable: true
          description: Display name of the assignee
        due_on:
          type: string
          format: date
          nullable: true
          description: Due date as reported by Asana
        status_level:
          type: string
          nullable: true
          enum: [open, in_progress, in_review, done]
          description: Coarse Aura status level mapped from Asana's status field; null when not bootstrapped for the task's project yet
        level:
          allOf:
            - $ref: "#/components/schemas/AsanaTaskLevel"
          nullable: true
          description: Aura level derived from the Asana structure; null when the parent chain is not mirrored far enough to derive it
        completed:
          type: boolean
          description: Whether the task is marked completed in Asana
        permalink:
          type: string
          nullable: true
          description: Deep link to the task in Asana
        asana_updated_at:
          type: string
          format: date-time
          nullable: true
          description: Timestamp of last update as reported by Asana
        synced_at:
          type: string
          format: date-time
          nullable: true
          description: Timestamp the mirror sync last saw this row
        created_at:
          type: string
          format: date-time
          description: Local mirror creation timestamp
        updated_at:
          type: string
          format: date-time
          description: Local mirror last update timestamp
        linked_task:
          allOf:
            - $ref: "#/components/schemas/AsanaTaskLinkedTask"
          nullable: true
          description: Aura task linked to this Asana task (if any)

    AsanaTaskList:
      type: object
      required: [items, pagination]
      description: Paginated list of locally mirrored Asana tasks
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AsanaTaskListItem"
        pagination:
          $ref: "#/components/schemas/Pagination"

    AsanaTaskLinkedTask:
      type: object
      required: [id, title]
      description: Slim reference to an Aura task linked to this Asana task
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string

    AsanaTaskDetail:
      type: object
      required: [id, gid, name, completed, created_at, updated_at]
      description: >-
        Full detail of a locally mirrored Asana task (S5, AURA-1409). Same
        fields as AsanaTaskListItem — the mirror does not store a description
        (`notes` is deliberately not mirrored), so there is nothing more to
        show than in the list row.
      properties:
        id:
          type: string
          format: uuid
          description: Local mirror UUID
        gid:
          type: string
          description: Asana task gid
        name:
          type: string
          description: Task name
        project_gid:
          type: string
          nullable: true
          description: Asana project gid the task belongs to
        project_name:
          type: string
          nullable: true
          description: Asana project display name
        section_name:
          type: string
          nullable: true
          description: Section the task currently sits in
        assignee:
          type: string
          nullable: true
          description: Display name of the assignee
        due_on:
          type: string
          format: date
          nullable: true
          description: Due date as reported by Asana
        status_level:
          type: string
          nullable: true
          enum: [open, in_progress, in_review, done]
          description: Coarse Aura status level mapped from Asana's status field; null when not bootstrapped for the task's project yet
        level:
          allOf:
            - $ref: "#/components/schemas/AsanaTaskLevel"
          nullable: true
          description: Aura level derived from the Asana structure; null when the parent chain is not mirrored far enough to derive it
        completed:
          type: boolean
          description: Whether the task is marked completed in Asana
        permalink:
          type: string
          nullable: true
          description: Deep link to the task in Asana
        asana_updated_at:
          type: string
          format: date-time
          nullable: true
          description: Timestamp of last update as reported by Asana
        synced_at:
          type: string
          format: date-time
          nullable: true
          description: Timestamp the mirror sync last saw this row
        created_at:
          type: string
          format: date-time
          description: Local mirror creation timestamp
        updated_at:
          type: string
          format: date-time
          description: Local mirror last update timestamp
        linked_task:
          allOf:
            - $ref: "#/components/schemas/AsanaTaskLinkedTask"
          nullable: true
          description: Aura task linked to this Asana task (if any)

    AsanaMirrorProjectItem:
      type: object
      required: [project_gid, project_name, task_count, last_synced_at, last_run_status, last_run_finished_at, last_run_error_message, truncated]
      description: Distinct project seen by the Asana mirror, with sync freshness (S6, AURA-1410)
      properties:
        project_gid:
          type: string
          description: Asana project gid
        project_name:
          type: string
          nullable: true
          description: Asana project display name
        task_count:
          type: integer
          description: Number of mirrored task rows for this project
        last_synced_at:
          type: string
          format: date-time
          nullable: true
          description: Timestamp the mirror last wrote a row for this project
        last_run_status:
          type: string
          nullable: true
          enum: [SUCCEEDED, FAILED]
          description: Outcome of the latest completed ASANA_SYNC run for this project; null if none exists yet
        last_run_finished_at:
          type: string
          format: date-time
          nullable: true
          description: When the latest completed run finished
        last_run_error_message:
          type: string
          nullable: true
          description: Set on a failed run, or on a successful-but-truncated one
        truncated:
          type: boolean
          description: True when the latest successful run only partially mirrored the project (page-limit reached)

    AsanaProjectOption:
      type: object
      required: [gid, name]
      description: One of the caller's own Asana projects (sync trigger selection)
      properties:
        gid:
          type: string
        name:
          type: string

    AsanaProjectSelection:
      type: object
      required: [status]
      description: The caller's Asana projects for the sync trigger selection, or an explanation why none is available (S6, AURA-1410)
      properties:
        status:
          type: string
          enum: [connected, not_connected, token_invalid, error]
        items:
          type: array
          items:
            $ref: "#/components/schemas/AsanaProjectOption"
          description: Present only when status is "connected"
        message:
          type: string
          description: Present only when status is "error"

    FieldError:
      type: object
      description: A single field-level validation error
      required: [detail, pointer]
      properties:
        detail:
          type: string
          description: Human-readable error description
        pointer:
          type: string
          description: "JSON Pointer (RFC 6901) to the erroneous field, e.g. #/name"
        code:
          type: string
          description: "Machine-readable error code, e.g. required, max, email"
        meta:
          type: object
          additionalProperties: true
          description: "Optional parameters for the error (e.g. max value, allowed values)"

    ValidationProblemDetail:
      description: "RFC 9457 Problem Details with required field-level validation errors"
      allOf:
        - $ref: "#/components/schemas/ProblemDetail"
        - type: object
          required: [errors]
          properties:
            errors:
              type: array
              items:
                $ref: "#/components/schemas/FieldError"

    RepositorySource:
      type: string
      enum: [LOCAL, BITBUCKET, GITHUB]
      description: Source system of the repository

    CodeCheckoutStatus:
      type: string
      enum: [NOT_CLONED, CLONING, READY, SYNCING, FAILED]
      description: Status of a local code checkout for a repository branch

    CodeCheckoutSummary:
      type: object
      required: [id, branch, status, created_at, updated_at]
      description: Summary of a local code checkout for a repository branch
      properties:
        id:
          type: string
          format: uuid
          description: Checkout UUID
        branch:
          type: string
          description: Git branch name
        status:
          $ref: "#/components/schemas/CodeCheckoutStatus"
        commit_sha:
          type: string
          nullable: true
          description: Current HEAD commit SHA after last successful sync
        commit_date:
          type: string
          format: date-time
          nullable: true
          description: Committer date (git %cI) of commit_sha — when that commit was made, not when it was synced. Null until the next sync after this field was introduced (ANW-7689).
        last_synced_at:
          type: string
          format: date-time
          nullable: true
          description: Timestamp of the last successful sync
        last_error:
          type: string
          nullable: true
          description: Last error message (scrubbed)
        size_bytes:
          type: integer
          format: int64
          nullable: true
          description: Checkout size in bytes
        indexed_at:
          type: string
          format: date-time
          nullable: true
          description: When repo-mcp last finished building a search index for this checkout (AURA-1642). Distinct from last_synced_at, which only means the clone itself is up to date, not that it is searchable. Null until the first index build completes.
        indexed_sha:
          type: string
          nullable: true
          description: Commit SHA the currently persisted search index was built from (AURA-1642). Compare against commit_sha to tell "indexed" from "cloned but still indexing" — they can briefly differ right after a new commit lands.
        created_at:
          type: string
          format: date-time
          description: ISO 8601 creation timestamp
        updated_at:
          type: string
          format: date-time
          description: ISO 8601 last update timestamp

    RepositoryListItem:
      type: object
      required: [id, source, workspace, slug, display_name, has_token, created_at, updated_at]
      description: Lightweight repository list item
      properties:
        knowledge_space_slug:
          type: string
          nullable: true
          description: Slug of the associated REPOSITORY KnowledgeSpace, if one exists (populated after first sync).
        id:
          type: string
          format: uuid
          description: Repository UUID
        source:
          $ref: "#/components/schemas/RepositorySource"
        workspace:
          type: string
          description: Workspace or organisation slug
        slug:
          type: string
          description: Repository slug within the workspace
        display_name:
          type: string
          description: Human-readable display name
        description:
          type: string
          nullable: true
          description: Optional description
        latest_doc_run:
          $ref: "#/components/schemas/DocRunSummary"
          nullable: true
          description: Summary of the most recent documentation run (null if none)
        latest_ingest_run:
          $ref: "#/components/schemas/IngestRunSummary"
          nullable: true
          description: Summary of the most recent ingest run (null if none)
        has_token:
          type: boolean
          description: Whether an access token (Bitbucket or GitHub) is stored for this repository
        token:
          $ref: "#/components/schemas/RepositoryTokenInfo"
          nullable: true
          description: Token metadata (type, email, updated_at); null when no token is stored. The token value is never returned.
        code_search_enabled:
          type: boolean
          description: Whether code search is enabled for this repository
        latest_code_checkout:
          $ref: "#/components/schemas/CodeCheckoutSummary"
          nullable: true
          description: Summary of the most recent code checkout (null if code search never enabled)
        doc_run_model_ref:
          type: string
          nullable: true
          description: Per-repository doc-run model ref (e.g. "bedrock::…"). Null means the global env default is used.
        doc_run_max_iterations:
          type: integer
          nullable: true
          minimum: 1
          maximum: 100
          description: Per-repository doc-run iteration limit. Null means the global env default is used.
        last_doc_run_coverage:
          type: string
          enum: [COMPLETE, INCOMPLETE, UNKNOWN]
          description: Coverage state from the most recent completed doc run
        last_doc_run_estimated_iterations:
          type: integer
          nullable: true
          description: Estimated total iterations needed for full coverage (from Phase 3 assessment of last run)
        last_doc_run_coverage_note:
          type: string
          nullable: true
          description: Human-readable note on what is still missing from the last run's Phase 3 assessment
        last_doc_run_coverage_summary:
          type: string
          nullable: true
          description: One-sentence coverage summary for compact display (from Phase 3 assessment of last run)
        created_at:
          type: string
          format: date-time
          description: ISO 8601 creation timestamp
        updated_at:
          type: string
          format: date-time
          description: ISO 8601 last update timestamp

    RepositoryRunStatus:
      type: object
      required: [id, code_search_enabled, last_doc_run_coverage]
      description: Focused run-status snapshot for a single repository — only the latest run summaries, no structural fields.
      properties:
        id:
          type: string
          format: uuid
          description: Repository UUID
        latest_doc_run:
          $ref: "#/components/schemas/DocRunSummary"
          nullable: true
          description: Summary of the most recent documentation run (null if none)
        latest_ingest_run:
          $ref: "#/components/schemas/IngestRunSummary"
          nullable: true
          description: Summary of the most recent ingest run (null if none)
        code_search_enabled:
          type: boolean
          description: Whether code search is enabled for this repository
        latest_code_checkout:
          $ref: "#/components/schemas/CodeCheckoutSummary"
          nullable: true
          description: Summary of the most recent code checkout (null if code search never enabled)
        last_doc_run_coverage:
          type: string
          enum: [COMPLETE, INCOMPLETE, UNKNOWN]
          description: Coverage state from the most recent completed doc run
        last_doc_run_estimated_iterations:
          type: integer
          nullable: true
          description: Estimated total iterations needed for full coverage (from Phase 3 assessment of last run)
        last_doc_run_coverage_note:
          type: string
          nullable: true
          description: Human-readable note on what is still missing from the last run's Phase 3 assessment
        last_doc_run_coverage_summary:
          type: string
          nullable: true
          description: One-sentence coverage summary for compact display (from Phase 3 assessment of last run)

    IngestRunSummary:
      type: object
      required: [id, status, source_branch, started_at, updated_at]
      description: Summary of a single PR-ingest run
      properties:
        id:
          type: string
          format: uuid
          description: Run UUID
        status:
          type: string
          enum: [PENDING, FETCHING, INGESTING, SUCCEEDED, FAILED]
          description: Current status of the ingest run
        source_branch:
          type: string
          description: Branch the documents were fetched from
        pr_url:
          type: string
          nullable: true
          description: URL of the pull request (informational)
        docs_created:
          type: integer
          nullable: true
          description: Number of new documents created
        docs_updated:
          type: integer
          nullable: true
          description: Number of existing documents updated
        docs_deleted:
          type: integer
          nullable: true
          description: Number of documents deleted (no longer in branch)
        chunks_embedded:
          type: integer
          nullable: true
          description: Number of chunks successfully embedded
        error_message:
          type: string
          nullable: true
          description: Error message if the run failed
        started_at:
          type: string
          format: date-time
          description: When the ingest run was started
        finished_at:
          type: string
          format: date-time
          nullable: true
          description: When the run finished (null if still running)
        updated_at:
          type: string
          format: date-time
          description: When the run row was last updated

    IngestRunTriggerResponse:
      type: object
      required: [run_id]
      description: Identifier of the ingest run that was started
      properties:
        run_id:
          type: string
          format: uuid
          description: UUID of the newly created ingest run

    DocRunSummary:
      type: object
      required: [id, status, trigger, started_at, updated_at]
      description: Summary of a single documentation generation run
      properties:
        id:
          type: string
          format: uuid
          description: Run UUID
        status:
          type: string
          enum: [PENDING, CLONING, ANALYZING, WRITING, PUBLISHING, SUCCEEDED, FAILED]
          description: Current status of the run
        trigger:
          type: string
          enum: [CLI, ENDPOINT, WEBHOOK, SCHEDULED, CRAWL]
          description: What triggered this run
        repo_ref:
          type: string
          nullable: true
          description: Git URL or local path used for this run
        iteration:
          type: integer
          nullable: true
          description: Current agent iteration (null until ANALYZING phase)
        max_iterations:
          type: integer
          nullable: true
          description: Maximum allowed agent iterations
        last_tool_name:
          type: string
          nullable: true
          description: Name of the last tool called by the agent
        phase_detail:
          type: string
          nullable: true
          description: Short description of the current phase (tool + truncated args)
        docs_emitted:
          type: integer
          nullable: true
          description: Number of .aura/docs/ documents emitted (null until run completes)
        questions_found:
          type: integer
          nullable: true
          description: Number of ::question{} markers found in emitted documents
        input_tokens:
          type: integer
          nullable: true
          description: Total input tokens consumed
        output_tokens:
          type: integer
          nullable: true
          description: Total output tokens produced
        cost_usd:
          type: number
          format: float
          nullable: true
          description: Total LLM cost in USD (null until run completes)
        had_changes:
          type: boolean
          nullable: true
          description: Whether the run produced any new or changed documents
        branch_pushed:
          type: string
          nullable: true
          description: Git branch the docs were pushed to (null if PR was skipped)
        commit_sha:
          type: string
          nullable: true
          description: SHA of the commit pushed to the docs branch
        source_commit_sha:
          type: string
          nullable: true
          description: HEAD SHA of the analyzed source repository at checkout time (distinct from commit_sha, which is the pushed aura/docs commit). Null until the next doc run after this field was introduced (ANW-7689).
        source_commit_date:
          type: string
          format: date-time
          nullable: true
          description: Committer date (git %cI) of source_commit_sha. Null until the next doc run after this field was introduced (ANW-7689).
        pr_url:
          type: string
          nullable: true
          description: URL of the opened pull request (null if none)
        error_message:
          type: string
          nullable: true
          description: Error message if the run failed
        reached_iteration_limit:
          type: boolean
          nullable: true
          description: True when the run stopped at the iteration cap rather than finishing on its own
        pre_run_estimated_iterations:
          type: integer
          nullable: true
          description: Pre-run estimate (Phase 1) of how many iterations would be needed for full coverage
        coverage_complete:
          type: boolean
          nullable: true
          description: Whether the Phase 3 assessment considers the documentation complete (null if assessment failed)
        coverage_estimated_iterations:
          type: integer
          nullable: true
          description: Phase 3 estimate of total iterations needed for full coverage (null if assessment failed)
        coverage_note:
          type: string
          nullable: true
          description: Phase 3 human-readable note on what is still missing (null if assessment failed or complete)
        started_at:
          type: string
          format: date-time
          description: When the run was started
        finished_at:
          type: string
          format: date-time
          nullable: true
          description: When the run finished (null if still running)
        updated_at:
          type: string
          format: date-time
          description: When the run row was last updated

    DocRunList:
      type: object
      required: [items]
      description: List of recent documentation runs for a repository
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/DocRunSummary"

    DocRunTriggerRequest:
      type: object
      description: Options for triggering a documentation run
      properties:
        force:
          type: boolean
          default: false
          description: When true, bypass the staleness check and run regardless.
        max_iterations:
          type: integer
          minimum: 1
          maximum: 100
          nullable: true
          description: >-
            Per-run iteration limit override (1–100). Supersedes the per-repo setting and the
            global PROCESS_DOCS_MAX_ITERATIONS env default. Omit or set to null to use the
            repo-level or global default.

    DocRunTriggerResponse:
      type: object
      required: [run_id]
      description: Identifier of the documentation run that was started
      properties:
        run_id:
          type: string
          format: uuid
          description: UUID of the newly created documentation run.

    Repository:
      type: object
      required: [id, source, workspace, slug, display_name, has_token, created_at, updated_at]
      description: Full repository object
      properties:
        id:
          type: string
          format: uuid
          description: Repository UUID
        source:
          $ref: "#/components/schemas/RepositorySource"
        workspace:
          type: string
          description: Workspace or organisation slug
        slug:
          type: string
          description: Repository slug within the workspace
        display_name:
          type: string
          description: Human-readable display name
        description:
          type: string
          nullable: true
          description: Optional description
        default_branch:
          type: string
          nullable: true
          description: Default branch name
        last_synced_at:
          type: string
          format: date-time
          nullable: true
          description: Timestamp of the latest sync run (null if never synced)
        has_token:
          type: boolean
          description: Whether an access token (Bitbucket or GitHub) is stored for this repository
        token:
          $ref: "#/components/schemas/RepositoryTokenInfo"
          nullable: true
          description: Token metadata (type, email, updated_at); null when no token is stored. The token value is never returned.
        created_at:
          type: string
          format: date-time
          description: ISO 8601 creation timestamp
        updated_at:
          type: string
          format: date-time
          description: ISO 8601 last update timestamp

    RepositoryList:
      type: object
      required: [items]
      description: List of repositories
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/RepositoryListItem"
          description: All repository entries

    RepositorySyncRun:
      type: object
      required: [synced_at, document_count]
      description: Summary of a single repository sync run
      properties:
        synced_at:
          type: string
          format: date-time
          description: When the sync run occurred
        document_count:
          type: integer
          description: Number of document paths processed in this sync run

    RepositorySyncHistory:
      type: object
      required: [items]
      description: Recent sync runs for a repository (most recent first)
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/RepositorySyncRun"
          description: Recent sync runs

    RepositoryDetail:
      type: object
      required: [id, source, workspace, slug, display_name, has_token, created_at, updated_at]
      description: Full repository detail
      properties:
        knowledge_space_slug:
          type: string
          nullable: true
          description: Slug of the associated REPOSITORY KnowledgeSpace, if one exists (populated after first sync).
        id:
          type: string
          format: uuid
        source:
          $ref: "#/components/schemas/RepositorySource"
        workspace:
          type: string
        slug:
          type: string
        display_name:
          type: string
        description:
          type: string
          nullable: true
        default_branch:
          type: string
          nullable: true
        has_token:
          type: boolean
          description: Whether an access token (Bitbucket or GitHub) is stored for this repository
        token:
          $ref: "#/components/schemas/RepositoryTokenInfo"
          nullable: true
          description: Token metadata (type, email, updated_at); null when no token is stored. The token value is never returned.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    SyncPayload:
      type: object
      required: [documents]
      description: Snapshot payload sent by the collector script
      properties:
        repository:
          type: object
          description: Optional repository metadata to upsert
          properties:
            display_name:
              type: string
            description:
              type: string
              nullable: true
            default_branch:
              type: string
              nullable: true
            external_id:
              type: string
              nullable: true
        documents:
          type: array
          items:
            type: object
            required: [path, body]
            properties:
              path:
                type: string
                description: Relative path within the repository
              body:
                type: string
                description: Full raw markdown content including frontmatter

    SyncResult:
      type: object
      required: [repository, summary]
      description: Result of a sync operation
      properties:
        repository:
          type: object
          required: [uuid]
          properties:
            uuid:
              type: string
              format: uuid
        summary:
          type: object
          required: [created, updated, unchanged, deleted]
          properties:
            created:
              type: integer
            updated:
              type: integer
            unchanged:
              type: integer
            deleted:
              type: integer

    RepositoryTokenType:
      type: string
      enum: [ACCESS_TOKEN, ACCOUNT_API_TOKEN]
      description: >-
        Type of access token stored for this repository.
        ACCESS_TOKEN: a repository/workspace-scoped access token (Bitbucket Repository/Workspace
        Access Token, or a GitHub Personal Access Token). Git username: x-token-auth for
        Bitbucket, x-access-token for GitHub.
        ACCOUNT_API_TOKEN: Bitbucket-only Atlassian Account API Token (git username
        x-bitbucket-api-token-auth, REST username = account email). Not supported for GitHub.

    RepositoryTokenInfo:
      type: object
      required: [type, updated_at]
      description: Metadata about the stored access token (value is never returned)
      properties:
        type:
          $ref: "#/components/schemas/RepositoryTokenType"
        email:
          type: string
          nullable: true
          description: >-
            Account email for ACCOUNT_API_TOKEN (Bitbucket only, used as REST Basic-auth
            username); always null for ACCESS_TOKEN and for GitHub repositories.
        updated_at:
          type: string
          format: date-time
          description: When the token was last set or replaced

    RepositoryAccessTokenInput:
      type: object
      required: [value, type]
      description: >-
        Access token to store for this repository (write-only; the value is never returned by the API).
        GitHub repositories only support type=ACCESS_TOKEN (a GitHub Personal Access Token).
        Required for ACCOUNT_API_TOKEN (Bitbucket only): the email field must be the Atlassian account email.
      properties:
        value:
          type: string
          minLength: 1
          description: The raw token value (stored encrypted)
        type:
          $ref: "#/components/schemas/RepositoryTokenType"
        email:
          type: string
          description: Atlassian account email — required when type is ACCOUNT_API_TOKEN (Bitbucket only)

    RepositoryCreate:
      type: object
      required: [clone_url]
      description: >-
        Payload for creating a new repository. The identity (source, workspace, slug)
        is derived from clone_url; only the clone URL is required.
      properties:
        clone_url:
          type: string
          minLength: 1
          description: >-
            Git clone URL (HTTPS or SSH). source, workspace and slug are derived from it
            (bitbucket.org → BITBUCKET, github.com → GITHUB, otherwise LOCAL).
        display_name:
          type: string
          minLength: 1
          description: Optional human-readable display name; defaults to the derived slug.
        description:
          type: string
          nullable: true
          description: Optional description
        access_token:
          $ref: "#/components/schemas/RepositoryAccessTokenInput"
          description: >-
            Optional access token. Only relevant for BITBUCKET and GITHUB repositories
            (ignored for LOCAL). Validated against the provider's API before being stored.
        doc_run_model_ref:
          type: string
          nullable: true
          description: Per-repository doc-run model ref. Must be a valid bedrock model id from the doc-run-models list. Null = global env default.
        doc_run_max_iterations:
          type: integer
          nullable: true
          minimum: 1
          maximum: 100
          description: Per-repository doc-run iteration limit (1–100). Null = global env default.

    RepositoryPatch:
      type: object
      description: Payload for updating a repository (all fields optional)
      properties:
        display_name:
          type: string
          minLength: 1
          description: Human-readable display name
        description:
          type: string
          nullable: true
          description: Optional description
        access_token:
          $ref: "#/components/schemas/RepositoryAccessTokenInput"
          description: >-
            Replace the stored access token. The new token is validated against the
            repository's provider (Bitbucket or GitHub) before being stored. The previous
            token value is discarded immediately.
        doc_run_model_ref:
          type: string
          nullable: true
          description: Per-repository doc-run model ref. Must be a valid bedrock model id from the doc-run-models list. Null = global env default.
        doc_run_max_iterations:
          type: integer
          nullable: true
          minimum: 1
          maximum: 100
          description: Per-repository doc-run iteration limit (1–100). Null = global env default.

    DocRunModelEntry:
      type: object
      required: [id, display_name, description, recommended]
      description: A single model available for per-repository doc-runs
      properties:
        id:
          type: string
          description: Full model ref in "provider::model" format
        display_name:
          type: string
          description: Human-readable model name
        description:
          type: string
          description: Short description of the model
        recommended:
          type: boolean
          description: Whether this model is the recommended default

    DocRunModelList:
      type: object
      required: [models, default_model_ref]
      description: Available doc-run models and the current global default
      properties:
        models:
          type: array
          items:
            $ref: "#/components/schemas/DocRunModelEntry"
        default_model_ref:
          type: string
          description: The effective global default model ref (from PROCESS_DOCS_MODEL env var or built-in fallback)

    UserRole:
      type: string
      enum: [ADMIN, LEADERSHIP, EMPLOYEE]
      description: User role

    UserSortField:
      type: string
      enum: [created_at, last_seen_at, display_name, email, role]
      description: Sortable fields for user list

    User:
      type: object
      required: [id, ldap_uid, role, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
          description: User UUID
        ldap_uid:
          type: string
          description: LDAP user identifier
        display_name:
          type: string
          nullable: true
          description: Display name from LDAP
        email:
          type: string
          nullable: true
          description: Email address
        role:
          $ref: "#/components/schemas/UserRole"
        created_at:
          type: string
          format: date-time
          description: ISO 8601 creation timestamp
        updated_at:
          type: string
          format: date-time
          description: ISO 8601 last update timestamp
        last_seen_at:
          type: string
          format: date-time
          nullable: true
          description: ISO 8601 timestamp of last login

    UserList:
      type: object
      required: [items, pagination]
      description: Paginated list of users
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/User"
          description: User items for the current page
        pagination:
          $ref: "#/components/schemas/Pagination"

    UserUpdateInput:
      type: object
      required: [role]
      properties:
        role:
          $ref: "#/components/schemas/UserRole"

    ChatStatus:
      type: string
      enum: [ACTIVE, DELETED]
      description: Technical chat status (active vs. soft-deleted)

    ChatLifecycle:
      type: string
      enum: [OPEN, DONE]
      description: Functional lifecycle of a chat judged against its stated goal

    ChatSortField:
      type: string
      enum: [created_at, updated_at, title]
      description: Sortable fields for chat list

    ChatVisibility:
      type: string
      enum: [PRIVATE, PUBLIC]
      description: >
        Owner-controlled sharing state. PRIVATE (default) = only the owner sees the chat.
        PUBLIC = task members of a linked task get read access. Can only be set to PUBLIC
        while the chat has at least one task link; once set, it is not auto-reverted when
        that last link is later removed (visibility stays a stored preference).

    ChatVisibilityUpdate:
      type: object
      required: [visibility]
      properties:
        visibility:
          $ref: "#/components/schemas/ChatVisibility"

    Chat:
      type: object
      required: [id, uuid, chatbot_code, status, visibility, goal_confirmed, lifecycle, lifecycle_manual, created_at, updated_at, is_owner, permission, shared]
      properties:
        id:
          type: integer
          description: Chat ID
        uuid:
          type: string
          format: uuid
          description: Chat UUID
        chatbot_code:
          type: string
          description: Chatbot code used to open this chat (e.g. default)
        title:
          type: string
          nullable: true
          description: Chat title
        status:
          $ref: "#/components/schemas/ChatStatus"
        visibility:
          $ref: "#/components/schemas/ChatVisibility"
        goal:
          type: string
          nullable: true
          description: The chat's stated goal (its purpose); null = neutral / no goal yet
        goal_confirmed:
          type: boolean
          description: True when the goal was confirmed by the user; false = provisional (AI-derived)
        goal_proposal:
          type: string
          nullable: true
          description: Pending AI goal suggestion while a confirmed goal already exists; null = none
        lifecycle:
          $ref: "#/components/schemas/ChatLifecycle"
        lifecycle_reason:
          type: string
          nullable: true
          description: Why the chat is still OPEN (what is unresolved), or a completion note when DONE
        lifecycle_manual:
          type: boolean
          description: True once a user set the lifecycle manually (automation no longer changes it)
        tasks:
          type: array
          items:
            $ref: "#/components/schemas/ChatTaskSlimRef"
          description: Tasks linked to this chat (empty array if none)
        created_by:
          type: string
          nullable: true
          description: Display name or LDAP username of the creator
        created_at:
          type: string
          format: date-time
          description: ISO 8601 creation timestamp
        updated_at:
          type: string
          format: date-time
          description: ISO 8601 last update timestamp
        is_owner:
          type: boolean
          description: Whether the current user is the direct owner of this chat
        permission:
          type: string
          enum: [READ, EDIT, MANAGE]
          description: Effective permission of the requesting user (READ < EDIT < MANAGE)
        shared:
          type: boolean
          description: True when this chat is shared with the current user via task cascade (not directly owned)

    ChatList:
