          nullable: true
          description: Optional free-text description
        members:
          type: array
          items:
            $ref: "#/components/schemas/UserGroupMemberItem"
          description: Members of the group

    UserGroupCreateInput:
      type: object
      required: [name]
      description: Payload for creating a user group
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Display name (not unique)
        description:
          type: string
          maxLength: 2000
          description: Optional free-text description

    UserGroupUpdateInput:
      type: object
      required: [name]
      description: Payload for updating a user group
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: New display name
        description:
          type: string
          maxLength: 2000
          description: New description (omit or null to clear)

    UserGroupMemberAddInput:
      type: object
      required: [user_uuid, role]
      description: Payload for adding a member to a group
      properties:
        user_uuid:
          type: string
          format: uuid
          description: UUID of the user to add
        role:
          $ref: "#/components/schemas/UserGroupMemberRole"

    UserGroupMemberRoleInput:
      type: object
      required: [role]
      description: Payload for changing a member's role
      properties:
        role:
          $ref: "#/components/schemas/UserGroupMemberRole"

    TaskRelationRef:
      type: object
      required: [id, type, task_id, task_human_key, task_title]
      description: Slim relation reference embedded in task detail
      properties:
        id:
          type: string
          format: uuid
          description: Relation UUID (public identifier)
        type:
          $ref: "#/components/schemas/TaskRelationType"
        task_id:
          type: string
          format: uuid
          description: UUID of the other task in the relation
        task_human_key:
          type: string
          description: Human-readable, immutable identifier of the other task, used to build readable task links (ANW-7857).
        task_title:
          type: string
          description: Title of the other task (denormalized for display)
        direction:
          type: string
          enum: [FROM, TO]
          description: "FROM = this task is the source; TO = this task is the target"

    TaskRelationCreate:
      type: object
      required: [type, toTaskId]
      description: Payload for creating a typed relation from this task to another
      properties:
        type:
          $ref: "#/components/schemas/TaskRelationType"
        toTaskId:
          type: string
          format: uuid
          description: UUID of the target task

    TaskPhaseGoal:
      type: object
      required: [phase, deadline, goal_description, is_overdue, created_at, updated_at]
      description: >
        One row of the per-phase "Phasen-Rahmen" roadmap (T18 · S28, ANW-7516;
        per-phase key ANW-7764): the deadline and free-text goal for one work phase.
      properties:
        phase:
          type: string
          description: >
            The work phase this goal is for (refinement/alignment/development/
            review/deployment). A free string, validated against the phases
            present in the task's status series in the API layer.
        deadline:
          type: string
          format: date
          nullable: true
          description: Day-only deadline (no time component).
        goal_description:
          type: string
          description: Free-text phase goal ("Auftrag der Runde"), may be empty.
        is_overdue:
          type: boolean
          description: >
            True when the deadline is set, lies before today, and the owning task
            is still due-relevant (not DONE/DISCARDED, not archived). Traffic-light
            thresholds (YELLOW/RED windows) remain separate (S14 / classifyDeadlineAmpel).
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    TaskPhaseGoalUpsert:
      type: object
      description: Payload for creating/updating the phase-goal row for one target status (all fields optional).
      properties:
        deadline:
          type: string
          format: date
          nullable: true
          description: Day-only deadline, or null to clear it.
        goal_description:
          type: string
          description: Free-text phase goal.

    TaskPhaseGoalBatchUpsertItem:
      type: object
      required: [phase, deadline, goal_description]
      description: >
        One dirty row from the combined status-history/phase-goal table. A row with
        `deadline: null` and an empty `goal_description` deletes the phase goal for
        that phase instead of upserting it.
      properties:
        phase:
          type: string
          description: >
            The work phase this goal is for (must be one of the phases present in
            the task's status series and not yet passed).
        deadline:
          type: string
          format: date
          nullable: true
          description: Day-only deadline, or null to clear it.
        goal_description:
          type: string
          description: Free-text phase goal, may be empty.

    TaskPhaseGoalBatchUpsert:
      type: object
      required: [goals]
      description: Batch payload for saving every dirty phase-goal row in one atomic call.
      properties:
        goals:
          type: array
          items:
            $ref: "#/components/schemas/TaskPhaseGoalBatchUpsertItem"

    TaskTagAttach:
      type: object
      required: [name]
      description: Payload for attaching a tag to a task
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Tag display name (will be normalised to a slug)

    TaskHierarchyRef:
      type: object
      required: [id, human_key, title]
      description: Slim reference to a task in the hierarchy (parent or child)
      properties:
        id:
          type: string
          format: uuid
          description: Task UUID
        human_key:
          type: string
          description: Human-readable, immutable task identifier (e.g. "AURA-42"), used to build readable task links (ANW-7857).
        title:
          type: string
          description: Task title
        level:
          $ref: "#/components/schemas/TaskLevel"
          nullable: true
          description: Hierarchy level (null if not assigned)

    TaskChildRef:
      allOf:
        - $ref: "#/components/schemas/TaskHierarchyRef"
        - type: object
          required: [rank]
          description: >
            Direct child on TaskDetail — extends TaskHierarchyRef with the
            child's priority rank inside this parent's context (AURA-930).
          properties:
            rank:
              type: integer
              nullable: true
              description: >
                Position in the parent's ordered zone (1…n); null when the
                child is still unordered.
            story_points_contribution:
              $ref: "#/components/schemas/StoryPointContribution"
              nullable: true
              description: >
                This child's contribution to the parent's story-point sum
                (own value, or the sum of the deepest estimated layer below).
                Null when the child contributes nothing (discarded, archived,
                or unestimated).

    StoryPointValue:
      type: object
      required: [key, weight, origin, corrected, label]
      description: Effective story-point value on a Story or Sub-Task.
      properties:
        key:
          type: string
          description: Scale key (e.g. "5").
        weight:
          type: integer
          description: Numeric weight used in sums.
        origin:
          type: string
          enum: [AI, HUMAN]
          description: Origin of the effective value.
        corrected:
          type: boolean
          description: True when a human correction is in effect.
        label:
          type: string
          description: Display label for the key.

    StoryPointContribution:
      type: object
      required: [weight, is_sum]
      description: A child's contribution to a parent sum.
      properties:
        weight:
          type: integer
        is_sum:
          type: boolean
          description: True when this contribution is a sum of descendants.
        label:
          type: string
          nullable: true
          description: Display label when the contribution is a single key.

    StoryPointChildrenAggregate:
      type: object
      required: [total_weight, estimated_count, total_count]
      description: Sum and coverage of children's story-point contributions.
      properties:
        total_weight:
          type: integer
        estimated_count:
          type: integer
          description: Children that contribute a value.
        total_count:
          type: integer
          description: Visible living children (not discarded or archived).

    StoryPointEstimate:
      type: object
      required: [id, origin, trigger, key, weight, rationale, created_at, created_by]
      description: One append-only story-point history row.
      properties:
        id:
          type: string
          format: uuid
        origin:
          type: string
          enum: [AI, HUMAN]
        trigger:
          type: string
          description: How the row came into existence (`manual` or `chat`).
        key:
          type: string
          nullable: true
        weight:
          type: integer
          nullable: true
        rationale:
          type: string
        inputs:
          nullable: true
          description: Evidence the AI read; null on human rows.
        created_at:
          type: string
          format: date-time
        created_by:
          type: object
          nullable: true
          required: [id, display_name]
          properties:
            id:
              type: string
              format: uuid
            display_name:
              type: string
              nullable: true

    StoryPointEstimateList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/StoryPointEstimate"

    StoryPointWriteInput:
      type: object
      required: [key]
      properties:
        key:
          type: string
          nullable: true
          description: Scale key to set, or null to withdraw a human correction.
        rationale:
          type: string
          maxLength: 4000
          description: >
            Why this size, or why the value is being withdrawn. Optional for a
            human write; mandatory when origin is AI, because an unexplained
            machine estimate carries nothing.
        origin:
          type: string
          enum: [AI, HUMAN]
          default: HUMAN
          description: >
            Who the value came from. HUMAN (the default) is a correction and
            takes precedence over every AI estimate; AI records a proposal the
            caller accepted unchanged and leaves that precedence untouched.

    StoryPointProposal:
      type: object
      required: [refused, key, weight, rationale]
      description: An estimator result that has not been recorded.
      properties:
        refused:
          type: boolean
          description: True when the basis was too thin to pick a size.
        key:
          type: string
          nullable: true
          description: Proposed scale key; null on a refusal.
        weight:
          type: integer
          nullable: true
          description: Weight matching the key; null on a refusal.
        rationale:
          type: string
          description: Why this size, or why the estimate was refused.

    StoryPointAcceptInput:
      type: object
      required: [toolCallId]
      properties:
        toolCallId:
          type: string
          format: uuid
          description: UUID of the ChatToolCall record created by task_estimate_story_points.

    PriorityContextRef:
      allOf:
        - $ref: "#/components/schemas/TaskHierarchyRef"
        - type: object
          required: [rank]
          description: >
            Ancestor on a derived-priority entry's context_path (AURA-930) —
            extends TaskHierarchyRef with that ancestor's own priority rank
            inside its parent context, so the card can show e.g.
            "AURA-662 Maintenance (Priorität: keine)".
          properties:
            rank:
              type: integer
              nullable: true
              description: >
                Position of this ancestor in its own ordered zone (1…n);
                null when the ancestor is still unordered.

    PriorityBlock:
      type: string
      enum: [asap, ordered, free, unordered]
      description: >
        Which of the four blocks of the derived order an entry sits in
        (AURA-930 / AURA-1146). "asap" is the class above all ordering;
        "ordered" is the depth-first walk of the ranked tree; "free" are tasks
        below a deliberately unordered level, which the executor may pick
        between; "unordered" is everything without a rank, behind the
        "unprioritized from here" marker.

    PriorityBlockerRef:
      type: object
      required: [id, human_key, title]
      description: A living task that holds a BLOCKS relation onto the entry (AURA-930, d-020).
      properties:
        id:
          type: string
          format: uuid
        human_key:
          type: string
        title:
          type: string

    MyPriorityItem:
      type: object
      required: [id, human_key, title, status, status_type, block, asap, blocked_by, context_path, governing_date, capacity_percent]
      description: One entry of a person's derived priority order (AURA-930 / AURA-1146).
      properties:
        id:
          type: string
          format: uuid
        human_key:
          type: string
        title:
          type: string
        status:
          $ref: "#/components/schemas/TaskStatus"
        status_type:
          $ref: "#/components/schemas/TaskStatusType"
        level:
          $ref: "#/components/schemas/TaskLevel"
          nullable: true
        block:
          $ref: "#/components/schemas/PriorityBlock"
        rank:
          type: integer
          nullable: true
          minimum: 1
          description: >
            The task's position inside its own context — null in the unordered
            block. Never a position within this queue: blocks 1, 3 and 4 carry
            no ranking among themselves.
        asap:
          type: boolean
        blocked_by:
          type: array
          description: Empty unless a living task blocks this one; the entry keeps its position either way.
          items:
            $ref: "#/components/schemas/PriorityBlockerRef"
        context_path:
          type: array
          description: Ancestors root → direct parent, so the reader can see where the order comes from.
          items:
            $ref: "#/components/schemas/PriorityContextRef"
        governing_date:
          type: string
          format: date
          nullable: true
          description: >-
            The date-rail badge's governing deadline (AURA-930 / AURA-1149):
            the current phase's TaskPhaseGoal.deadline, else the next future
            phase deadline, else null (no badge).
        capacity_percent:
          type: integer
          nullable: true
          description: >-
            The committed capacity of the queue's own person on this task
            (AURA-1146 Nachtrag); null when unset or not a core-team role.

    MyPriorityQueue:
      type: object
      required: [items, total, unordered_count]
      description: >
        A person's complete derived priority order (AURA-930 / AURA-1146).
        Deliberately unpaginated — the four-block sequence is one answer. An
        opt-in `limit` bounds `items` only (AURA-1390 / D8); the counts below
        keep describing the whole queue.
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/MyPriorityItem"
        total:
          type: integer
          description: Number of entries in the whole queue, whether or not `items` was bounded.
        unordered_count:
          type: integer
          description: >
            How many entries fall into the "unordered" block. Equal to total
            while nobody has ordered anything yet — the signal the empty state
            uses to explain itself instead of showing an empty box (d-018).

    PersonPriorityItem:
      description: >-
        One entry of a foreign queue the caller may fully read (AURA-930 /
        AURA-1148). Same shape as `MyPriorityItem`, discriminated by
        `placeholder: false`.
      allOf:
        - $ref: "#/components/schemas/MyPriorityItem"
        - type: object
          required: [placeholder]
          properties:
            placeholder:
              type: boolean
              enum: [false]

    PersonPriorityPlaceholder:
      type: object
      required: [placeholder, block, rank]
      description: >-
        An entry the caller may not read (d-022). Keeps its block and rank
        so the sequence stays complete and countable; carries nothing else —
        no id, title, human_key, status or deadline that would allow guessing.
      properties:
        placeholder:
          type: boolean
          enum: [true]
        block:
          $ref: "#/components/schemas/PriorityBlock"
        rank:
          type: integer
          nullable: true
          minimum: 1
          description: The task's position inside its own context; null in the unordered block.

    PersonPriorityQueueItem:
      description: One entry of a foreign derived priority order, filtered to the caller's access (AURA-930 / AURA-1148).
      oneOf:
        - $ref: "#/components/schemas/PersonPriorityItem"
        - $ref: "#/components/schemas/PersonPriorityPlaceholder"

    PersonPriorityQueue:
      type: object
      required: [person, items, total, unordered_count]
      description: >
        A colleague's complete derived priority order, as the caller may read
        it (AURA-930 / AURA-1148). Same computation as `MyPriorityQueue`;
        restricted entries are folded into placeholders, never omitted.
      properties:
        person:
          $ref: "#/components/schemas/AuthorRef"
        items:
          type: array
          items:
            $ref: "#/components/schemas/PersonPriorityQueueItem"
        total:
          type: integer
          description: Number of entries in the queue (placeholders included).
        unordered_count:
          type: integer
          description: How many entries fall into the "unordered" block.

    TaskOwnerApplication:
      type: object
      required: [id, user, condition, capacity_percent, created_at]
      description: >
        A transparent, non-binding owner application while looking_for_owner_at
        is set (T18 · S10, ANW-7748). Only open (PENDING) applications are surfaced.
      properties:
        id:
          type: string
          format: uuid
          description: Application UUID
        user:
          $ref: "#/components/schemas/UserPickerItem"
          description: The applicant
        condition:
          type: string
          nullable: true
          description: Optional free-text precondition attached to the application
        capacity_percent:
          type: integer
          nullable: true
          minimum: 0
          maximum: 100
          description: >
            Capacity pledged on apply as a percentage of a full position (10% steps).
            Null only for historical pre-migration rows; new applications always set it.
        created_at:
          type: string
          format: date-time
          description: ISO 8601 timestamp the application was (last re-)submitted

    TaskCrewRequestDirection:
      type: string
      enum: [OWNER_TO_USER, USER_TO_OWNER]
      description: Direction of a bilateral crew request (owner invites a user vs. user applies to owner).

    TaskCrewRequestStatus:
      type: string
      enum: [PENDING, ACCEPTED, DECLINED, WITHDRAWN]
      description: Lifecycle of a crew request while looking_for_crew_at is set.

    TaskCrewRequest:
      type: object
      required: [id, user, direction, status, granted_role, note, capacity_percent, created_at]
      description: >
        A bilateral crew request (T18 · S11, ANW-7759). PENDING requests are the
        open marketplace entries; ACCEPTED rows mark current crew membership with
        the granted real TaskRole (CONTRIBUTOR or STAKEHOLDER).
      properties:
        id:
          type: string
          format: uuid
        user:
          $ref: "#/components/schemas/UserPickerItem"
        direction:
          $ref: "#/components/schemas/TaskCrewRequestDirection"
        status:
          $ref: "#/components/schemas/TaskCrewRequestStatus"
        granted_role:
          allOf:
            - $ref: "#/components/schemas/TaskRole"
          nullable: true
          description: >
            Real TaskRole granted on accept (CONTRIBUTOR or STAKEHOLDER). Set on
            invite up front, or when the owner accepts a USER_TO_OWNER application.
        note:
          type: string
          nullable: true
        capacity_percent:
          type: integer
          nullable: true
          minimum: 0
          maximum: 100
          description: >
            Capacity pledged by the applicant (USER_TO_OWNER). Null when not
            specified, or after an OWNER_TO_USER invite clears a stale pledge.
        created_at:
          type: string
          format: date-time

    TaskCrewRequestCreate:
      type: object
      description: Payload for a user applying as crew (S11, ANW-7759). All fields optional.
      properties:
        note:
          type: string
          maxLength: 2000
          description: Optional free-text note for the owner.
        capacity_percent:
          type: integer
          minimum: 0
          maximum: 100
          description: Optional capacity pledge in 10% steps (0..100). Omit for no statement.

    TaskCrewInvite:
      type: object
      required: [user_id]
      description: Payload for an owner/manage-side invitation to a specific user.
      properties:
        user_id:
          type: string
          format: uuid
        role:
          type: string
          enum: [CONTRIBUTOR, STAKEHOLDER]
          default: CONTRIBUTOR
          description: Real TaskRole to grant when the invitee accepts.
        note:
          type: string
          maxLength: 2000
          description: Optional invitation note.

    TaskCrewRespond:
      type: object
      required: [user_id, direction, accept]
      description: >
        Payload for answering a pending crew request. When accepting a
        USER_TO_OWNER application, `role` selects the granted TaskRole
        (defaults to CONTRIBUTOR). For OWNER_TO_USER invites the stored
        granted_role is used. `capacity_percent` is only accepted when the
        invitee (OWNER_TO_USER) accepts a capacity-consuming role.
      properties:
        user_id:
          type: string
          format: uuid
        direction:
          $ref: "#/components/schemas/TaskCrewRequestDirection"
        accept:
          type: boolean
        role:
          type: string
          enum: [CONTRIBUTOR, STAKEHOLDER]
          description: Used when accepting a USER_TO_OWNER application; ignored for invite responses.
        capacity_percent:
          type: integer
          minimum: 0
          maximum: 100
          description: >
            Required when the invitee accepts an OWNER_TO_USER invite for a
            capacity-consuming role. Rejected (422) on USER_TO_OWNER responses.

    TaskCrewWithdrawal:
      type: object
      required: [user_id, direction]
      description: Payload for withdrawing a pending crew request.
      properties:
        user_id:
          type: string
          format: uuid
        direction:
          $ref: "#/components/schemas/TaskCrewRequestDirection"

    TaskCrewRemoval:
      type: object
      required: [id, user_id, requested_by_user_id, status, created_at]
      description: Pending consensual crew-removal handshake for one task member.
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        requested_by_user_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [PENDING, CONFIRMED, DECLINED, WITHDRAWN]
        created_at:
          type: string
          format: date-time

    TaskCrewRemovalAction:
      type: object
      required: [user_id]
      description: Payload for proposing, confirming, or overriding crew removal.
      properties:
        user_id:
          type: string
          format: uuid

    CrewSearchRelease:
      type: object
      required: [crew_need]
      description: Payload for starting crew search (S11, ANW-7759).
      properties:
        crew_need:
          type: string
          minLength: 1
          maxLength: 2000
          description: Durable free-text crew need (role/skill/problem to solve).
        crew_need_due_date:
          type: string
          format: date-time
          nullable: true
          description: Optional time horizon for the current crew need.

    TaskOwnerApplicationCreate:
      type: object
      required: [capacity_percent]
      description: >
        Payload for applying as owner while looking_for_owner_at is set
        (S10, ANW-7748). capacity_percent is required (10% steps).
      properties:
        condition:
          type: string
          maxLength: 2000
          description: Optional free-text precondition
        capacity_percent:
          type: integer
          minimum: 0
          maximum: 100
          description: Capacity pledge as a percentage of a full position, in 10% steps (0..100).

    OwnerGoalSuggestion:
      type: object
      required: [goal]
      description: AI-suggested one-sentence owner mandate (not persisted).
      properties:
        goal:
          type: string
          description: Suggested one-sentence owner goal

    OwnerSearchRelease:
      type: object
      required: [goal, due_date]
      description: Payload for starting owner search (S10, ANW-7748). Both fields required.
      properties:
        goal:
          type: string
          minLength: 1
          maxLength: 500
          description: Durable one-sentence owner mandate
        due_date:
          type: string
          format: date-time
          description: Delivery due date for the owner goal

    OwnerSearchUpdate:
      type: object
      description: Payload for updating a running owner search (AURA-1651). At least one field required.
      properties:
        owner_goal:
          type: string
          minLength: 1
          maxLength: 500
          description: Replacement owner mandate
        owner_goal_due_date:
          type: string
          format: date
          description: Replacement due date (calendar day). Cannot be cleared.

    CrewSearchUpdate:
      type: object
      description: Payload for updating a running crew search (AURA-1651). At least one field required.
      properties:
        crew_need:
          type: string
          minLength: 1
          maxLength: 2000
          description: Replacement crew-need text
        crew_need_due_date:
          type: string
          format: date
          nullable: true
          description: Replacement due date (calendar day), or null to clear it.

    OwnerSearchAssign:
      type: object
      required: [user_id]
      description: Payload for assigning/aborting with a specific owner during owner search (S10, ANW-7748).
      properties:
        user_id:
          type: string
          format: uuid
          description: UUID of the user to set as owner (preferably an applicant; override of a non-applicant is allowed and audited).

    TaskDetail:
      type: object
      required: [id, human_key, title, description, scope, status, status_type, type, workflow_variant, allowed_next_statuses, chat_count, artifact_count, question_count, has_unread_comments, members, chats, artifacts, repositories, suggested_branch, inherited_repositories, jira_issues, asana_tasks, tags, relations, phase_goals, ancestors, children, access_overview, broad_access, viewer_access, looking_for_owner_at, owner_goal, owner_goal_due_date, owner_applications, viewer_has_applied, viewer_can_release_owner_search, looking_for_crew_at, crew_need, crew_need_due_date, crew_requests, crew_removals, viewer_has_applied_as_crew, viewer_can_manage_crew_search, rank_context, asap, rank_context_size, status_changed_at, created_at, updated_at, projects, inherited_projects]
      description: Full task detail including member list and linked chats, artifacts, repositories, jira issues, tags, and relations
      properties:
        id:
          type: string
          format: uuid
          description: Task UUID (public identifier)
        human_key:
          type: string
          description: Human-readable, immutable task identifier (e.g. "AURA-42"), assigned atomically on creation (ANW-7570).
        title:
          type: string
          description: Task title
        description:
          type: string
          description: Task description (Markdown, may be empty string)
        scope:
          type: string
          description: Task scope (what the task covers, may be empty string)
        status:
          $ref: "#/components/schemas/TaskStatus"
          description: Current workflow status
        status_type:
          $ref: "#/components/schemas/TaskStatusType"
        type:
          $ref: "#/components/schemas/TaskType"
        level:
          $ref: "#/components/schemas/TaskLevel"
          nullable: true
          description: Hierarchy level (null if not assigned)
        workflow_variant:
          $ref: "#/components/schemas/WorkflowVariant"
          description: Workflow variant chosen at creation (STANDARD or DISCOVERY); immutable afterwards.
        allowed_next_statuses:
          type: array
          items:
            $ref: "#/components/schemas/TaskStatus"
          description: >
            Statuses reachable from the current status per the S02 transition guards
            (forward path + rework back-jumps), so the UI can propose the next move.
            Owner-only and reason-gated overrides beyond this list are still possible
            via PATCH; this list is a non-blocking suggestion, not the full permission set.
        parent_task:
          $ref: "#/components/schemas/TaskHierarchyRef"
          nullable: true
          description: Direct parent task (null if root)
        ancestors:
          type: array
          items:
            $ref: "#/components/schemas/TaskHierarchyRef"
          description: Ancestor chain from root to direct parent (breadcrumb order)
        children:
          type: array
          items:
            $ref: "#/components/schemas/TaskChildRef"
          description: >
            Direct child tasks, ordered by rank ascending (unordered last),
            then createdAt.
        chat_count:
          type: integer
          minimum: 0
          description: Number of chats linked to this task
        artifact_count:
          type: integer
          minimum: 0
          description: Number of artifacts linked to this task
        question_count:
          type: integer
          minimum: 0
          description: Number of questions linked to this task
        has_unread_comments:
          type: boolean
          description: >
            True when at least one comment by another user is newer than the
            viewer's comment-read watermark (AURA-999). Own comments never set this.
        archived_at:
          type: string
          format: date-time
          nullable: true
          description: ISO 8601 timestamp when the task was archived (null if OPEN)
        members:
          type: array
          items:
            $ref: "#/components/schemas/TaskMemberWithRoles"
          description: List of task members with their assigned roles
        chats:
          type: array
          items:
            $ref: "#/components/schemas/TaskChatRef"
          description: Chats linked to this task
        artifacts:
          type: array
          items:
            $ref: "#/components/schemas/TaskArtifactRef"
          description: Artifacts linked to this task
        repositories:
          type: array
          items:
            $ref: "#/components/schemas/TaskRepositoryRef"
          description: Repositories linked to this task
        suggested_branch:
          type: string
          nullable: true
          description: >
            Suggested feature-branch name derived from this task's human key and
            title (ANW-7785). Null only when the human key is missing. Independent
            of whether any ancestor has a linked repository.
        inherited_repositories:
          type: array
          items:
            $ref: "#/components/schemas/TaskInheritedRepositoryRef"
          description: >
            Repositories linked to ancestor tasks (nearest-first, deduplicated).
            Used by the feature-branch modal to group and preselect the
            initiative's default repository (ANW-7785).
        jira_issues:
          type: array
          items:
            $ref: "#/components/schemas/TaskJiraIssueRef"
          description: Jira issues linked to this task
        asana_tasks:
          type: array
          items:
            $ref: "#/components/schemas/TaskAsanaTaskRef"
          description: >
            Asana tasks linked to this task (AURA-1404). At most one entry —
            array shape mirrors jira_issues, which is 1:1 for the same reason.
        tags:
          type: array
          items:
            $ref: "#/components/schemas/TaskTagRef"
          description: Tags attached to this task
        relations:
          type: array
          items:
            $ref: "#/components/schemas/TaskRelationRef"
          description: Typed directed relations to/from this task
        phase_goals:
          type: array
          items:
            $ref: "#/components/schemas/TaskPhaseGoal"
          description: >
            The per-phase "Phasen-Rahmen" roadmap (T18 · S28, ANW-7516): one entry per
            intermediate goal (target status), carrying a deadline and a free-text
            phase goal. May include entries for phases not yet reached.
        origin_signal:
          $ref: "#/components/schemas/SignalOriginRef"
          nullable: true
          description: Primary origin signal (first ORIGIN link; null if none)
        linked_signals:
          type: array
          items:
            $ref: "#/components/schemas/TaskLinkedSignalRef"
          description: Signals linked to this task via SignalTask join
        inherited_members:
          type: array
          items:
            $ref: "#/components/schemas/InheritedMember"
          description: Members inherited from ancestor tasks (S5, ANW-7610). Deduplicated against direct members. Read-only at the child level.
        access_overview:
          $ref: "#/components/schemas/AccessOverview"
          description: >
            Read-only aggregation of direct members, TaskAccessGrants, and
            inherited members with their resulting access level and
            capabilities (T18 · S07, ANW-7613). Powers the access-overview modal.
        broad_access:
          type: array
          items:
            $ref: "#/components/schemas/BroadAccessEntry"
          description: >
            Sources of broad (non-individual) access to this task — direct or
            inherited whole-company/group grants, open owner-/crew-search
            (ANW-7907, S1). Empty when nothing broad applies. Powers the
            warning box in ShareModal; USER grants are excluded.
        viewer_access:
          $ref: "#/components/schemas/ViewerAccess"
          description: >
            Current viewer's effective permission, capabilities, and system-override
            flag on this task (ANW-7750). Used by the UI to gate member management
            and content edit without inventing OWNER membership for Admin/Leadership.
        looking_for_owner_at:
          type: string
          format: date-time
          nullable: true
          description: >
            ISO 8601 timestamp when owner search was started (null when not searching).
            Phase-preserving flag orthogonal to status (T18 · S10, ANW-7748).
        owner_goal:
          type: string
          nullable: true
          description: Durable one-sentence owner mandate.
        owner_goal_due_date:
          type: string
          format: date-time
          nullable: true
          description: Delivery due date for the owner goal.
        looking_for_crew_at:
          type: string
          format: date-time
          nullable: true
          description: >
            ISO 8601 timestamp when crew search was started (null when not searching).
            Phase-preserving flag orthogonal to status (T18 · S11, ANW-7759).
        crew_need:
          type: string
          nullable: true
          description: Durable free-text crew need for the current crew search.
        crew_need_due_date:
          type: string
          format: date-time
          nullable: true
          description: Optional time horizon for the current crew need.
        owner_applications:
          type: array
          items:
            $ref: "#/components/schemas/TaskOwnerApplication"
          description: >
            Open (PENDING) owner applications while looking_for_owner_at is set
            (T18 · S10, ANW-7748). Transparent to everyone. Empty outside that
            window or when no one has applied.
        viewer_has_applied:
          type: boolean
          description: True when the current viewer has an open owner application on this task (S10, ANW-7748).
        viewer_can_release_owner_search:
          type: boolean
          description: >
            True when the current viewer may start/abort owner search and assign
            the owner (RELEASE_OWNER_SEARCH capability — Leadership/Admin). A
            global-role gate, not a per-task role (S10, ANW-7748).
        crew_requests:
          type: array
          items:
            $ref: "#/components/schemas/TaskCrewRequest"
          description: >
            Open (PENDING) crew requests while looking_for_crew_at is set
            (T18 · S11, ANW-7759). Transparent to everyone. Empty outside that
            window or when no open request exists.
        crew_removals:
          type: array
          items:
            $ref: "#/components/schemas/TaskCrewRemoval"
          description: Pending consensual crew-removal proposals on this task.
        viewer_has_applied_as_crew:
          type: boolean
          description: True when the current viewer has an open USER_TO_OWNER crew request on this task.
        viewer_can_manage_crew_search:
          type: boolean
          description: >
            True when the current viewer may start/end crew search, invite crew,
            and answer USER_TO_OWNER requests (task MANAGE capability or
            Leadership/Admin system override).
        rank:
          type: integer
          nullable: true
          minimum: 1
          description: >
            Strict position within rank_context (1…n). Null while the task sits
            in the unprioritized tail (AURA-930 / AURA-1135).
        rank_context:
          type: string
          description: >
            Priority-order context key: "task:<parentTaskId>", "root:sagas", or
            "root:unparented" (AURA-930 / AURA-1135).
        asap:
          type: boolean
          description: ASAP class flag (AURA-930).
        rank_reason:
          type: string
          nullable: true
          description: Optional visible justification for the current ranking (AURA-930).
        rank_context_size:
          type: integer
          minimum: 0
          description: >
            Count of ranked (non-null rank) tasks in the same rank_context —
            the "m" in "Position n of m" on the detail priority block (AURA-1135).
        story_points:
          $ref: "#/components/schemas/StoryPointValue"
          nullable: true
          description: >
            Effective story-point value on Stories and Sub-Tasks. Null when
            the level is ineligible or no effective value exists (not 0).
            A filled cache on an ineligible level is ignored at read time.
        story_points_children:
          $ref: "#/components/schemas/StoryPointChildrenAggregate"
          nullable: true
          description: >
            Sum and coverage of the children's contributions. Null when the
            task has no visible children.
        status_changed_at:
          type: string
          format: date-time
          description: ISO 8601 timestamp since when the task has been in its current status (T18 · S32). Distinct from updated_at, which changes on any field edit.
        created_at:
          type: string
          format: date-time
          description: ISO 8601 creation timestamp
        updated_at:
          type: string
          format: date-time
          description: ISO 8601 last update timestamp
        projects:
          type: array
          items:
            $ref: "#/components/schemas/TaskProjectRef"
          description: Direct project assignments on this task
        inherited_projects:
          type: array
          items:
            $ref: "#/components/schemas/InheritedProjectRef"
          description: Projects inherited from ancestor tasks (deduplicated against direct assignments)

    TaskPatch:
      type: object
      description: Payload for updating a task (all fields optional)
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
          description: New task title
        description:
          type: string
          description: New task description (Markdown)
        scope:
          type: string
          description: New task scope
        archived:
          type: boolean
          description: Toggle soft-archive state (D1 — independent from status)
        status:
          $ref: "#/components/schemas/TaskStatus"
          description: New workflow status to set for this task
        status_change_reason:
          type: string
          minLength: 1
          description: >
            Required when the requested status transition is not allowed by the S02
            transition guards (override); must stay within the same status series.
            Enforced but not yet persisted (see ANW-7523 / follow-up ANW-7532 for
            the dedicated status-change history).
        participation_directives:
          type: array
          items:
            $ref: "#/components/schemas/TaskParticipationDirective"
          description: >
            Owner directives (T18 · S33, ANW-7583) assigning each named member their
            participation sentence/status, applied atomically with the status change.
            Optional — an omitted or empty list means the owner skipped it this time.
        level:
          $ref: "#/components/schemas/TaskLevel"
          nullable: true
          description: Set or clear the hierarchy level (null to remove)
        parent_task_id:
          type: string
          format: uuid
          nullable: true
          description: Set or clear the parent task (null to detach)
        type:
          $ref: "#/components/schemas/TaskType"
          nullable: true
          description: Set the task work type (FEATURE, BUG, IDEA, CHORE, DISCOVERY)

    TaskDiscard:
      type: object
      description: Payload for aborting a task to DISCARDED (T18 · S05, ANW-7525).
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          description: Mandatory reason for the abort; persisted on the audit event.

    TaskReopen:
      type: object
      description: Payload for reopening a DONE or DISCARDED task (T18 · S05, ANW-7525).
      required: [to_status, reason]
      properties:
        to_status:
          $ref: "#/components/schemas/TaskStatus"
          description: Owner-chosen target status; must be one of the ACTIVE statuses of the task's series.
        reason:
          type: string
          minLength: 1
          description: Mandatory reason for the reactivation; persisted on the audit event.

    ChatTaskRole:
      type: string
      enum: [ORIGIN, RELATED]
      description: "ORIGIN = this chat generated the task; RELATED = attached later"

    TaskChatRef:
      type: object
      required: [id, chatbot_code, role, updated_at, visibility, is_owner, owner_name]
      description: >
        Slim chat reference in the context of a task. Already filtered server-side:
        only the viewer's own chats and other members' PUBLIC chats are included.
      properties:
        id:
          type: string
          format: uuid
          description: Chat UUID (public identifier)
        title:
          type: string
          nullable: true
          description: Chat title (null if not yet set)
        chatbot_code:
          type: string
          description: Chatbot code (e.g. default)
        role:
          $ref: "#/components/schemas/ChatTaskRole"
        updated_at:
          type: string
          format: date-time
          description: ISO 8601 last activity timestamp
        visibility:
          $ref: "#/components/schemas/ChatVisibility"
        is_owner:
          type: boolean
          description: Whether the current user owns this chat
        owner_name:
          type: string
          nullable: true
          description: Display name of the chat's owner; null for the viewer's own chats (is_owner=true)

    ChatTaskSlimRef:
      type: object
      required: [id, human_key, title, role]
      description: Slim task reference embedded in chat detail (M:N)
      properties:
        id:
          type: string
          format: uuid
          description: Task UUID (public identifier)
        human_key:
          type: string
          description: Human-readable, immutable task identifier (e.g. "AURA-42") — used for browser links; id stays the API identifier (ANW-7848).
        title:
          type: string
          description: Task title
        role:
          $ref: "#/components/schemas/ChatTaskRole"

    TaskChatAttach:
      type: object
      required: [chatUuid]
      description: Payload to link a chat to a task
      properties:
        chatUuid:
          type: string
          format: uuid
          description: UUID of the chat to link
        relation:
          $ref: "#/components/schemas/ChatTaskRole"
          description: Role for this edge (default RELATED; ORIGIN is only set automatically by task_create)

    TaskSlimRef:
      type: object
      required: [id, title]
      description: Slim task reference embedded in chat detail
      properties:
        id:
          type: string
          format: uuid
          description: Task UUID (public identifier)
        title:
          type: string
          description: Task title

    TaskArtifactRef:
      type: object
      required: [id, title, latest_version, updated_at, review_state, kind, created_by_name]
      description: Slim artifact reference in the context of a task
      properties:
        id:
          type: string
          format: uuid
          description: Artifact UUID (public identifier)
        title:
          type: string
          description: Artifact title
        latest_version:
          type: integer
          minimum: 1
          description: Latest version number
        updated_at:
          type: string
          format: date-time
          description: ISO 8601 last activity timestamp
        review_state:
          type: string
          enum: [UNCHECKED, IN_REVIEW, APPROVED, NEEDS_REVISION, SUPERSEDED]
          nullable: true
          description: Review state of the latest version (null if version data not available)
        kind:
          $ref: "#/components/schemas/ArtifactKind"
        created_by_name:
          type: string
          nullable: true
          description: Display name of the artifact owner (who created the artifact); null when not available
        review_approved_count:
          type: integer
          nullable: true
          description: Number of APPROVED decisions (only non-null for IN_REVIEW artifacts)
        review_rejected_count:
          type: integer
          nullable: true
          description: Number of REJECTED decisions (only non-null for IN_REVIEW artifacts)
        review_total_required:
          type: integer
          nullable: true
          description: Total number of required reviewers (only non-null for IN_REVIEW artifacts)
        review_of_artifact_id:
          type: string
          format: uuid
          nullable: true
          description: UUID of the parent artifact this review artifact reviews (null for non-REVIEW artifacts, or when the parent is not itself linked to the task)

    TaskRepositoryRef:
      type: object
      required: [id, display_name, source, workspace, slug]
      description: Slim repository reference in the context of a task
      properties:
        id:
          type: string
          format: uuid
          description: Repository UUID (public identifier)
        display_name:
          type: string
          description: Human-readable display name
        source:
          $ref: "#/components/schemas/RepositorySource"
        workspace:
          type: string
          description: Workspace or organisation slug
        slug:
          type: string
          description: Repository slug within the workspace
        branch:
          type: string
          nullable: true
          description: >
            Feature-branch name stored on this task↔repository link (ANW-7785).
            Null when the repository is linked without a branch.
        browse_url:
          type: string
          format: uri
          nullable: true
          description: >
            Provider-specific browse URL for the branch (Bitbucket/GitHub).
            Null for LOCAL repos or when no branch is set.

    TaskArtifactAttach:
      type: object
      required: [artifactUuid]
      description: Payload to link an artifact to a task
      properties:
        artifactUuid:
          type: string
          format: uuid
          description: UUID of the artifact to link

    TaskRepositoryAttach:
      type: object
      required: [repositoryUuid]
      description: Payload to link a repository to a task (optionally with a feature branch)
      properties:
        repositoryUuid:
          type: string
          format: uuid
          description: UUID of the repository to link
        branch:
          type: string
          nullable: true
          description: >
            Optional feature-branch name to store on the link. When the link
            already exists, a provided branch updates it (ANW-7785).

    TaskInheritedRepositoryRef:
      type: object
      required: [id, display_name, source, workspace, slug, inherited_from]
      description: >
        Repository linked to an ancestor task and offered as an inherited
        default for feature-branch linking (ANW-7785). No branch is included —
        the ancestor's branch (if any) is irrelevant to the child.
      properties:
        id:
          type: string
          format: uuid
          description: Repository UUID
        display_name:
          type: string
          description: Human-readable display name
        source:
          $ref: "#/components/schemas/RepositorySource"
        workspace:
          type: string
          description: Workspace or organisation slug
        slug:
          type: string
          description: Repository slug within the workspace
        inherited_from:
          $ref: "#/components/schemas/TaskHierarchyRef"
          description: Ancestor task that linked this repository

    TaskJiraIssueRef:
      type: object
      required: [id, issue_key, summary, status, issue_url, issue_type]
      description: Slim Jira issue reference in the context of a task
      properties:
        id:
          type: string
          format: uuid
          description: JiraIssue mirror UUID (public identifier)
        issue_key:
          type: string
          description: "Jira issue key, e.g. ANW-6487"
        summary:
          type: string
          description: Issue summary / title
        status:
          type: string
          description: Current status name as returned by Jira
        issue_url:
          type: string
          description: Direct URL to the issue in Jira
        issue_type:
          type: string
          description: Issue type name, e.g. Bug, Story
        priority:
          type: string
          nullable: true
          description: Priority name, null when not set

    TaskAsanaTaskRef:
      type: object
      required: [id, gid, name, completed, url]
      description: Slim Asana task reference in the context of a task (AURA-1404)
      properties:
        id:
          type: string
          format: uuid
          description: AsanaTask mirror UUID (public identifier)
        gid:
          type: string
          description: Asana task gid
        name:
          type: string
          description: Asana task name
        completed:
          type: boolean
          description: Whether Asana reports this task as completed
        url:
          type: string
          description: Direct URL (permalink) to the task in Asana
        project_name:
          type: string
          nullable: true
          description: Name of the Asana project this task belongs to, null when unknown

    TaskJiraIssueAttach:
      type: object
      required: [issue_key]
      description: Payload to link a Jira issue to a task
      properties:
        issue_key:
          type: string
          pattern: "^[A-Z][A-Z0-9]+-\\d+$"
          description: "Jira issue key, e.g. ANW-6487"

    TaskAsanaTaskAttach:
      type: object
      required: [gid]
      description: Payload to link an Asana object to a task
      properties:
        gid:
          type: string
          description: >-
            Asana object gid, or a permalink URL it can be extracted from
            (e.g. https://app.asana.com/0/<projectGid>/<taskGid>, or the
            newer .../task/<gid> form — the last long digit run wins).

    MarkTaskCommentsReadRequest:
      type: object
      required: [last_rendered_at]
      description: >
        Body for POST /tasks/{uuid}/comments/read. Carries the createdAt of the
        newest comment actually rendered, so the watermark never races ahead of
        what the viewer has seen (AURA-999 / AURA-1081).
      properties:
        last_rendered_at:
          type: string
          format: date-time
          description: ISO 8601 createdAt of the last successfully rendered comment.

    TaskMemberRef:
      type: object
      description: Reference to a user to add as task member (provide either userId or userUuid)
      properties:
        userId:
          type: integer
          description: Internal user ID
        userUuid:
          type: string
          format: uuid
          description: User UUID
        roles:
          type: array
          items:
            $ref: "#/components/schemas/TaskRole"
          description: Optional initial roles to assign to the new member

    UserPickerItem:
      type: object
      required: [id, display_name, email]
      description: Slim user representation for owner picker
      properties:
        id:
          type: string
          format: uuid
          description: User UUID
        display_name:
          type: string
          nullable: true
          description: User display name
        email:
          type: string
          nullable: true
          description: User email address

    ArtifactVersionDetail:
      type: object
      required: [id, version, title, body, summary, frontmatter, frontmatter_raw, created_at, created_by_message_id, latest_version, created_by_name]
      description: Full detail of a specific artifact version including body
      properties:
        id:
          type: string
          format: uuid
          description: Artifact UUID
        version:
          type: integer
          minimum: 1
          description: This version number
        title:
          type: string
          description: Current artifact title
        body:
          type: string
          description: Markdown body of this version
        summary:
          type: string
          nullable: true
          description: Optional short change note
        frontmatter:
          type: object
          additionalProperties: true
          nullable: true
          description: Parsed OKF frontmatter (key/value metadata) of this version; null when none
        frontmatter_raw:
          type: string
          nullable: true
          description: Raw YAML rendering of the frontmatter (without --- fences); null when none
        created_at:
          type: string
          format: date-time
          description: ISO 8601 creation timestamp
        created_by_message_id:
          type: string
          format: uuid
          nullable: true
          description: UUID of the assistant message that created this version
        latest_version:
          type: integer
          minimum: 1
          description: The current latest version number of the artifact
        created_by_name:
          type: string
          nullable: true
          description: Display name of the user who authored this version; null for legacy versions

    TaskSearchRequest:
      type: object
      required: [query]
      description: Request body for semantic task search
      properties:
        query:
          type: string
          minLength: 1
          description: Natural-language search query
        limit:
          type: integer
          minimum: 1
          maximum: 50
          default: 10
          description: Maximum number of results to return

    TaskSearchResult:
      description: A single semantic search result — full TaskListItem fields plus a relevance score
      allOf:
        - $ref: "#/components/schemas/TaskListItem"
        - type: object
          required: [score]
          properties:
            score:
              type: number
              format: float
              minimum: 0
              maximum: 1
              description: Cosine similarity score (1 = identical, 0 = unrelated)

    EmbeddingSourceType:
      type: string
      enum: [TASK, UPLOAD_DOCUMENT, ARTIFACT, GLOSSARY, SKILL, KNOWLEDGE_DOCUMENT]
      description: Type of source entity indexed in the embedding store

    GlossaryCategory:
      type: string
      enum: [ACRONYM, DOMAIN_CONCEPT, PRODUCT, PROCESS]
      description: Category of a glossary entry

    GlossaryLanguage:
      type: string
      enum: [DE, EN]
      description: Language of a glossary entry

    GlossaryEntryStatus:
      type: string
      enum: [PENDING, APPROVED]
