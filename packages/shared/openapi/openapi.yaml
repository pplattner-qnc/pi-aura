  /tasks/{uuid}/asana-tasks:
    post:
      operationId: linkAsanaTaskToTask
      summary: "Tasks: Link an Asana object"
      description: >-
        Links an existing Asana object (project or task) to a task by gid or
        permalink URL (S5, AURA-1422). Idempotent — returns 200 if already
        linked. If the object is not yet mirrored, it is fetched using the
        current user's own connected Asana account (Settings → Integrations);
        an already-mirrored object never requires a token. Error responses
        carry a `type` discriminator: 409 when no Asana account is connected
        and the object is not mirrored (`not_connected`), when the stored
        token is no longer usable (`token_invalid`), or when another task
        already owns the object (`already_linked`); 404 when the gid does not
        exist in Asana (`not_found`); 502 on an upstream Asana error
        (`error`). A 403 comes from the per-object access layer instead and
        is discriminated by `meta.reason`. Chat-free by design — no MCP or
        agent tool exposes this.
      tags:
        - Tasks
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Task UUID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskAsanaTaskAttach"
      responses:
        "200":
          description: Asana object linked; returns updated task detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskDetail"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AccessDenied"
        "404":
          description: Asana object not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/AsanaTaskLinkProblemDetail"
        "409":
          description: Asana not connected, token invalid, or already linked
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/AsanaTaskLinkProblemDetail"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          description: Upstream Asana error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/AsanaTaskLinkProblemDetail"

  /tasks/{uuid}/asana-tasks/create-target:
    get:
      operationId: getAsanaCreateTargetForTask
      summary: "Tasks: Resolve where the Asana counterpart would be created"
      description: >-
        Names the target the create dialog would write into (S6, AURA-1423),
        derived from the nearest ancestor that is already linked to Asana — the
        same resolution the write path runs, so preview and write cannot
        disagree. Reads only Aura's mirror: no Asana call, no connected account
        required. 409 (`already_linked`) when the task already has a
        counterpart, 422 (`no_target`) when no ancestor is linked or the linked
        ancestor belongs to no project.
      tags:
        - Tasks
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Task UUID
      responses:
        "200":
          description: Resolved Asana target
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AsanaCreateTarget"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AccessDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The task already has an Asana counterpart
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/AsanaTaskCreateProblemDetail"
        "422":
          description: No Asana target could be derived from the task's ancestors
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/AsanaTaskCreateProblemDetail"
        "500":
          $ref: "#/components/responses/InternalError"

  /tasks/{uuid}/asana-tasks/create:
    post:
      operationId: createAsanaTaskForTask
      summary: "Tasks: Create the Asana counterpart"
      description: >-
        Creates the Asana object for a task and links it in the same step
        (S6, AURA-1423). Where it is created follows the nearest ancestor that
        is already linked to Asana: under a linked parent task it becomes a
        subtask, under a linked project it is created in that project. The
        caller's own connected Asana account is used (Settings → Integrations);
        there is no service account. Error responses carry a `type`
        discriminator: 409 when no account is connected (`not_connected`), the
        stored token is unusable (`token_invalid`) or the task already has an
        Asana object (`already_linked`); 422 when no target could be derived
        (`no_target`, nothing was created); 502 on an upstream Asana error
        (`error`) — including the case where the object was created but linking
        it failed, in which case the message names the created gid.
        Chat-free by design — no MCP or agent tool exposes this.
      tags:
        - Tasks
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Task UUID
      responses:
        "200":
          description: Asana object created and linked; returns updated task detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskDetail"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AccessDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Asana not connected, token invalid, or task already linked
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/AsanaTaskCreateProblemDetail"
        "422":
          description: No Asana target could be derived from the task's ancestors
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/AsanaTaskCreateProblemDetail"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          description: Upstream Asana error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/AsanaTaskCreateProblemDetail"

  /tasks/{uuid}/asana-tasks/{asanaTaskUuid}:
    delete:
      operationId: unlinkAsanaTaskFromTask
      summary: "Tasks: Unlink an Asana object"
      description: >-
        Removes the Asana link from a task. The mirrored AsanaTask record
        itself is not deleted — it survives and reappears unlinked in
        /asana-tasks. Nothing is cleaned up on the Asana side.
      tags:
        - Tasks
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Task UUID
        - name: asanaTaskUuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: AsanaTask UUID (the mirrored record's id, returned in asana_tasks[].id)
      responses:
        "200":
          description: Asana object unlinked; returns updated task detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AccessDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /tasks/{uuid}/jira-issues/draft:
    get:
      operationId: getTaskJiraIssueDraft
      summary: "Tasks: Preview the Jira issue a task would create"
      description: >-
        Derives the issue type, project, summary and description a Jira issue
        for this task would get, plus the allowed target statuses — so the
        "Create in Jira" dialog can render before the user commits
        (AURA-1239). Same derivation the chat's `jira_propose_issue` tool uses.
        The team is not derived: the user picks it in the dialog (AURA-1429).
      tags:
        - Tasks
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Task UUID
      responses:
        "200":
          description: Draft issue fields
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskJiraIssueDraft"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AccessDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Task already has a linked Jira issue
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/TaskJiraIssueDraftProblemDetail"
        "422":
          description: Task is a saga (no Jira equivalent)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/TaskJiraIssueDraftProblemDetail"
        "500":
          $ref: "#/components/responses/InternalError"

  /tasks/{uuid}/jira-issues/create:
    post:
      operationId: createTaskJiraIssue
      summary: "Tasks: Create and link a Jira issue"
      description: >-
        Creates a Jira issue from the task's derived fields, mirrors it
        locally, and links it to the task — the same create → mirror → link
        chain the chat confirmation uses, guarded by a row lock so two
        concurrent clicks cannot create two issues (AURA-1239). On a race,
        returns 200 with `already_linked: true` instead of a duplicate. If
        the issue was created in Jira but the local link failed, still
        returns 201 with `linking_warning` set — the next sync repairs it.
      tags:
        - Tasks
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Task UUID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskJiraIssueCreateRequest"
      responses:
        "200":
          description: Task was already linked by a concurrent request; no new issue was created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskJiraIssueCreateResult"
        "201":
          description: Jira issue created and linked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskJiraIssueCreateResult"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AccessDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Jira is not connected for this user
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/TaskJiraIssueCreateProblemDetail"
        "422":
          description: Task is a saga, or the upstream Jira creation failed
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/TaskJiraIssueCreateProblemDetail"
        "500":
          $ref: "#/components/responses/InternalError"

  /tasks/{uuid}/tags:
    post:
      operationId: attachTagToTask
      summary: "Tasks: Attach a tag"
      description: Attaches a tag to a task by slug. Creates the tag if it does not exist yet (upsert-by-slug). Idempotent. Task must be owned by the current user.
      tags:
        - Tasks
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Task UUID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskTagAttach"
      responses:
        "200":
          description: Tag attached; returns updated task detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskDetail"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /tasks/{uuid}/tags/{slug}:
    delete:
      operationId: detachTagFromTask
      summary: "Tasks: Detach a tag"
      description: Removes the tag-task link. The tag itself is not deleted. Idempotent.
      tags:
        - Tasks
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Task UUID
        - name: slug
          in: path
          required: true
          schema:
            type: string
          description: Tag slug
      responses:
        "200":
          description: Tag detached; returns updated task detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /tasks/{uuid}/relations:
    post:
      operationId: createTaskRelation
      summary: "Tasks: Create a relation"
      description: Creates a typed, directed relation from this task to another task. Self-edges (from == to) are rejected. Duplicate (from, to, type) triples are rejected with 409.
      tags:
        - Tasks
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Task UUID (source of the relation)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskRelationCreate"
      responses:
        "200":
          description: Relation created; returns updated task detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskDetail"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Relation already exists (duplicate)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "500":
          $ref: "#/components/responses/InternalError"

  /tasks/{uuid}/relations/{id}:
    delete:
      operationId: deleteTaskRelation
      summary: "Tasks: Delete a relation"
      description: Removes a typed relation by its UUID. The relation must belong to the task identified by uuid.
      tags:
        - Tasks
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Task UUID (source of the relation)
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Relation UUID
      responses:
        "200":
          description: Relation deleted; returns updated task detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /tasks/{uuid}/phase-goals:
    put:
      operationId: batchUpsertTaskPhaseGoals
      summary: "Tasks: Batch-save phase goals (deadline + text) for intermediate goals"
      description: >
        Atomically upserts (or, for a cleared row, deletes) one or more phase-goal rows
        (T18 · S28, ANW-7516; frontend redesign). Each row's target status must be part
        of the task's resolved status series and must not already have been reached
        (i.e. its index in the series must be >= the task's current status), otherwise 400.
        A row with `deadline: null` and an empty `goal_description` deletes that phase
        goal instead of upserting it. Requires EDIT access.
      tags:
        - Tasks
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Task UUID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskPhaseGoalBatchUpsert"
      responses:
        "200":
          description: Phase goals saved; returns updated task detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskDetail"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /tasks/{uuid}/level-cascade-preview:
    get:
      operationId: previewTaskLevelCascade
      summary: "Tasks: Preview a level-change cascade"
      description: |
        Read-only dry run of the level-change cascade (AURA-1226): validates the
        requested `level` (+ optional `parent_task_id`) exactly as `PATCH /tasks/{uuid}`
        would, and — if the task already has a level and it would change — computes
        which descendants would be re-leveled (and, per the simple take-over-or-reset
        rule, whether their status resets to OPEN) plus which of them the caller lacks
        `TASK_EDIT_CONTENT` on. Nothing is persisted. Powers the guided restructure
        dialog's preview step before the actual submit.
      tags:
        - Tasks
      x-mcp: false # UI-only dry run for the restructure dialog's preview step (AURA-1226); chat exposure for level/parent changes goes through task_update, not a separate preview tool.
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Task UUID
        - name: level
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/TaskLevel"
          description: The level to preview moving this task to.
        - name: parent_task_id
          in: query
          schema:
            type: string
          description: >-
            New parent UUID to validate together with the level. Omit to keep
            the current parent; pass an empty string to explicitly clear it
            (e.g. promoting to SAGA, which takes no parent) — a query string
            cannot carry a real `null` the way the PATCH body can.
      responses:
        "200":
          description: The cascade this level change would produce
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskLevelCascadePreview"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /tasks/{uuid}/activity:
    get:
      operationId: listTaskActivity
      summary: "Tasks: List activity events"
      description: Returns paginated activity events for a task (TASK-scoped, newest first). Requires task membership.
      tags:
        - Tasks
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Task UUID
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: sort_dir
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
          description: Sort direction (default desc = newest first)
        - name: type
          in: query
          schema:
            type: string
          description: Filter to a single activity type code (e.g. "task.status_changed") to read the status-transition history without a second parallel log.
      responses:
        "200":
          description: Paginated list of activity events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityEventList"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: recordTaskProgress
      summary: "Tasks: Record a progress activity event"
      description: "Records a task.progress activity event carrying an AI-generated free-text note plus a short skill-phase label (e.g. \"implement\", \"refine\", \"wave 2/3\"). Used by the local task-lifecycle skills to give continuous, low-effort visibility of local progress in the Aura Timeline. Marks the event is_ai_generated=true; the actor stays the calling user/PAT owner. Never triggers notifications."
      tags:
        - Tasks
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Task UUID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [note, phase]
              properties:
                note:
                  type: string
                  minLength: 1
                  maxLength: 2000
                  description: Short, AI-written sentence describing what is happening.
                phase:
                  type: string
                  minLength: 1
                  maxLength: 60
                  description: Short skill-phase label (e.g. "implement", "refine"), finer-grained than the Aura status.
                step:
                  type: string
                  minLength: 1
                  maxLength: 60
                  description: Optional finer-grained step within the phase (e.g. "wave 2/3").
      responses:
        "200":
          description: Progress activity event created
          content:
            application/json:
              schema:
                type: object
                required: [id, type]
                properties:
                  id:
                    type: string
                    format: uuid
                  type:
                    type: string
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /tasks/{uuid}/activity/debug:
    post:
      operationId: debugTriggerTaskActivity
      summary: "Tasks: DEBUG — fire sample activity event"
      description: "DEBUG only. Fires a sample task.status_changed activity event for human-test verification. Will be removed when the Timeline UI (ANW-7056) is delivered."
      tags:
        - Tasks
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Task UUID
      responses:
        "200":
          description: Activity event created
          content:
            application/json:
              schema:
                type: object
                required: [id, type]
                properties:
                  id:
                    type: string
                    format: uuid
                  type:
                    type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"


  /feedback:
    get:
      operationId: listFeedback
      summary: "Feedback: List (paginated)"
      description: >
        Returns paginated feedback. Default hides discarded entries.
        Requires VIEW_FEEDBACK (Leadership/Admin). Callers without the
        capability receive 403, not an empty list.
      tags:
        - Feedback
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/SearchParam"
        - name: sort_by
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/FeedbackSortField"
          description: Field to sort by
        - $ref: "#/components/parameters/SortDirParam"
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/FeedbackStatus"
          description: Exact status filter. When omitted, discarded entries are hidden.
        - name: source
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/FeedbackSource"
          description: Filter by how the entry arrived
        - name: tags
          in: query
          required: false
          schema:
            type: string
          description: Comma-separated tag slugs to filter by.
        - name: tag_match
          in: query
          required: false
          schema:
            type: string
            enum: [all, any]
          description: Whether all (AND) or any (OR) of the given tag slugs must match. Default all.
      responses:
        "200":
          description: Paginated feedback list
          content:
