          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /llm-turns/{uuid}/payload:
    parameters:
      - name: uuid
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getLlmTurnPayload
      summary: "LLM Turns: Get payload"
      description: Loads the full payload (system prompt, messages, raw response) of a single turn from S3. Owner sees their own turns; ADMIN sees all. Returns 404 if the turn has no payload (old row or a write-time S3 failure).
      tags:
        - llm-turns
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LlmTurnPayload"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  # ─── Knowledge Base / Wiki ────────────────────────────────────────────────

  /knowledge/spaces:
    get:
      operationId: listKnowledgeSpaces
      tags: [knowledge]
      summary: List knowledge spaces
      description: Returns all knowledge spaces (topics). Accessible to all authenticated users.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: List of knowledge spaces
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeSpaceList"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createKnowledgeSpace
      tags: [knowledge]
      summary: Create a knowledge space
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KnowledgeSpaceCreate"
      responses:
        "201":
          description: Created knowledge space
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeSpace"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"

  /knowledge/spaces/{slug}:
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getKnowledgeSpace
      tags: [knowledge]
      summary: Get a knowledge space by slug
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Knowledge space
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeSpace"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateKnowledgeSpace
      tags: [knowledge]
      summary: Update a knowledge space
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KnowledgeSpaceUpdate"
      responses:
        "200":
          description: Updated knowledge space
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeSpace"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteKnowledgeSpace
      tags: [knowledge]
      summary: Delete a knowledge space (cascades to all nodes)
      security:
        - cookieAuth: []
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /knowledge/spaces/{slug}/nodes:
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getKnowledgeTree
      tags: [knowledge]
      summary: Get the full node tree for a space
      description: >-
        Returns the complete tree of folders and documents (body omitted — load
        via GET /knowledge/nodes/{uuid}). The optional `depth` and `max_nodes`
        bound the answer; omitted, the whole tree comes back.
      security:
        - cookieAuth: []
      parameters:
        - name: depth
          in: query
          required: false
          description: Maximum tree depth below the roots. Omitted returns every level.
          schema:
            type: integer
            minimum: 0
            maximum: 2
        - name: max_nodes
          in: query
          required: false
          description: Maximum number of nodes in the answer. Omitted returns all of them.
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: Node tree
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeTree"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createKnowledgeNode
      tags: [knowledge]
      summary: Create a folder or document node
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KnowledgeNodeCreate"
      responses:
        "201":
          description: Created node
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeNode"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /knowledge/spaces/{slug}/files:
    get:
      operationId: listKnowledgeFiles
      tags: [knowledge]
      summary: List the file nodes of a space
      description: >-
        Returns the FILE nodes of a space with their asset metadata and their
        slug path. Optionally scoped to a single folder via parent_id.
      security:
        - cookieAuth: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/SearchParam"
        - $ref: "#/components/parameters/SortDirParam"
        - name: sort_by
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/KnowledgeFileSortField"
          description: Sort field
        - name: parent_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Only list files directly inside this folder node.
      responses:
        "200":
          description: List of files
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeFileList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: uploadKnowledgeFile
      tags: [knowledge]
      summary: Upload a file into a space (creates or replaces a FILE node)
      description: >-
        Uploads a file as a FILE node. The node slug is the normalised file name
        including its extension; title and asset filename keep the verbatim name.
        When a FILE node with the same slug already exists in the target folder,
        its content is replaced (same node, same path, new bytes, no version).
        A collision with a FOLDER or DOCUMENT is a 409.
      security:
        - cookieAuth: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
        - name: parent_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Folder node to upload into. Omit for the space root.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Existing file replaced
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeFile"
        "201":
          description: File created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeFile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          description: Payload too large (exceeds 50 MB)

  /knowledge/nodes/{uuid}/file:
    get:
      operationId: downloadKnowledgeFile
      tags: [knowledge]
      summary: Download the bytes of a FILE node
      description: >-
        Streams the stored bytes byte-identically. Responds with
        Content-Disposition attachment unless inline=true is requested.
      security:
        - cookieAuth: []
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: inline
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: Serve with Content-Disposition inline (for previews) instead of attachment.
        - name: version
          in: query
          required: false
          schema:
            type: integer
          description: Fetch a specific past version by its number instead of the current one (AURA-1644).
      responses:
        "200":
          description: File bytes
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /knowledge/nodes/{uuid}/file/versions:
    parameters:
      - name: uuid
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: listKnowledgeFileVersions
      tags: [knowledge]
      summary: List all versions of a FILE node's asset
      description: >-
        Newest first. Each entry carries its own checksum and provenance
        (AURA-1644) — download a specific one via
        GET /knowledge/nodes/{uuid}/file?version=N.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Version list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeFileVersionList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /knowledge/spaces/{slug}/nodes/by-path:
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
      - name: path
        in: query
        required: true
        schema:
          type: string
        description: >-
          Slash-separated node path within the space (e.g. "daten/chat",
          "daten/chat.md" or "rules/my-rule.mdc"). The last segment is matched
          verbatim first — that is how a file wins over a same-named document —
          and only if nothing matches is a trailing ".md"/".mdc" stripped and
          the lookup retried.
    get:
      operationId: getKnowledgeNodeByPath
      tags: [knowledge]
      summary: Get a knowledge node by its slug path within a space
      description: >-
        Resolves a document node by traversing the slug hierarchy.
        Returns the full node including body, suitable for rendering the document view.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: The resolved node
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeNode"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /knowledge/nodes/{uuid}:
    parameters:
      - name: uuid
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getKnowledgeNode
      tags: [knowledge]
      summary: Get a single node (includes body for documents)
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Knowledge node
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeNode"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateKnowledgeNode
      tags: [knowledge]
      summary: Rename, move or reorder a node
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KnowledgeNodeUpdate"
      responses:
        "200":
          description: Updated node
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeNode"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteKnowledgeNode
      tags: [knowledge]
      summary: Delete a node (cascades to children, versions and file assets)
      description: >-
        Deletes the node and, for a folder, its whole subtree. File assets in
        that subtree lose their stored objects too — the DB cascade alone would
        leave the blobs behind.
      security:
        - cookieAuth: []
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /knowledge/nodes/{uuid}/body:
    parameters:
      - name: uuid
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      operationId: saveKnowledgeNodeBody
      tags: [knowledge]
      summary: Save document body (creates a new version)
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KnowledgeNodeBodySave"
      responses:
        "200":
          description: Updated node
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeNode"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /knowledge/nodes/{uuid}/versions:
    parameters:
      - name: uuid
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: listKnowledgeNodeVersions
      tags: [knowledge]
      summary: List all versions of a document node
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Version list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeVersionList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /knowledge/nodes/{uuid}/versions/{version}:
    parameters:
      - name: uuid
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: version
        in: path
        required: true
        schema:
          type: integer
    get:
      operationId: getKnowledgeNodeVersion
      tags: [knowledge]
      summary: Get a specific version of a document node
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Version detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeVersion"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
