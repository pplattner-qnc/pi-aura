  /repositories/{source}/{workspace}/{slug}/document:
    post:
      operationId: triggerRepositoryDocRun
      summary: "Repositories: Trigger a documentation run"
      description: >-
        Starts a fire-and-forget documentation run for the repository and returns immediately
        with the new run id. Progress is observable via the doc-runs endpoint. Requires the
        MANAGE_REPOSITORIES capability.
      tags:
        - Repositories
      parameters:
        - name: source
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/RepositorySource"
          description: Repository source
        - name: workspace
          in: path
          required: true
          schema:
            type: string
          description: Repository workspace
        - name: slug
          in: path
          required: true
          schema:
            type: string
          description: Repository slug
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocRunTriggerRequest"
      responses:
        "202":
          description: Accepted — the run was created and is processing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocRunTriggerResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /repositories/{source}/{workspace}/{slug}/ingest-from-pr:
    post:
      operationId: triggerRepositoryIngestFromPr
      summary: "Repositories: Trigger a manual PR ingest"
      description: >-
        Starts an in-process ingest run that fetches .aura/docs/ documents from the
        aura/docs branch via the Bitbucket API and ingests them into the database
        and pgvector. Only available for BITBUCKET repositories. Returns immediately
        with the new run id; progress is observable via GET /repositories (latest_ingest_run).
        Requires the MANAGE_REPOSITORIES capability.
      tags:
        - Repositories
      parameters:
        - name: source
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/RepositorySource"
          description: Repository source
        - name: workspace
          in: path
          required: true
          schema:
            type: string
          description: Repository workspace
        - name: slug
          in: path
          required: true
          schema:
            type: string
          description: Repository slug
      responses:
        "202":
          description: Accepted — the ingest run was created and is processing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestRunTriggerResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /repositories/{source}/{workspace}/{slug}/code-search:
    post:
      operationId: enableRepositoryCodeSearch
      summary: "Repositories: Enable code search"
      description: >-
        Enables code search for the repository. Sets codeSearchEnabled=true and
        creates a RepositoryCodeCheckout row for the default branch with status NOT_CLONED.
        Requires the MANAGE_REPOSITORIES capability.
      tags:
        - Repositories
      parameters:
        - name: source
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/RepositorySource"
          description: Repository source
        - name: workspace
          in: path
          required: true
          schema:
            type: string
          description: Repository workspace
        - name: slug
          in: path
          required: true
          schema:
            type: string
          description: Repository slug
      responses:
        "200":
          description: Code search enabled
          content:
            application/json:
              schema:
                type: object
                required: [code_search_enabled, checkout]
                properties:
                  code_search_enabled:
                    type: boolean
                  checkout:
                    $ref: "#/components/schemas/CodeCheckoutSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: disableRepositoryCodeSearch
      summary: "Repositories: Disable code search"
      description: >-
        Disables code search for the repository. Sets codeSearchEnabled=false and
        deletes all RepositoryCodeCheckout rows for this repository.
        Requires the MANAGE_REPOSITORIES capability.
      tags:
        - Repositories
      parameters:
        - name: source
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/RepositorySource"
          description: Repository source
        - name: workspace
          in: path
          required: true
          schema:
            type: string
          description: Repository workspace
        - name: slug
          in: path
          required: true
          schema:
            type: string
          description: Repository slug
      responses:
        "204":
          description: Code search disabled
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /repositories/{source}/{workspace}/{slug}/code-sync:
    post:
      operationId: triggerRepositoryCodeSync
      summary: "Repositories: Trigger code sync"
      description: >-
        Triggers an immediate code sync for the repository via repo-mcp.
        Returns 202 immediately; the sync runs asynchronously in repo-mcp.
        Observable via GET /repositories (latest_code_checkout).
        Requires the MANAGE_REPOSITORIES capability.
      tags:
        - Repositories
      parameters:
        - name: source
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/RepositorySource"
          description: Repository source
        - name: workspace
          in: path
          required: true
          schema:
            type: string
          description: Repository workspace
        - name: slug
          in: path
          required: true
          schema:
            type: string
          description: Repository slug
      responses:
        "202":
          description: Sync triggered; status visible via GET /repositories
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Code search not enabled for this repository

  /repositories/{source}/{workspace}/{slug}/run-status:
    get:
      operationId: getRepositoryRunStatus
      summary: "Repositories: Get current run status"
      description: >-
        Returns only the latest run summaries (doc, ingest, code checkout) for a single repository.
        Intended for focused polling while a run is active — avoids reloading the full list.
        Available to all authenticated users with VIEW_REPOSITORIES capability.
      tags:
        - Repositories
      parameters:
        - name: source
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/RepositorySource"
          description: Repository source
        - name: workspace
          in: path
          required: true
          schema:
            type: string
          description: Repository workspace
        - name: slug
          in: path
          required: true
          schema:
            type: string
          description: Repository slug
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepositoryRunStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

