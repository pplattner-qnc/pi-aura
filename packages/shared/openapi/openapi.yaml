  /router-misses:
    get:
      operationId: listRouterMisses
      summary: "Router Misses: List (paginated, admin-only)"
      description: Returns paginated unclassified intents captured by the router. Requires VIEW_ROUTER_MISSES capability (ADMIN only).
      tags:
        - RouterMisses
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/SearchParam"
        - name: sort_by
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/RouterMissSortField"
          description: Field to sort by
        - $ref: "#/components/parameters/SortDirParam"
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [NEW, REVIEWED, DISMISSED]
          description: Filter by intent status
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RouterMissList"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /tasks:
    get:
      operationId: listTasks
      summary: "Tasks: List (paginated)"
      description: >-
        Returns paginated tasks the caller can see (membership, inherited access,
        and access grants). There is no default status filter; archived tasks are
        hidden unless archived=all or archived=true. related_to is member-scoped
        only and then applies status_slug, status_type, type, and archived.
      tags:
        - Tasks
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/SearchParam"
        - name: sort_by
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/TaskSortField"
          description: Field to sort by
        - $ref: "#/components/parameters/SortDirParam"
        - name: status_slug
          in: query
          required: false
          schema:
            type: string
          description: Comma-separated TaskStatus values to filter by (e.g. "OPEN,IN_DEVELOPMENT")
        - name: status_type
          in: query
          required: false
          schema:
            type: string
          description: >-
            Filter by status activity class, not by progress. Comma-separated; values:
            OPEN, WAITING, ACTIVE, TERMINAL. Note that OPEN is the single status OPEN
            (nobody has picked the task up yet) — it is not a synonym for "not finished";
            for everything that is not finished, pass OPEN,WAITING,ACTIVE. A
            progress-based cut ("not deployed yet") cannot be expressed here, because the
            four classes cut across the status series — use status_slug with an explicit
            list of statuses for that. There is no value named "open": if a user asks for
            "the open tasks", ask which of the two readings they mean instead of guessing.
        - name: type
          in: query
          required: false
          schema:
            type: string
          description: Comma-separated task types (FEATURE, BUG, IDEA, CHORE, DISCOVERY). Multiple values are OR.
        - name: archived
          in: query
          required: false
          schema:
            type: string
            enum: ["false", "true", "all"]
          description: "Archived visibility (orthogonal to status): false (default) hides archived, true only archived, all both"
        - name: view
          in: query
          required: false
          schema:
            type: string
            enum: [all, no_role, mine]
            default: all
          description: "Tab filter: all member tasks (default), tasks where the user has no role (no_role), or tasks created by the current user (mine)"
        - name: role
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/TaskRole"
          description: A TaskRole enum value — returns only tasks where the current user is a member with this role. Takes precedence over view when both are set.
        - name: tags
          in: query
          required: false
          schema:
            type: string
          description: Comma-separated tag slugs to filter by
        - name: tag_match
          in: query
          required: false
          schema:
            type: string
            enum: [all, any]
            default: all
          description: Whether all (AND) or any (OR) of the given tag slugs must match (default all)
        - name: level
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/TaskLevel"
          description: Filter by hierarchy level (SAGA, EPIC, STORY, SUBTASK)
        - name: related_to
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Return tasks that are 1-hop neighbours of the task with this UUID (member-scoped)
        - name: relation_type
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/TaskRelationType"
          description: Restrict the related_to query to a specific relation type
        - name: parent_task_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Return only direct children of the task with this UUID (member-scoped, other filters apply)
        - name: parent_eligible
          in: query
          required: false
          schema:
            type: boolean
          description: When true, return only tasks that can act as a parent (have a level assigned and are not SUBTASK). Useful for parent-picker search in the create form.
        - name: parent_eligible_for_level
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/TaskLevel"
          description: >-
            Level-dependent successor of parent_eligible (AURA-1226): keep only
            tasks whose level may act as parent for a task at this target
            level — SUBTASK yields STORY only, STORY yields EPIC/SAGA, EPIC
            yields SAGA only, SAGA yields no candidates at all. Takes
            precedence over parent_eligible when both are given. Used by the
            guided level-change dialog's candidate list.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskList"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: createTask
      summary: "Tasks: Create"
      description: Creates a new task. The authenticated user is automatically set as the creator and first owner.
      tags:
        - Tasks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskCreate"
      responses:
        "201":
          description: Task created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskListItem"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"

  /tasks/graph:
    get:
      operationId: getTaskGraph
      summary: "Tasks: Graph (nodes + edges, owner-scoped)"
      description: >-
        Returns a renderer-agnostic { nodes, edges } graph for the authenticated
        user's tasks. Nodes are tasks and tags; edges are task-tag attachments and
        typed task-task relations. Honours the same filters as the task list
        (q, tags, tag_match). Task nodes carry a server-computed Louvain
        community for cluster colouring.
      tags:
        - Tasks
      parameters:
        - $ref: "#/components/parameters/SearchParam"
        - name: tags
          in: query
          required: false
          schema:
            type: string
          description: Comma-separated tag slugs to filter by
        - name: tag_match
          in: query
          required: false
          schema:
            type: string
            enum: [all, any]
            default: all
          description: Whether all (AND) or any (OR) of the given tag slugs must match (default all)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskGraph"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /memory/map:
    get:
      operationId: getMemoryMap
      summary: "Memory: Cluster map overview"
      description: >-
        Returns an aggregated cluster overview of the knowledge graph for the Memory
        Explorer map mode. Entities must have at least one confirmed edge (Explorer
        trust default). Connected components become clusters; cross-cluster confirmed
        edges are aggregated as meta_edges. Top-level responses cap at ~25 clusters;
        additional components contribute to hidden_count.
      tags:
        - Memory
      parameters:
        - name: level
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/MemoryMapLevel"
          description: Map detail level — overview (default) or drill into a cluster
        - name: cluster_id
          in: query
          required: false
          schema:
            type: string
            minLength: 1
          description: Cluster identifier for drill-level requests (e.g. "cc:7")
        - name: include_candidates
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: When true, include candidate (inferred) edges in addition to confirmed
        - name: include_superseded
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: When true, include superseded edges in addition to current edges
        - $ref: "#/components/parameters/MemoryExplorerEntityTypeParam"
        - $ref: "#/components/parameters/MemoryExplorerEdgeOriginParam"
        - $ref: "#/components/parameters/MemoryExplorerFactLayerParam"
        - $ref: "#/components/parameters/MemoryExplorerConfidenceMinParam"
        - $ref: "#/components/parameters/MemoryExplorerEdgeStatusParam"
        - $ref: "#/components/parameters/MemoryExplorerSensitivityParam"
        - name: predicate
          in: query
          required: false
          schema:
            type: string
            minLength: 1
          description: Filter edges to this predicate name
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryMap"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /memory/graph:
    get:
      operationId: getMemoryGraph
      summary: "Memory: Graph expansion from anchor"
      description: >-
        Returns access-filtered nodes and edges for a knowledge-graph anchor.
        Default trust filter includes only confirmed edges; set include_candidates
        to also return candidate edges. Edge line_style distinguishes provenance
        (solid = structural/source, dashed = inferred/candidate).
      tags:
        - Memory
      parameters:
        - name: anchor
          in: query
          required: true
          schema:
            type: string
            minLength: 1
          description: Entity stable ID to expand from (e.g. "service:plai-api")
        - name: depth
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 2
            default: 2
          description: Traversal depth (1 = direct neighbours, 2 = two hops)
        - name: include_candidates
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: When true, include candidate (inferred) edges in addition to confirmed
        - name: include_superseded
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: When true, include superseded edges in addition to current edges
        - $ref: "#/components/parameters/MemoryExplorerEntityTypeParam"
        - $ref: "#/components/parameters/MemoryExplorerEdgeOriginParam"
        - $ref: "#/components/parameters/MemoryExplorerFactLayerParam"
        - $ref: "#/components/parameters/MemoryExplorerConfidenceMinParam"
        - $ref: "#/components/parameters/MemoryExplorerEdgeStatusParam"
        - $ref: "#/components/parameters/MemoryExplorerSensitivityParam"
        - name: predicate
          in: query
          required: false
          schema:
            type: string
            minLength: 1
          description: Filter edges to this predicate name
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryGraph"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /memory/entities:
    get:
      operationId: listMemoryEntities
      summary: "Memory: Entity list (faceted, paginated)"
      description: >-
        Returns a paginated, access-filtered list of knowledge-graph entities for the
        Memory Explorer table entry point. Supports the shared explorer filter vocabulary
        plus standard list query parameters.
      tags:
        - Memory
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/SearchParam"
        - name: sort_by
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/MemoryEntitySortField"
          description: Field to sort by
        - $ref: "#/components/parameters/SortDirParam"
        - $ref: "#/components/parameters/MemoryExplorerEntityTypeParam"
        - $ref: "#/components/parameters/MemoryExplorerEdgeOriginParam"
        - $ref: "#/components/parameters/MemoryExplorerFactLayerParam"
        - name: include_candidates
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: When true, include entities only reachable via candidate edges
        - name: include_superseded
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: When true, include entities only reachable via superseded edges
        - $ref: "#/components/parameters/MemoryExplorerConfidenceMinParam"
        - $ref: "#/components/parameters/MemoryExplorerEdgeStatusParam"
        - $ref: "#/components/parameters/MemoryExplorerSensitivityParam"
        - name: predicate
          in: query
          required: false
          schema:
            type: string
            minLength: 1
          description: Filter to entities linked by this predicate
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryEntityList"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /memory/entities/{stable_id}/source:
    get:
      operationId: getMemoryEntitySource
      summary: "Memory: Resolve navigable source for an entity"
      description: >-
        Returns an internal route or external URL for jumping to the operative
        source behind a memory-graph node (task, Jira issue, or related doc).
      tags:
        - Memory
      parameters:
        - name: stable_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
          description: Entity stable ID (e.g. "task:{uuid}" or "jira:anw-1234")
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryEntitySource"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /memory/entities/{stable_id}/report-question:
    post:
      operationId: reportMemoryEntityQuestion
      summary: "Memory: Report entity as questionable"
      description: >-
        Creates or reuses an open question linked to the knowledge entity.
        Does not modify graph edges — corrections flow through OpenQuestion only.
      tags:
        - Memory
      parameters:
        - name: stable_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
          description: Entity stable ID to flag as questionable
      responses:
        "200":
          description: Existing open question reused for this user and entity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryReportedQuestion"
        "201":
          description: New open question created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryReportedQuestion"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /tasks/board:
    get:
      operationId: getTaskBoard
      summary: "Tasks: Board diagram data (unpaginated)"
      description: >-
        Returns every task the caller can access — direct membership, ancestor
        membership (inherited) or a TaskAccessGrant, i.e. the same scope as
        GET /tasks?view=all — together with its hierarchy edges and typed
        relation edges in a single payload.


        Deliberately NOT a paginated list (ANW-7802): the board renders one
        spatial diagram whose auto-layout can only be computed once every node
        and edge is known. Paging would either produce a layout that reshuffles
        with each page or force the client to walk all pages before drawing
        anything, so the 1–100 cap of the shared list-query schema does not
        apply here. The payload is bounded by the caller's access scope
        (low hundreds of tasks) and carries only the slim fields the board card
        needs, not the full TaskListItem.


        Archived tasks (archivedAt set) and tasks with status DISCARDED are
        excluded; both filters are orthogonal and applied separately.


        The caller's stored card positions and viewport (ANW-7805) ship with
        the same payload: fetching them separately would show every card first
        at its auto-layout spot and only then at its stored position, i.e. make
        the whole board visibly jump. Positions of tasks outside this payload
        are ignored (not returned, not deleted).
      tags:
        - Tasks
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskBoard"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /tasks/board/layout:
    put:
      operationId: saveTaskBoardLayout
      summary: "Tasks: Save board card positions and viewport (bulk)"
      description: >-
        Writes the caller's own board layout: card positions in bulk plus,
        optionally, the viewport. Deliberately narrow — the board's read path is
        GET /tasks/board; this endpoint only persists layout, never task data.


        The first snapshot of a board covers several hundred positions and goes
        out as ONE call, not one request per card.


        `mode` decides what happens to positions that already exist:

        * `upsert` (default) — overwrite. Used for a single moved card and for
          Reset, which overwrites the stored snapshot (it never deletes it,
          otherwise the next session would start without positions).
        * `create_only` — create missing positions, leave existing ones
          untouched. Used for the first snapshot: two tabs opened at the same
          time would otherwise overwrite each other's freshly written positions
          and the cards would jump on the next load.


        Positions naming a task the caller cannot access (or that no longer
        exists) are skipped, not rejected: a snapshot of several hundred cards
        is written seconds after the board was read, and one task discarded in
        between must not fail the whole write.
      tags:
        - Tasks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskBoardLayoutWrite"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskBoardLayoutWriteResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /tasks/my-priority:
    get:
      operationId: getMyPriorityQueue
      summary: "Tasks: My derived priority order"
      description: >-
        AURA-930 / AURA-1146: the caller's work in the one order derived from
        every context ordering — ASAP first, then the depth-first walk of the
        ranked tree (sagas, then the root:unparented pseudo-context), then the
        freely choosable tasks below a deliberately unordered level, then
        everything without a rank. The set is the caller's active core-role
        memberships on living tasks. Not paginated: the whole queue is computed
        once and shared by the dashboard panel (capped at ten client-side) and
        the person slideover (which shows all of it). An optional `limit` bounds
        `items`; omitted, the whole queue comes back.
      tags:
        - Tasks
      parameters:
        - name: limit
          in: query
          required: false
          description: >-
            Maximum number of queue entries. Omitted returns the whole queue;
            `total` and `unordered_count` always describe the whole queue, so a
            bounded answer says how much it left out.
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: The caller's derived priority order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyPriorityQueue"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /tasks/members/{userIdOrUuid}/priority:
    get:
      operationId: getPersonPriorityQueue
      summary: "Tasks: A person's derived priority order, filtered to the caller's access"
      description: >-
        AURA-930 / AURA-1148: the target person's complete derived priority
        order (same computation as `getMyPriorityQueue`), opened from the
        assignee name in the ordering dialog's card footer. Every task the
        caller may not read (d-022) is folded into an anonymous placeholder —
        its block and rank stay, so the sequence is complete and countable,
        but title, key, status and deadline never leave the server.
      tags:
        - Tasks
      parameters:
        - name: userIdOrUuid
          in: path
          required: true
          schema:
            type: string
          description: User integer ID or UUID of the target person.
      responses:
        "200":
          description: The target person's derived priority order, as the caller may read it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonPriorityQueue"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /tasks/hierarchy-graph:
    get:
      operationId: getTaskHierarchyGraph
      summary: "Tasks: Hierarchy Graph (directed tree, owner-scoped)"
      description: >-
        Returns the owner's task tree as a directed { nodes, edges } graph.
        Nodes are tasks carrying their hierarchy level; edges point parent→child
        (directed). Reuses the same TaskGraph DTO as the tag graph.
        Only tasks owned by the authenticated user are included.
      tags:
        - Tasks
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskGraph"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /tasks/by-jira-key/{key}:
    get:
      operationId: getTaskByJiraKey
      summary: "Tasks: Get by Jira key"
      description: >-
        Resolves a task via its linked Jira issue key. Matches the JiraIssue
        mirror for the key against the current user's connected Jira cloud
        site. 404 when the key is unknown, belongs to a different cloud
        site, or has no linked task; 403 (ANW-7662) when the task exists but
        the caller lacks access — naming the owner in `meta`. Returns the
        same detail shape as GET /mcp/tasks/{id}.
      tags:
        - Tasks
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
          description: Jira issue key, e.g. "ANW-7577"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpTaskDetail"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AccessDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /tasks/by-key/{key}:
    get:
      operationId: getTaskByHumanKey
      summary: "Tasks: Get by human-readable key"
      description: >-
        Resolves a task via its human-readable identifier (e.g. "AURA-42",
        ANW-7570). 404 when the key is unknown or malformed; 403 (ANW-7662)
        when the task exists but the caller lacks access — naming the owner
        in `meta`. Returns the same payload as GET /tasks/{uuid} so opening a
        task by key costs a single request (ANW-7848).
      tags:
        - Tasks
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
          description: Human-readable task identifier, e.g. "AURA-42"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AccessDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /tasks/{uuid}/neighborhood:
    get:
      operationId: getTaskNeighborhood
      summary: "Tasks: Hierarchy neighbourhood (scoped for the detail-view mini-map)"
      description: >-
        Returns the local hierarchy neighbourhood of one task as slim card-shaped
        nodes: the ancestor chain to the root, its siblings (children of its direct
        parent), and its direct children. Each node carries the fields the shared
        task card renders (human_key, title, status, level, owners, my_roles,
        looking_for_owner_at) plus parent_task_id for layout and archived_at for
        agent consumers. Only parent-child hierarchy edges are included (no semantic
        TaskRelation edges). Returns an empty graph if the task has neither a parent
        nor children, so callers can hide the map. Mirrored as the MCP tool of the
        same name — agents should treat this as the neighbourhood of one task, not
        the full-tenant hierarchy graph. An optional `depth` bounds the ancestor
        chain; omitted, it reaches the root.
      tags:
        - Tasks
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Task UUID
        - name: depth
          in: query
          required: false
          description: Ancestor hops to include. Omitted returns the chain to the root.
          schema:
            type: integer
            minimum: 0
            maximum: 2
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskNeighborhoodGraph"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /tasks/{uuid}/cycle-times:
    get:
      operationId: getTaskCycleTimes
      summary: "Tasks: Cycle times (stays on one task)"
      description: >-
        Returns the derived stays of one task for the cycle-time display
        (AURA-1654): every PHASE interval in time order with duration computed
        at read time, the parallel owner/crew-search strand, and the reason of
        a status change joined from ActivityEvent. Not a list endpoint — a task
        typically has fewer than twenty intervals and the chronology needs them
        all. Whoever can read the task can read the durations; there is no
        extra capability.
      tags:
        - Tasks
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Task UUID
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskCycleTimes"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /tasks/{uuid}:
    get:
      operationId: getTask
      summary: "Tasks: Get detail"
      description: >-
        Returns the full detail of a task including the member list. 404
        when no task exists for the UUID; 403 (ANW-7662) when the task
        exists but the caller lacks (sufficient) access — `meta.reason`
        distinguishes no relationship at all (`no_access`) from insufficient
        permission for the action (`insufficient_permission`), and
        `meta.owners` names who can grant more access.
      tags:
        - Tasks
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Task UUID
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AccessDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      operationId: updateTask
      summary: "Tasks: Update"
      description: >-
        Updates title, description, level, parent, type, archived state and/or
        status of a task. Raising `level` to SAGA or EPIC requires the matching
        CREATE_SAGA / CREATE_EPIC capability (ANW-7864); otherwise responds 403.
        Promoting or demoting a task (e.g. SUBTASK → STORY) is a **single
        call** with both `level` and `parent_task_id` set together — a
        level-only change usually fails hierarchy validation on its own
        because the existing parent is no longer at a valid level for the new
        target. The default new parent when promoting is the current parent's
        own parent (the grandparent), which makes the promoted task a sibling
        of its former parent. If the level change would leave existing
        children with an invalid parent, they cascade one level in the same
        direction (AURA-1226) and their status is carried over where the
        target series still has it, otherwise reset to OPEN — the response's
        `HIERARCHY_ERROR` detail names any child this would push beyond the
        SAGA..SUBTASK depth limits instead of applying a partial change.
      tags:
        - Tasks
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Task UUID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskPatch"
      responses:
        "200":
          description: Task updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskDetail"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

