  /capacity/read:
    get:
      operationId: readCapacity
      summary: "Capacity: Read capacity with a scope (me, person, group, or company)"
      description: "AURA-1722: one read tool for capacity. scope=me returns the caller's own row (one-row list, works for everyone); scope=person returns one person's row (yourself always; a foreign person requires LEAD of a common group or VIEW_CAPACITY_OVERVIEW); scope=group returns the members of a group the caller leads (omit group_uuid for 'my team' — every group where the caller is LEAD; a member with no active task appears at 0% with an empty task list); scope=company returns the firm-wide, person-centric overview (Leadership/Admin, paginated). The scope-dependent capability gate is enforced inside the operation — a refusal is a structured error, never an empty list. 'No lead role' (scope=group without group_uuid) returns NO_LEAD_ROLE, distinguishable from 'group exists but has no members' which returns an empty list."
      tags:
        - Capacity
      parameters:
        - name: scope
          in: query
          required: true
          schema:
            type: string
            enum: [me, person, group, company]
          description: Whose capacity to read — "me" for the caller's own row, "person" for one person (pass person_uuid), "group" for a group the caller leads (pass group_uuid, or omit for "my team"), "company" for the firm-wide overview (Leadership/Admin).
        - name: person_uuid
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Target person UUID — required for scope=person, ignored otherwise.
        - name: group_uuid
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Target group UUID for scope=group. Omit for "my team" — every group where the caller is LEAD. Ignored for other scopes.
        - $ref: "#/components/parameters/PageParam"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
          description: Items per page for scope=company (default 20, max 100). Ignored for other scopes.
      responses:
        "200":
          description: A scoped capacity read — a one-row list for scope=me/person, the roster for scope=group, a paginated overview for scope=company.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapacityReadResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

