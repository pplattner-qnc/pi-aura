                $ref: "#/components/schemas/SkillAssetList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: uploadSkillAsset
      tags: [Skills]
