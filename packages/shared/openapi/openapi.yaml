    delete:
      operationId: unlinkJiraIssueFromTask
      summary: "Tasks: Unlink a Jira issue"
      description: Removes the Jira issue link from a task. The mirrored JiraIssue record itself is not deleted.
      tags:
        - Tasks
      parameters:
        - name: uuid
          in: path
          required: true
