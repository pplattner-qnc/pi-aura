  /tasks/{uuid}/jira-issues:
    post:
      operationId: linkJiraIssueToTask
      summary: "Tasks: Link a Jira issue"
      description: >-
        Fetches and mirrors the Jira issue by key, then creates an idempotent
        TaskJiraIssue link. Idempotent — returns 200 if already linked.
        Error responses carry a `type` discriminator: 409 when no Jira account is
        connected (`not_connected`), when the stored token is no longer usable
        (`token_invalid`), or when another task already owns the issue
        (`already_linked`); 404 when the issue key does not exist in Jira
        (`not_found`); 502 on an upstream Jira error (`error`). A 403 comes from
        the per-object access layer instead and is discriminated by `meta.reason`.
      tags:
        - Tasks
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Task UUID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskJiraIssueAttach"
      responses:
        "200":
          description: Jira issue linked; returns updated task detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskDetail"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AccessDenied"
        "404":
          description: Jira issue not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/JiraIssueLinkProblemDetail"
        "409":
          description: Jira not connected, token invalid, or already linked
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/JiraIssueLinkProblemDetail"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          description: Upstream Jira error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/JiraIssueLinkProblemDetail"

