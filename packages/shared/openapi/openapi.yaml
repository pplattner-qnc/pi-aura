  /knowledge/nodes/{uuid}/versions/{version}/restore:
    parameters:
      - name: uuid
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: version
        in: path
        required: true
        schema:
          type: integer
    post:
      operationId: restoreKnowledgeNodeVersion
      tags: [knowledge]
      summary: Restore a document node to a previous version (creates new version)
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Node after restore
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeNode"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /knowledge/nodes/{uuid}/images:
    post:
      operationId: uploadKnowledgeNodeImage
      summary: Upload an image for a knowledge node
      tags: [knowledge]
      security:
        - cookieAuth: []
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: Image uploaded successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeNodeImage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          description: Payload too large (exceeds 10 MB)
        "415":
          description: Unsupported media type

  /knowledge/nodes/{uuid}/images/{imageId}:
    get:
      operationId: getKnowledgeNodeImage
      summary: Serve an image for a knowledge node
      tags: [knowledge]
      security:
        - cookieAuth: []
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: imageId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Image binary
          content:
            image/jpeg: {}
            image/png: {}
            image/webp: {}
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /knowledge/nodes/{uuid}/frontmatter:
    put:
      operationId: saveKnowledgeNodeFrontmatter
      summary: Save (replace) the front matter of a wiki page
      tags: [Knowledge]
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [raw]
              properties:
                raw:
                  type: string
                  nullable: true
                  description: YAML string. Null or empty string clears the front matter.
      responses:
        '200':
          description: Updated node with new front matter.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeNode'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /knowledge/search:
    get:
      operationId: searchKnowledge
      tags: [Knowledge]
      summary: Search wiki, repository and skill knowledge spaces
      description: Hybrid search over knowledge pages — literal (German full-text plus a trigram fallback for compound words) and semantic, merged into one ranked list via reciprocal rank fusion. Restricted to the caller's readable spaces.
      security:
        - cookieAuth: []
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 200
        - name: space_slug
          in: query
          required: false
          description: Restrict the search to one knowledge space. Omit to search every space the caller may read.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: Matching knowledge pages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeSearchList"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /skills/plugins:
    get:
      operationId: listSkillPlugins
      tags: [Skills]
      summary: List skill plugins
      description: Returns all top-level plugin folders in the Skills space with their skill counts.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: List of skill plugins
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillPluginList"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /skills/plugins/{uuid}:
    parameters:
      - name: uuid
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      operationId: deleteSkillPlugin
      tags: [Skills]
      summary: Delete a skill plugin (admin only)
      description: Deletes the plugin folder and every skill, reference document, embedding chunk and stored asset below it. Requires the MANAGE_SKILLS capability.
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillPluginDeleteResult"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /skills:
    get:
      operationId: listSkills
      tags: [Skills]
      summary: List skills
      description: Returns a paginated list of skills visible to the current user (own PERSONAL + all PUBLIC).
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/LimitParam"
        - name: q
          in: query
          required: false
          schema:
            type: string
          description: Exact text search on skill name/description
        - name: visibility
          in: query
          required: false
          schema:
            type: string
            enum: [PERSONAL, PUBLIC, ALL]
          description: Filter by visibility scope
        - name: plugin_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Filter by parent plugin folder UUID
        - name: sort_by
          in: query
          required: false
          schema:
            type: string
            enum: [name, created_at, updated_at]
            default: updated_at
        - name: sort_dir
          in: query
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        "200":
          description: Paginated list of skills
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillList"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createSkill
      tags: [Skills]
      summary: Create a skill
      description: Creates a new SKILL document in the canonical Skills space. Visibility defaults to PERSONAL.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SkillCreate"
      responses:
        "201":
          description: Created skill
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Skill"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /skills/{uuid}:
    parameters:
      - name: uuid
        in: path
