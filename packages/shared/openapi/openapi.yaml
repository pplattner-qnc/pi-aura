    ArtifactListItem:
      type: object
      required: [id, title, latest_version, created_at, updated_at, source_chat_id, source_chatbot_code, is_owner, permission, shared, kind, pending_for_me]
      description: Lightweight artifact list item with primary chat routing hint
      properties:
        id:
          type: string
          format: uuid
          description: Artifact UUID
        title:
          type: string
          description: Artifact title
        latest_version:
          type: integer
          minimum: 1
          description: Latest version number
        created_at:
          type: string
          format: date-time
          description: ISO 8601 creation timestamp
        updated_at:
          type: string
          format: date-time
          description: ISO 8601 last update timestamp
        source_chat_id:
          type: string
          format: uuid
          nullable: true
          description: UUID of the most recently updated chat that references this artifact (null if no refs exist)
        source_chatbot_code:
          type: string
          nullable: true
          description: Chatbot code of the source chat (null if no refs exist)
        is_owner:
          type: boolean
          description: Whether the current user is the direct owner of this artifact
        permission:
          type: string
          enum: [READ, EDIT, MANAGE]
          description: Effective permission of the requesting user (READ < EDIT < MANAGE)
        shared:
          type: boolean
          description: True when this artifact is shared with the current user via task cascade (not directly owned)
        kind:
          $ref: "#/components/schemas/ArtifactKind"
        review_state:
          type: string
          enum: [UNCHECKED, IN_REVIEW, APPROVED, NEEDS_REVISION, SUPERSEDED]
          nullable: true
          description: Review state of the latest version (null if version data not available)
        review_approved_count:
          type: integer
          nullable: true
          description: Number of APPROVED decisions (only non-null for IN_REVIEW artifacts)
        review_rejected_count:
          type: integer
          nullable: true
          description: Number of REJECTED decisions (only non-null for IN_REVIEW artifacts)
        review_total_required:
          type: integer
          nullable: true
          description: Total number of required reviewers (only non-null for IN_REVIEW artifacts)
        pending_for_me:
          type: boolean
          description: True when this artifact has an open review assignment for the requesting user with no decision yet

    ArtifactList:
      type: object
      required: [items, pagination]
      description: Paginated list of artifacts
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ArtifactListItem"
          description: Artifact items for the current page
        pagination:
          $ref: "#/components/schemas/Pagination"

    AcceptArtifactMemoryResponse:
      type: object
      required: [skipped, run_id, content_hash]
      properties:
        skipped:
          type: boolean
          description: True when watermark matched and no new ingest job was enqueued
        run_id:
          type: string
          format: uuid
          nullable: true
          description: KG_INGEST_ITEM ScriptRun UUID when enqueued
        content_hash:
          type: string
          description: SHA-256 hash of the accepted artifact body
        message:
          type: string
          description: Human-readable status when skipped

    ArtifactDetail:
      type: object
      required: [id, title, latest_version, version, body, summary, frontmatter, frontmatter_raw, created_at, updated_at, source_chat_id, source_chat_title, source_chatbot_code, is_owner, permission, review_state, kind, created_by_name, version_author_name, review_of_artifact_id, review_of_version, review_of_artifact_title]
      description: Full artifact detail including the body of the requested version
      properties:
        id:
          type: string
          format: uuid
          description: Artifact UUID
        title:
          type: string
          description: Artifact title
        latest_version:
          type: integer
          description: Latest version number (for future version switcher)
        version:
          type: integer
          description: Version currently loaded (equals latest_version in T01)
        body:
          type: string
          description: Markdown body of the loaded version
        summary:
          type: string
          nullable: true
          description: Optional short summary
        frontmatter:
          type: object
          additionalProperties: true
          nullable: true
          description: Parsed OKF frontmatter (key/value metadata) of the loaded version; null when the version has none
        frontmatter_raw:
          type: string
          nullable: true
          description: Raw YAML rendering of the frontmatter (without --- fences); null when the version has none
        created_at:
          type: string
          format: date-time
          description: ISO 8601 creation timestamp
        updated_at:
          type: string
          format: date-time
          description: ISO 8601 last update timestamp
        source_chat_id:
          type: string
          format: uuid
          nullable: true
          description: UUID of the most recently updated chat that references this artifact (null if no refs exist)
        source_chat_title:
          type: string
          nullable: true
          description: Title of the source chat (raw chat.title, may be null; frontend renders 'Unbenannter Chat' as fallback)
        source_chatbot_code:
          type: string
          nullable: true
          description: Chatbot code of the source chat (null if no refs exist)
        is_owner:
          type: boolean
          description: True if the requesting user is the direct owner of this artifact (MANAGE level)
        permission:
          type: string
          enum: [READ, EDIT, MANAGE]
          description: Effective permission of the requesting user (READ < EDIT < MANAGE)
        review_state:
          type: string
          enum: [UNCHECKED, IN_REVIEW, APPROVED, NEEDS_REVISION, SUPERSEDED]
          nullable: true
          description: Review state of the loaded version (null if version data not available)
        kind:
          $ref: "#/components/schemas/ArtifactKind"
        created_by_name:
          type: string
          nullable: true
          description: Display name of the artifact owner (who created the artifact); null when not available
        version_author_name:
          type: string
          nullable: true
          description: Display name of the user who authored the currently loaded version; null for legacy versions or when same as created_by_name
        review_of_artifact_id:
          type: string
          format: uuid
          nullable: true
          description: UUID of the artifact this review document was written for; non-null only when kind is REVIEW
        review_of_version:
          type: integer
          nullable: true
          description: Version of the reviewed artifact this review document was written for; non-null only when kind is REVIEW
        review_of_artifact_title:
          type: string
          nullable: true
          description: Title of the reviewed artifact; non-null only when kind is REVIEW and the parent artifact still exists

    ChatArtifactSummary:
      type: object
      required: [id, title, latest_version, updated_at, review_state, kind]
      description: Lightweight artifact summary used in the chat artifact switcher
      properties:
        id:
          type: string
          format: uuid
          description: Artifact UUID
        title:
          type: string
          description: Artifact title
        latest_version:
          type: integer
          description: Latest version number
        updated_at:
          type: string
          format: date-time
          description: ISO 8601 last update timestamp
        review_state:
          type: string
          enum: [UNCHECKED, IN_REVIEW, APPROVED, NEEDS_REVISION, SUPERSEDED]
          nullable: true
          description: Review state of the latest version (null if version data not available)
        kind:
          $ref: "#/components/schemas/ArtifactKind"

    ChatArtifactList:
      type: object
      required: [items]
      description: Non-paginated list of artifacts linked to a chat (switcher index)
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ChatArtifactSummary"
          description: Artifacts linked to the chat, sorted by updatedAt DESC

    ArtifactTaskRef:
      type: object
      required: [id, human_key, title, status]
      description: Lightweight task reference attached to an artifact
      properties:
        id:
          type: string
          format: uuid
          description: Task UUID
        human_key:
          type: string
          description: Human-readable, immutable task identifier (e.g. "AURA-42") — used for browser links; id stays the API identifier (ANW-7848).
        title:
          type: string
          description: Task title
        status:
          type: string
          enum: [OPEN, ARCHIVED]
          description: Task status

    ArtifactTaskList:
      type: object
      required: [items]
      description: Non-paginated list of tasks linked to an artifact
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ArtifactTaskRef"
          description: Tasks linked to the artifact, sorted by updatedAt DESC

    ShareAccessPerson:
      type: object
      required: [user, roles]
      description: >
        One person with access to a shared entity (task or artifact), for the
        flat share-modal list (ANW-7754). Roles are TaskRoles when access comes
        from task membership; empty for a standalone artifact owner.
      properties:
        user:
          $ref: "#/components/schemas/UserPickerItem"
        roles:
          type: array
          items:
            $ref: "#/components/schemas/TaskRole"
          description: Union of TaskRoles across linked tasks (deduplicated).

    ArtifactGrantEntry:
      type: object
      required: [user, level]
      description: >
        One entry in an artifact's own access list (ArtifactAccessGrant, S1 ·
        AURA-921), the source the reviewer-access grant endpoints manage
        (S3, AURA-923). Only USER-principal grants resolve to a single person;
        COMPANY-principal grants have none and are omitted from this list (they
        still count toward broad_access).
      properties:
        user:
          $ref: "#/components/schemas/UserPickerItem"
        level:
          type: string
          enum: [READ, EDIT]
          description: >
            Level granted to this principal via the artifact's own access list.
            Mirrors the ArtifactGrantLevel enum: MANAGE stays reserved for
            ownership and can never appear in a grant row.

    ArtifactAccessOverview:
      type: object
      required: [items, linked_to_task, broad_access, grants, can_manage]
      description: >
        Flat, read-only access list for an artifact (ANW-7754). Always includes
        the artifact owner; when linked to one or more tasks, also includes
        direct TaskMembers of those tasks (deduplicated, roles unioned).
      properties:
        linked_to_task:
          type: boolean
          description: True when the artifact is linked to at least one task.
        items:
          type: array
          items:
            $ref: "#/components/schemas/ShareAccessPerson"
          description: Deduplicated people with access, sorted by display name.
        broad_access:
          type: array
          items:
            $ref: "#/components/schemas/BroadAccessEntry"
          description: >
            Sources of broad (non-individual) access via linked tasks — direct or
            inherited whole-company/group grants, open owner-/crew-search
            (ANW-7907, S4). Empty when nothing broad applies or the artifact
            is standalone. Powers the warning box in ShareModal; USER grants are
            excluded. Every level is READ regardless of the source task's grant.
        grants:
          type: array
          items:
            $ref: "#/components/schemas/ArtifactGrantEntry"
          description: >
            Direct entries in the artifact's own access list (S3, AURA-923),
            managed via POST/DELETE /artifacts/{id}/grants.
        can_manage:
          type: boolean
          description: >
            True when the viewer may add/remove entries in `grants` (resolved
            permission MANAGE or higher) — what S5's share-dialog controls hang off.

    ArtifactVersionListItem:
      type: object
      required: [version, summary, created_at, created_by_message_id, created_by_name]
      description: A single version entry without body, used in the version history list
      properties:
        version:
          type: integer
          minimum: 1
          description: Version number
        summary:
          type: string
          nullable: true
          description: Optional short change note for this version
        created_at:
          type: string
          format: date-time
          description: ISO 8601 creation timestamp
        created_by_message_id:
          type: string
          format: uuid
          nullable: true
          description: UUID of the assistant message that created this version (null for user edits)
        created_by_name:
          type: string
          nullable: true
          description: Display name of the user who authored this version; null for legacy versions

    ArtifactVersionList:
      type: object
      required: [items]
      description: Non-paginated version history for an artifact, sorted by version DESC
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ArtifactVersionListItem"
          description: Version list items sorted by version DESC

    TaskArchiveState:
      type: string
      enum: [OPEN, ARCHIVED]
      description: Derived archive state of a task (OPEN when archived_at is null, ARCHIVED otherwise); used only by the task graph node presentation.

    TaskStatus:
      type: string
      enum:
        [
          OPEN,
          READY_FOR_REFINEMENT,
          IN_REFINEMENT,
          READY_FOR_ALIGNMENT,
          IN_ALIGNMENT,
          READY_FOR_DEVELOPMENT,
          IN_DEVELOPMENT,
          READY_FOR_REVIEW,
          IN_REVIEW,
          READY_FOR_DEPLOYMENT,
          IN_DEPLOYMENT,
          DONE,
          DISCARDED,
        ]
      description: Fixed workflow status of a task (ANW-7228; extended to the full T18 vocabulary in ANW-7459/S01). Orthogonal to archived_at and looking_for_owner_at. Which subset is valid for a given task depends on its level — see status_type and TaskLevel.

    TaskStatusType:
      type: string
      enum: [OPEN, WAITING, ACTIVE, TERMINAL]
      description: Derived machine-readable classification of a task's status (ANW-7459/S01) — OPEN (intake), WAITING (paused, "Ready for …"), ACTIVE (in progress, "In …"), TERMINAL (DONE/DISCARDED). Lets UI and logic tell "waiting" from "actively in progress" generically, without hard-coding every status. Not persisted; derived from status.

    TaskLevel:
      type: string
      enum: [SAGA, EPIC, STORY, SUBTASK]
      description: Hierarchy level of a task (Saga > Epic > Story > Sub-Task)

    WorkflowVariant:
      type: string
      enum: [STANDARD, DISCOVERY]
      description: Workflow variant (T18 · S02, ANW-7522). DISCOVERY is the shortened concept workflow (Open → … → In Alignment → Done, no Development/Review/Deployment); selectable only for EPIC/STORY at creation and immutable afterwards.

    TaskType:
      type: string
      enum: [FEATURE, BUG, IDEA, CHORE, DISCOVERY]
      description: Classifies what kind of work the task represents. IDEA is a raw parked idea without a draft; DISCOVERY is deliberate exploratory work (spike, research, open architecture question).

    TaskRelationType:
      type: string
      enum: [RELATES_TO, PART_OF, BLOCKS, DUPLICATES]
      description: Typed, directed relation between two tasks

    TaskSortField:
      type: string
      enum: [created_at, updated_at, title]
      description: Sortable fields for task list

    TaskCreate:
      type: object
      required: [title]
      description: Payload for creating a new task
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
          description: Task title (required, 1–200 characters)
        description:
          type: string
          description: Optional task description (Markdown)
        parent_task_id:
          type: string
          format: uuid
          nullable: true
          description: UUID of the parent task. When set, the child level is derived automatically (one step below the parent in the fixed hierarchy SAGA→EPIC→STORY→SUBTASK).
        level:
          $ref: "#/components/schemas/TaskLevel"
          nullable: true
          description: Hierarchy level for the task. Ignored when parent_task_id is set (level is then derived from parent). SUBTASK requires a parent.
        type:
          $ref: "#/components/schemas/TaskType"
          nullable: true
          description: Work type of the task. Defaults to FEATURE if not specified.
        workflow_variant:
          $ref: "#/components/schemas/WorkflowVariant"
          nullable: true
          description: Workflow variant. Only EPIC/STORY may set DISCOVERY (400 otherwise); defaults to STANDARD, immutable after creation.
        scope:
          type: string
          description: What the task covers — which components, pages or systems are in scope.
        tags:
          type: array
          items:
            type: object
            required: [name]
            properties:
              name:
                type: string
                minLength: 1
                maxLength: 100
              kind:
                $ref: "#/components/schemas/TagKind"
          maxItems: 3
          description: Up to three tags to attach to the new task.
        repository_uuids:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 10
          description: Repositories to link to the new task.
        origin_chat_uuid:
          type: string
          format: uuid
          description: Chat this task originated from.

    TaskListItem:
      type: object
      required: [id, human_key, title, description, scope, status, status_type, type, chat_count, artifact_count, tags, unread, has_unread_comments, rank_context, asap, status_changed_at, created_at, updated_at]
      description: Lightweight task list item
      properties:
        id:
          type: string
          format: uuid
          description: Task UUID (public identifier)
        human_key:
          type: string
          description: Human-readable, immutable task identifier (e.g. "AURA-42"), assigned atomically on creation (ANW-7570).
        title:
          type: string
          description: Task title
        description:
          type: string
          description: Task description (Markdown, may be empty string)
        scope:
          type: string
          description: Task scope (what the task covers, may be empty string)
        status:
          $ref: "#/components/schemas/TaskStatus"
        status_type:
          $ref: "#/components/schemas/TaskStatusType"
        type:
          $ref: "#/components/schemas/TaskType"
        level:
          $ref: "#/components/schemas/TaskLevel"
          nullable: true
          description: Hierarchy level (null if not assigned)
        parent_task_id:
          type: string
          format: uuid
          nullable: true
          description: UUID of the parent task (null if no parent)
        parent:
          allOf:
            - $ref: "#/components/schemas/TaskHierarchyRef"
          nullable: true
          description: Slim parent task reference (null if no parent). Preferred over parent_task_id when title/level are needed (ANW-7743).
        child_count:
          type: integer
          minimum: 0
          description: Number of direct child tasks
        open_child_count:
          type: integer
          minimum: 0
          description: Number of direct child tasks with status OPEN
        archived_child_count:
          type: integer
          minimum: 0
          description: Number of direct child tasks with status ARCHIVED
        non_done_child_count:
          type: integer
          minimum: 0
          description: Number of non-archived direct children whose status is neither DONE nor DISCARDED (ANW-7743 board progress).
        my_roles:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/TaskRole"
          description: Direct TaskMember roles of the current user on this task. null = not a direct member; empty array = member without roles (ANW-7743).
        owners:
          type: array
          items:
            $ref: "#/components/schemas/UserPickerItem"
          description: All OWNER members of this task (ANW-7743 story cards). Empty when the task has no owner.
        chat_count:
          type: integer
          minimum: 0
          description: Number of chats linked to this task
        artifact_count:
          type: integer
          minimum: 0
          description: Number of artifacts linked to this task
        tags:
          type: array
          items:
            $ref: "#/components/schemas/TaskTagRef"
          description: Tags attached to this task
        archived_at:
          type: string
          format: date-time
          nullable: true
          description: ISO 8601 timestamp when the task was archived (null if OPEN)
        looking_for_owner_at:
          type: string
          format: date-time
          nullable: true
          description: >
            ISO 8601 timestamp when owner search was started (null when not searching).
            Phase-preserving flag orthogonal to status (T18 · S10, ANW-7748).
        owner_goal:
          type: string
          nullable: true
          description: Durable one-sentence owner mandate (set on search start; kept after assignment).
        owner_goal_due_date:
          type: string
          format: date-time
          nullable: true
          description: Delivery due date for the owner goal (inherited by the assigned owner).
        looking_for_crew_at:
          type: string
          format: date-time
          nullable: true
          description: >
            ISO 8601 timestamp when crew search was started (null when not searching).
            Phase-preserving flag orthogonal to status (T18 · S11, ANW-7759).
        crew_need:
          type: string
          nullable: true
          description: Durable free-text crew need shown in the crew-search marketplace.
        crew_need_due_date:
          type: string
          format: date-time
          nullable: true
          description: Optional time horizon for the current crew need.
        unread:
          type: boolean
          description: True when the current user has not yet opened this task since the last notable change (readAt is null for this membership).
        has_unread_comments:
          type: boolean
          description: >
            True when at least one comment by another user is newer than the
            viewer's comment-read watermark (AURA-999 / AURA-1082). Own comments
            never set this. Orthogonal to `unread` (task open-state).
        owner_application_count:
          type: integer
          minimum: 0
          description: >
            Number of open (PENDING) owner applications — only populated by the
            owner-search pool list (GET /tasks/looking-for-owner, S10, ANW-7748);
            omitted on the general task list.
        crew_request_count:
          type: integer
          minimum: 0
          description: >
            Number of open (PENDING) crew requests — only populated by the
            crew-search pool list (GET /tasks/looking-for-crew, S11, ANW-7759);
            omitted on the general task list.
        rank:
          type: integer
          nullable: true
          minimum: 1
          description: >
            Strict position within rank_context (1…n). Null while the task sits
            in the unprioritized tail (AURA-930 / AURA-1135).
        rank_context:
          type: string
          description: >
            Priority-order context key: "task:<parentTaskId>", "root:sagas", or
            "root:unparented" (AURA-930 / AURA-1135).
        asap:
          type: boolean
          description: >
            ASAP class flag — shown above all ordered work when true; the task
            keeps its rank in its context (AURA-930).
        rank_reason:
          type: string
          nullable: true
          description: Optional visible justification for the current ranking (AURA-930).
        status_changed_at:
          type: string
          format: date-time
          description: ISO 8601 timestamp since when the task has been in its current status (T18 · S32). Distinct from updated_at, which changes on any field edit.
        created_at:
          type: string
          format: date-time
          description: ISO 8601 creation timestamp
        updated_at:
          type: string
          format: date-time
          description: ISO 8601 last update timestamp

    TaskList:
      type: object
      required: [items, pagination]
      description: Paginated list of tasks
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TaskListItem"
          description: Task items for the current page
        pagination:
          $ref: "#/components/schemas/Pagination"

    TaskGraphNode:
      type: object
      required: [id, type, ref, label, community]
      description: A node in the task graph — either a task or a tag.
      properties:
        id:
          type: string
          description: "Stable node id, namespaced by type (e.g. \"task:<uuid>\" or \"tag:<slug>\")"
        type:
          type: string
          enum: [task, tag]
          description: Node category
        ref:
          type: string
          description: "Underlying reference: task UUID for task nodes, tag slug for tag nodes"
        human_key:
          type: string
          nullable: true
          description: >-
            Human-readable, immutable task identifier (e.g. "AURA-42"), used as the
            click/navigation reference instead of `ref`. Absent/null on tag nodes;
            the internal node `id` (`task:<uuid>`) stays unaffected.
        label:
          type: string
          description: Display label (task title or tag name)
        community:
          type: integer
          minimum: 0
          description: Server-computed Louvain community index for cluster colouring
        status:
          $ref: "#/components/schemas/TaskArchiveState"
        task_type:
          $ref: "#/components/schemas/TaskType"
        kind:
          $ref: "#/components/schemas/TagKind"
        level:
          $ref: "#/components/schemas/TaskLevel"
          nullable: true
          description: Hierarchy level of the task node (null for unleveled tasks; absent on tag nodes)
        task_status:
          $ref: "#/components/schemas/TaskStatus"
          description: Workflow status of the task node (absent on tag nodes); used for tooltip display, orthogonal to the archive `status` field above.

    TaskGraphEdge:
      type: object
      required: [id, source, target, relation, directed]
      description: An edge in the task graph — a task-tag attachment or a typed task-task relation.
      properties:
        id:
          type: string
          description: Stable edge id
        source:
          type: string
          description: Source node id
        target:
          type: string
          description: Target node id
        relation:
          type: string
          enum: [TASK_TAG, TASK_TASK]
          description: Edge category
        type:
          $ref: "#/components/schemas/TaskRelationType"
        directed:
          type: boolean
          description: "Whether the edge has a meaningful direction (true for PART_OF/BLOCKS)"

    TaskGraph:
      type: object
      required: [nodes, edges]
      description: Renderer-agnostic task graph payload
      properties:
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/TaskGraphNode"
        edges:
          type: array
          items:
            $ref: "#/components/schemas/TaskGraphEdge"

    TaskNeighborhoodNode:
      type: object
      required: [id, human_key, title, status, owners]
      description: >-
        Slim card-shaped node for the hierarchy neighbourhood mini-map
        (ANW-7853). Carries the fields the shared task card renders, plus
        parent_task_id for layout and archived_at for MCP/agent consumers.
        Deliberately omits board-only fields such as subtree_size.
      properties:
        id:
          type: string
          format: uuid
          description: Task UUID (public identifier)
        human_key:
          type: string
          description: Human-readable, immutable task identifier (e.g. "AURA-42")
        title:
          type: string
          description: Task title
        status:
          $ref: "#/components/schemas/TaskStatus"
        level:
          oneOf:
            - $ref: "#/components/schemas/TaskLevel"
            - type: "null"
          description: Hierarchy level (null for unleveled tasks)
        parent_task_id:
          type: string
          format: uuid
          nullable: true
          description: >-
            UUID of the parent task when that parent is also in this neighbourhood
            response; null for the root of the returned tree.
        my_roles:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/TaskRole"
          description: Direct TaskMember roles of the caller. null = not a direct member; empty array = member without roles.
        owners:
          type: array
          items:
            $ref: "#/components/schemas/UserPickerItem"
          description: All OWNER members of this task. Empty when the task has no owner.
        looking_for_owner_at:
          type: string
          format: date-time
          nullable: true
          description: ISO 8601 timestamp when owner search was started (null when not searching).
        archived_at:
          type: string
          format: date-time
          nullable: true
          description: >-
            ISO 8601 timestamp when the task was archived, or null when active.
            Kept for agent consumers of getTaskNeighborhood (replaces the former
            OPEN/ARCHIVED graph status).

    TaskNeighborhoodGraph:
      type: object
      required: [nodes, edges]
      description: Hierarchy neighbourhood payload for the detail-view mini-map (ANW-7853).
      properties:
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/TaskNeighborhoodNode"
        edges:
          type: array
          items:
            $ref: "#/components/schemas/TaskBoardHierarchyEdge"

    StayStartState:
      type: string
      enum: [known, unknown]
      description: Whether the start bound of a stay was observed (AURA-1652).

    StayEndState:
      type: string
      enum: [known, running, unknown]
      description: >-
        End bound of a stay (AURA-1652). `running` means the task is still in
        this stay; `unknown` means the stay was left without an end event —
        never a duration of zero and never still running.

    TaskStay:
      type: object
      required: [id, kind, status, started_at, ended_at, start_state, end_state, visit_index, visit_count, duration_ms, reason]
      description: One PHASE stay on a task (AURA-1654). Duration is computed at read time from the stored bounds.
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [PHASE]
        status:
          $ref: "#/components/schemas/TaskStatus"
        started_at:
          type: string
          format: date-time
          nullable: true
        ended_at:
          type: string
          format: date-time
          nullable: true
        start_state:
          $ref: "#/components/schemas/StayStartState"
        end_state:
          $ref: "#/components/schemas/StayEndState"
        visit_index:
          type: integer
          minimum: 1
          description: 1-based visit counter for this status on the task.
        visit_count:
          type: integer
          minimum: 1
          description: Total visits of this status on the task (so the UI can say "2. von 2").
        duration_ms:
          type: integer
          minimum: 0
          nullable: true
          description: Milliseconds between the bounds; null when a bound is missing so no duration can be computed.
        reason:
          type: string
          nullable: true
          description: Status-change reason from ActivityEvent.payload.reason, if any.

    TaskSearchStay:
      type: object
      required: [id, kind, started_at, ended_at, start_state, end_state, visit_index, duration_ms]
      description: One owner-search or crew-search stay running alongside the phase strand (AURA-1654).
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [OWNER_SEARCH, CREW_SEARCH]
        started_at:
          type: string
          format: date-time
          nullable: true
        ended_at:
          type: string
          format: date-time
          nullable: true
        start_state:
          $ref: "#/components/schemas/StayStartState"
        end_state:
          $ref: "#/components/schemas/StayEndState"
        visit_index:
          type: integer
          minimum: 1
        duration_ms:
          type: integer
          minimum: 0
          nullable: true

    TaskCycleTimes:
      type: object
      required: [stays, searches, current_stay, incomplete]
      description: Cycle-time payload for one task (AURA-1654).
      properties:
        stays:
          type: array
          items:
            $ref: "#/components/schemas/TaskStay"
        searches:
          type: array
          items:
            $ref: "#/components/schemas/TaskSearchStay"
        current_stay:
          description: The running PHASE stay, or null when none is running.
          anyOf:
            - $ref: "#/components/schemas/TaskStay"
            - type: "null"
        incomplete:
          type: boolean
          description: True when the first PHASE stay starts with an unknown bound (history predates the activity log).

    TaskRankContextEntry:
      type: object
      required: [id, human_key, title, level, status, rank, asap, rank_reason, viewer_is_owner, restricted, assignees, governing_date]
      description: >-
        One card in the ordering dialog (AURA-930 / AURA-1145). A restricted
        entry keeps its id and rank so the order stays complete and countable,
        but says nothing else about itself (d-022).
      properties:
        id:
          type: string
          format: uuid
          description: Task UUID (public identifier)
        human_key:
          type: string
          nullable: true
          description: Human-readable task identifier; null when restricted.
        title:
          type: string
          nullable: true
          description: Task title; null when restricted.
        level:
          description: Hierarchy level; null when unleveled or restricted.
          anyOf:
            - $ref: "#/components/schemas/TaskLevel"
            - type: "null"
        status:
          description: Workflow status; null when restricted.
          anyOf:
            - $ref: "#/components/schemas/TaskStatus"
            - type: "null"
        rank:
          type: integer
          nullable: true
          minimum: 1
          description: Position in the ordered zone; null = unordered.
        asap:
          type: boolean
          description: ASAP class flag (AURA-930).
        rank_reason:
          type: string
          nullable: true
          description: Optional rationale for the entry's placement (AURA-1147, d-004); null when restricted.
        viewer_is_owner:
          type: boolean
          description: Whether the caller owns this specific task — ASAP is owner-only (AURA-1147, d-017).
        restricted:
          type: boolean
          description: True when the caller may not read this task.
        assignees:
          type: array
          description: >-
            The task's active core-team members (owner, contributor) — the
            card footer's entry into that person's full queue (AURA-930 /
            AURA-1148). Empty when restricted, same rule as every other field.
          items:
            $ref: "#/components/schemas/PriorityAssigneeRef"
        governing_date:
          type: string
          format: date
          nullable: true
          description: >-
            The date-rail badge's governing deadline (AURA-930 / AURA-1149):
            the current phase's TaskPhaseGoal.deadline, else the next future
            phase deadline, else null (no badge). Null when restricted.

    PriorityAssigneeRef:
      type: object
      required: [id, display_name, capacity_percent]
      description: >-
        A card assignee, with their committed capacity on this task if any
        (AURA-1146 Nachtrag: capacity on the ordering-dialog card).
      properties:
        id:
          type: string
          format: uuid
        display_name:
          type: string
        capacity_percent:
          type: integer
          nullable: true
          description: The assignee's committed capacity on this task; null when unset or not a core-team role.

    TaskRankContext:
      type: object
      required: [rank_context, expected_state, viewer_can_reorder, locked, viewer_can_lock, entries]
      description: >-
        A priority-ordering context as the ordering dialog reads it
        (AURA-930 / AURA-1145 / AURA-1150).
      properties:
        rank_context:
          type: string
          description: Context key — "task:<parentTaskId>", "root:sagas" or "root:unparented".
        expected_state:
          type: string
          description: >-
            Fingerprint of the context's current ordering state. A save must
            carry this value back; a mismatch means the context moved on and the
            save is rejected.
        viewer_can_reorder:
          type: boolean
          description: >-
            Whether the caller has edit permission on the context and, if it is
            locked, is also its owner (d-019, AURA-1150).
        locked:
          type: boolean
          description: Whether the context's owner has locked it against non-owner reordering (AURA-1150).
        viewer_can_lock:
          type: boolean
          description: Whether the caller is the context's owner and may (un)lock it (AURA-1150).
        entries:
          type: array
          description: Ordered zone first (rank ascending), unordered set behind it.
          items:
            $ref: "#/components/schemas/TaskRankContextEntry"

    TaskRankContextOrder:
      type: object
      required: [ordered_task_ids, expected_state]
      properties:
        ordered_task_ids:
          type: array
          description: >-
            Task UUIDs of the ordered zone, in target order. Every other living
            task in the context becomes unordered.
          items:
            type: string
            format: uuid
        expected_state:
          type: string
          description: The `expected_state` this order was computed against.

    TaskAsapState:
      type: object
      required: [asap, asap_count]
      description: >-
        Result of setting or clearing ASAP (AURA-930 / AURA-1147, d-017).
      properties:
        asap:
          type: boolean
          description: The task's ASAP flag after the call.
        rank_reason:
          type: string
          nullable: true
          description: The task's current rationale, unchanged by this call.
        asap_count:
          type: integer
          minimum: 0
          description: Current ASAP stock across all living tasks (d-017).

    TaskRankReasonInput:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          nullable: true
          maxLength: 2000
          description: The rationale to publish; null clears it.

    TaskRankReasonState:
      type: object
      required: [rank_reason]
      properties:
        rank_reason:
          type: string
          nullable: true
          description: The task's rationale after the call.

    TaskRankReasonDraft:
      type: object
      required: [draft]
      properties:
        draft:
          type: string
          description: LLM-generated rationale draft — never persisted; the owner edits and publishes it.

    TaskBoardNode:
      type: object
      required: [id, human_key, title, status, status_type, type, owners, subtree_size, has_unread_comments, rank_context, asap]
      description: >-
        A single task card on the board. Slim by design — only the fields the
        board card renders, so a payload covering the caller's whole access
        scope stays small.
      properties:
        id:
          type: string
          format: uuid
          description: Task UUID (public identifier)
        human_key:
          type: string
          description: Human-readable, immutable task identifier (e.g. "AURA-42")
        title:
          type: string
          description: Task title
        status:
          $ref: "#/components/schemas/TaskStatus"
        status_type:
          $ref: "#/components/schemas/TaskStatusType"
        type:
          $ref: "#/components/schemas/TaskType"
        level:
          $ref: "#/components/schemas/TaskLevel"
          nullable: true
          description: Hierarchy level (null for unleveled tasks, which the board places outside the tree)
        parent_task_id:
          type: string
          format: uuid
          nullable: true
          description: >-
            UUID of the parent task, or null when the task has no parent or the
            parent lies outside the caller's access scope. In the latter case no
            hierarchy edge is emitted either — the board never draws ghost nodes.
        my_roles:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/TaskRole"
          description: Direct TaskMember roles of the caller. null = not a direct member; empty array = member without roles.
        owners:
          type: array
          items:
            $ref: "#/components/schemas/UserPickerItem"
          description: All OWNER members of this task. Empty when the task has no owner.
        looking_for_owner_at:
          type: string
          format: date-time
          nullable: true
          description: ISO 8601 timestamp when owner search was started (null when not searching).
        subtree_size:
          type: integer
          minimum: 0
          description: >-
            Total number of descendants (children, grandchildren, …) of this
            task inside the board payload. Computed once per request via a
            recursive CTE — not the same as direct child count. Leaf tasks
            have subtree_size = 0.
        has_unread_comments:
          type: boolean
          description: >
            True when at least one comment by another user is newer than the
            viewer's comment-read watermark (AURA-999 / AURA-1082). Same rule
            as TaskListItem.has_unread_comments.
        rank:
          type: integer
          nullable: true
          minimum: 1
          description: Strict position within rank_context; null = unprioritized (AURA-930 / AURA-1135).
        rank_context:
          type: string
          description: Priority-order context key (AURA-930 / AURA-1135).
        asap:
          type: boolean
          description: ASAP class flag (AURA-930).
        rank_reason:
          type: string
          nullable: true
          description: Optional ranking justification (AURA-930).

    TaskBoardHierarchyEdge:
      type: object
      required: [id, source, target]
      description: Parent→child hierarchy edge; both endpoints are always board nodes.
      properties:
        id:
          type: string
          description: "Stable edge id (\"hier:<parent-uuid>:<child-uuid>\")"
        source:
          type: string
          format: uuid
          description: Parent task UUID
        target:
          type: string
          format: uuid
          description: Child task UUID

    TaskBoardRelationEdge:
      type: object
      required: [id, source, target, type]
      description: Typed TaskRelation edge; both endpoints are always board nodes.
      properties:
        id:
          type: string
          description: "Stable edge id (\"rel:<relation-uuid>\")"
        source:
          type: string
          format: uuid
          description: Source task UUID (TaskRelation.fromTask)
        target:
          type: string
          format: uuid
          description: Target task UUID (TaskRelation.toTask)
        type:
          $ref: "#/components/schemas/TaskRelationType"

    TaskBoardPosition:
      type: object
      required: [task_id, x, y]
      description: Stored canvas position of one card, for the calling user only.
      properties:
        task_id:
          type: string
          format: uuid
          description: Task UUID the position belongs to
        x:
          type: number
          format: double
          description: Canvas x coordinate of the card's top-left corner
        y:
          type: number
          format: double
          description: Canvas y coordinate of the card's top-left corner

    TaskBoardViewport:
      type: object
      required: [x, y, zoom]
      description: Stored pan/zoom of the board canvas, for the calling user only.
      properties:
        x:
          type: number
          format: double
        y:
          type: number
          format: double
        zoom:
          type: number
          format: double

    TaskBoard:
      type: object
      required: [nodes, hierarchy_edges, relation_edges, positions]
      description: >-
        Unpaginated board payload — nodes, both edge kinds and the caller's
        stored layout in one response.
      properties:
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/TaskBoardNode"
        hierarchy_edges:
          type: array
          items:
            $ref: "#/components/schemas/TaskBoardHierarchyEdge"
        relation_edges:
          type: array
          items:
            $ref: "#/components/schemas/TaskBoardRelationEdge"
        positions:
          type: array
          description: >-
            The caller's stored card positions, restricted to tasks present in
            `nodes`. Stored positions of tasks that left the board are ignored
            here and kept in the database. Empty when nothing is stored yet.
          items:
            $ref: "#/components/schemas/TaskBoardPosition"
        viewport:
          $ref: "#/components/schemas/TaskBoardViewport"
          description: Stored viewport; absent when the caller has none yet.
        collapsed:
          $ref: "#/components/schemas/TaskBoardCollapsedState"
          description: >-
            The caller's stored expand/collapse state. Absent when the caller
            has none yet — the frontend treats absence as "everything collapsed"
            (the default start).

    TaskBoardCollapsedState:
      type: object
      description: >-
        Per-user expand/collapse state for the board diagram. Stored as JSONB
        in UserTaskBoardState.collapsed. The default (absent / empty) means
        everything is collapsed — only top-level objects and aggregate boxes
        are visible.
      properties:
        expanded_task_ids:
          type: array
          items:
            type: string
            format: uuid
          description: Task UUIDs whose direct children are currently visible.
        expanded_boxes:
          type: array
          items:
            type: string
            enum: [orphan_epics, orphan_stories, unleveled]
          description: Which aggregate boxes are currently expanded.

    TaskBoardLayoutWriteMode:
      type: string
      enum: [upsert, create_only, clear]
      description: >-
        upsert = overwrite existing positions (single move, Reset);
        create_only = only create missing ones (first snapshot, race-safe).

    TaskBoardLayoutWrite:
      type: object
      required: [positions]
      description: Bulk layout write for the calling user.
      properties:
        positions:
          type: array
          maxItems: 5000
          description: Positions to store. May be empty when only the viewport changes.
          items:
            $ref: "#/components/schemas/TaskBoardPosition"
        viewport:
          $ref: "#/components/schemas/TaskBoardViewport"
          description: Viewport to store; omit to leave the stored viewport untouched.
        collapsed:
          $ref: "#/components/schemas/TaskBoardCollapsedState"
          description: >-
            Expand/collapse state to store. Omit to leave the stored state
            untouched. In create_only mode, an existing state is never overwritten.
        mode:
          $ref: "#/components/schemas/TaskBoardLayoutWriteMode"
          description: Defaults to `upsert` when omitted.

    TaskBoardLayoutWriteResult:
      type: object
      required: [created, updated, skipped]
      description: >-
        What the write actually did. `skipped` counts positions left untouched —
        because they already existed and the mode was create_only, or because
        the task is not on the caller's board.
      properties:
        created:
          type: integer
        updated:
          type: integer
        skipped:
          type: integer

    MemoryGraphOrigin:
      type: object
      required: [stable_id, name, type]
      description: Anchor entity for a memory graph expansion
      properties:
        stable_id:
          type: string
        name:
          type: string
        type:
          $ref: "#/components/schemas/MemoryGraphNodeType"

    MemoryGraphNodeType:
      type: string
      enum:
        - product
        - service
        - frontend
        - backend
        - datastore
        - external
        - entity
        - capability
        - company
        - api
        - person
        - task
        - jira
        - question
        - signal
      description: Wiki-graph node type used for colouring

    MemoryGraphNode:
      type: object
      required: [id, label, type]
      description: A node in the memory explorer graph
      properties:
        id:
          type: string
          description: Entity stable ID
        label:
          type: string
        type:
          $ref: "#/components/schemas/MemoryGraphNodeType"
        entity_type:
          type: string
          description: Canonical ontology entity type (Product, Service, …) used for node colouring
        sublabel:
          type: string
          nullable: true

    MemoryGraphEdgeLineStyle:
      type: string
      enum: [solid, dashed]
      description: Visual provenance hint — solid for structural/confirmed source edges, dashed for inferred/candidate

    MemoryGraphEdge:
      type: object
      required: [source, target, label, line_style, status, fact_layer]
      description: A directed relationship in the memory explorer graph
      properties:
        source:
          type: string
        target:
          type: string
        label:
          type: string
          description: Predicate name
        edge_properties:
          type: object
          nullable: true
          additionalProperties: true
          description: Structured qualifiers on the relationship (e.g. duration_years, since)
        confidence:
          type: string
        fact_layer:
          type: string
        status:
          type: string
          enum: [CONFIRMED, CANDIDATE, SUPERSEDED, CONTESTED]
        line_style:
          $ref: "#/components/schemas/MemoryGraphEdgeLineStyle"
        provenance:
          type: array
          items:
            $ref: "#/components/schemas/MemoryGraphEdgeProvenance"

    MemoryGraphEdgeProvenance:
      type: object
      required: [source_type, source_id, lineage_root]
      properties:
        source_type:
          type: string
        source_id:
          type: string
        lineage_root:
          type: string
        excerpt:
          type: string
          nullable: true

    MemoryEntitySourceKind:
      type: string
      enum: [task, jira, question, repository, document, signal]
      description: Kind of navigable source resolved from a memory entity

    MemoryEntitySource:
      type: object
      required: [kind, url, external]
      description: Navigable source for a memory-graph node
      properties:
        kind:
          $ref: "#/components/schemas/MemoryEntitySourceKind"
        url:
          type: string
          description: Internal app path or external HTTPS URL
        external:
          type: boolean
          description: When true, open url in a new browser tab

    MemoryReportedQuestionLink:
      type: object
      required: [target_type, role]
      properties:
        target_type:
          type: string
          enum: [TASK, CHAT, REPO_AURA_DOCUMENT, MEMORY_ENTITY]
        target_id:
          type: string
          format: uuid
          nullable: true
        target_title:
          type: string
          nullable: true
        target_human_key:
          type: string
          nullable: true
          description: Human-readable task key for TASK targets, used for browser links; null for every other target type (ANW-7848).
        role:
          type: string
          enum: [ORIGIN, AFFECTS, RELATED]

    MemoryReportedQuestion:
      type: object
      required: [id, text, status, links]
      description: Open question created or reused when reporting a memory entity
      properties:
        id:
          type: string
          format: uuid
        text:
          type: string
        status:
          type: string
          enum: [OPEN, ANSWERED, CLOSED]
        links:
          type: array
          items:
            $ref: "#/components/schemas/MemoryReportedQuestionLink"

    MemoryMapLevel:
      type: string
      enum: [overview, drill]
      default: overview
      description: Map detail level — overview shows clusters; drill shows hub nodes within a cluster

    MemoryMapCluster:
      type: object
      required: [id, label, dominant_type, entity_count, hidden_count, representative_stable_id]
      description: Aggregated connected component for the memory map overview
      properties:
        id:
          type: string
          description: Stable cluster identifier (e.g. "cc:7")
        label:
          type: string
          description: Human-readable cluster label derived from dominant entity type
        dominant_type:
          $ref: "#/components/schemas/MemoryGraphNodeType"
        entity_count:
          type: integer
          minimum: 0
          description: Number of entities in this cluster
        hidden_count:
          type: integer
          minimum: 0
          description: Entities omitted within this cluster due to caps or sub-splitting
        representative_stable_id:
          type: string
          description: Stable ID of a representative entity (highest degree in cluster)

    MemoryMapMetaEdge:
      type: object
      required: [source_cluster_id, target_cluster_id, edge_count, label]
      description: Aggregated cross-cluster confirmed edge count
      properties:
        source_cluster_id:
          type: string
        target_cluster_id:
          type: string
        edge_count:
          type: integer
          minimum: 1
        label:
          type: string
          description: Display label for the meta edge (e.g. "12 links")

    MemoryMapNode:
      type: object
      required: [id, label, type]
      description: Hub node within a drill-level cluster view
      properties:
        id:
          type: string
          description: Entity stable ID
        label:
          type: string
        type:
          $ref: "#/components/schemas/MemoryGraphNodeType"
        entity_type:
          type: string
          description: Canonical ontology entity type used for node colouring

    MemoryMap:
      type: object
      required: [clusters, meta_edges, nodes, hidden_count]
      description: Aggregated cluster map for the Memory Explorer global map mode
      properties:
        clusters:
          type: array
          items:
            $ref: "#/components/schemas/MemoryMapCluster"
        meta_edges:
          type: array
          items:
            $ref: "#/components/schemas/MemoryMapMetaEdge"
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/MemoryMapNode"
          description: Hub nodes for drill level; empty at overview level
        hidden_count:
          type: integer
          minimum: 0
          description: Entities in clusters omitted due to the overview cap

    MemoryGraph:
      type: object
      required: [origin, nodes, edges, hidden_count]
      description: Access- and trust-filtered memory graph payload for the explorer canvas
      properties:
        origin:
          oneOf:
            - $ref: "#/components/schemas/MemoryGraphOrigin"
            - type: "null"
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/MemoryGraphNode"
        edges:
          type: array
          items:
            $ref: "#/components/schemas/MemoryGraphEdge"
        hidden_count:
          type: integer
          minimum: 0
          description: Count of nodes or edges omitted due to access restrictions

    MemoryEdgeOrigin:
      type: string
      enum: [knowledge, task, jira, question]
      description: Edge provenance bucket for explorer filters

    MemoryFactLayerFilter:
      type: string
      enum: [source, public, inferred, external, aura_native, open_question]

    MemoryConfidenceMin:
      type: string
      enum: [low, medium, high]

    MemoryEdgeStatusFilter:
      type: string
      enum: [CONFIRMED, CANDIDATE, SUPERSEDED, CONTESTED]

    MemorySensitivityFilter:
      type: string
      enum: [PUBLIC, RESTRICTED, CONFIDENTIAL]

    MemoryEntitySortField:
      type: string
      enum: [name, stable_id, updated_at]

    MemoryEntity:
      type: object
      required: [stable_id, name, entity_type, wiki_graph_type, updated_at]
      properties:
        stable_id:
          type: string
        name:
          type: string
        entity_type:
          type: string
          description: Internal knowledge entity type label
        wiki_graph_type:
          $ref: "#/components/schemas/MemoryGraphNodeType"
        updated_at:
          type: string
          format: date-time

    MemoryEntityFacetBucket:
      type: object
      required: [value, count]
      properties:
        value:
          type: string
        count:
          type: integer
          minimum: 0

    MemoryEntityFacets:
      type: object
      required: [entity_types]
      properties:
        entity_types:
          type: array
          items:
            $ref: "#/components/schemas/MemoryEntityFacetBucket"

    MemoryEntityList:
      type: object
      required: [items, pagination, facets, hidden_count]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/MemoryEntity"
        pagination:
          $ref: "#/components/schemas/Pagination"
        facets:
          $ref: "#/components/schemas/MemoryEntityFacets"
        hidden_count:
          type: integer
          minimum: 0
          description: Entities present in the graph but not visible to the current user

    TagKind:
      type: string
      enum: [AREA, PRODUCT, CONTEXT, TOPIC]
      description: "Semantic category of a tag"

    TaskTagRef:
      type: object
      required: [slug, name, kind]
      description: Slim tag reference embedded in task detail
      properties:
        slug:
          type: string
          description: Unique URL-safe identifier (github-slugger normalised)
        name:
          type: string
          description: Human-readable display name
        kind:
          $ref: "#/components/schemas/TagKind"

    ArtifactReviewStartRequest:
      type: object
      required: [version, roles, userIds]
      properties:
        version:
          type: integer
          minimum: 1
          description: Artifact version to put into review
        roles:
          type: array
          items:
            $ref: "#/components/schemas/TaskRole"
          description: Task roles whose members should be included as reviewers
        userIds:
          type: array
          items:
            type: string
            format: uuid
          description: Additional user UUIDs to include as reviewers
        deadline:
          type: string
          format: date
          nullable: true
          description: >
            Optional soft deadline (calendar date, no time) by which the review should be done.
            Persisted as the end of that day. Purely informational — never enforced or blocking.

    ArtifactReviewVersionRequest:
      type: object
      required: [version]
      properties:
        version:
          type: integer
          minimum: 1
          description: Artifact version the action applies to

    ArtifactReviewAddReviewerRequest:
      type: object
      required: [version, userId]
      properties:
        version:
          type: integer
          minimum: 1
          description: Version the reviewer is being added to
        userId:
          type: string
          format: uuid
          description: UUID of the user to add as reviewer

    ArtifactGrantRequest:
      type: object
      required: [principalType, level]
      description: >
        Body for POST /artifacts/{id}/grants (S3, AURA-923) — upserts an entry in
        the artifact's own access list. GROUP is rejected (not yet supported,
        ANW-7611); COMPANY requires no principalId, USER requires one.
      properties:
        principalType:
          type: string
          enum: [USER, GROUP, COMPANY]
          description: Kind of principal to grant access to. GROUP is rejected with a validation error.
        principalId:
          type: string
          format: uuid
          nullable: true
          description: >
            User UUID of the USER principal (same id as UserPickerItem.id /
            ArtifactGrantEntry.user.id). Must be omitted/null for COMPANY.
            Resolved server-side to the numeric User.id stored on ArtifactAccessGrant.
        level:
          type: string
          enum: [READ, EDIT]
          description: Level to grant. MANAGE is not assignable via this endpoint and is rejected.

    ArtifactGrantRevokeRequest:
      type: object
      required: [principalType]
      description: Body for DELETE /artifacts/{id}/grants (S3, AURA-923) — removes the matching entry, if any.
      properties:
        principalType:
          type: string
          enum: [USER, GROUP, COMPANY]
          description: Kind of principal to revoke access from. GROUP is rejected with a validation error.
        principalId:
          type: string
          format: uuid
          nullable: true
          description: >
            User UUID of the USER principal (same id as UserPickerItem.id /
            ArtifactGrantEntry.user.id). Must be omitted/null for COMPANY.
            Resolved server-side to the numeric User.id stored on ArtifactAccessGrant.

    ArtifactReviewPersonStatus:
      type: object
      required: [user_id, user_name, status, has_review_artifact]
      properties:
        user_id:
          type: string
          format: uuid
          description: UUID of the reviewer
        user_name:
          type: string
        status:
          type: string
          enum: [ASSIGNED, APPROVED, REJECTED]
          description: Per-person review vote (the vote is the status; a review note is tracked separately)
        has_review_artifact:
          type: boolean
          description: True when this reviewer has authored a review artifact for the run (independent of their vote)
        review_artifact_id:
          type: string
          format: uuid
          nullable: true
          description: UUID of this reviewer's review artifact, or null if none
        review_artifact_title:
          type: string
          nullable: true
          description: Title of this reviewer's review artifact, or null if none
        addressed_comment:
          type: string
          nullable: true
          description: >-
            The ReviseBot's feedback to this reviewer from the previously reviewed
            round (what was done with their review). Sourced from the review
            assignment of the most recent prior round; null when no ReviseBot run
            has addressed this reviewer yet.
        addressed_comment_at:
          type: string
          format: date-time
          nullable: true
          description: When the addressed feedback was recorded, or null when none exists.

    ArtifactReviewArtifactRef:
      type: object
      required: [id, title]
      properties:
        id:
          type: string
          format: uuid
          description: UUID of the review artifact
        title:
          type: string
        author_id:
          type: string
          format: uuid
          nullable: true
          description: UUID of the author (reviewOfAuthorId)
        author_name:
          type: string
          nullable: true
          description: Display name of the review author (resolved from reviewOfAuthorId); null when it cannot be resolved
        created_at:
          type: string
          format: date-time
          description: ISO 8601 creation timestamp of the review artifact

    ArtifactReviewInitiator:
      type: object
      required: [user_id, user_name]
      description: The user who started the current review run
      properties:
        user_id:
          type: string
          format: uuid
          description: UUID of the initiator
        user_name:
          type: string

    ArtifactReviewOverview:
      type: object
      required: [version, review_state, reviewers, review_artifacts, initiator, review_started_at, review_deadline_at, is_initiator]
      properties:
        version:
          type: integer
          description: The version currently under review (or latest version)
        review_state:
          type: string
          enum: [UNCHECKED, IN_REVIEW, APPROVED, NEEDS_REVISION, SUPERSEDED]
        reviewers:
          type: array
          items:
            $ref: "#/components/schemas/ArtifactReviewPersonStatus"
        review_artifacts:
          type: array
          items:
            $ref: "#/components/schemas/ArtifactReviewArtifactRef"
        initiator:
          description: Who started the current review run, or null for legacy reviews without a persisted initiator
          anyOf:
            - $ref: "#/components/schemas/ArtifactReviewInitiator"
            - type: "null"
        review_started_at:
          type: string
          format: date-time
          nullable: true
          description: When the current review run was started, or null for legacy reviews
        review_deadline_at:
          type: string
          format: date-time
          nullable: true
          description: >
            Optional soft deadline for the current review run (end of the chosen day), or null
            when none was set. Purely informational — never enforced or blocking.
        is_initiator:
          type: boolean
          description: True when the current user started the review run

    ArtifactReviseContext:
      type: object
      required: [version, review_artifacts]
      properties:
        version:
          type: integer
          nullable: true
          description: The IN_REVIEW version, or null if no active review
        review_artifacts:
          type: array
          items:
            $ref: "#/components/schemas/ArtifactReviewArtifactRef"

    ArtifactReviewPreview:
      type: object
      required: [reviewers, tasks]
      description: Preview of who would be notified and which tasks are affected when setting a triggersReview status
      properties:
        reviewers:
          type: array
          description: Deduplicated list of users who would receive review notifications (actor excluded)
          items:
            type: object
            required: [user_id, user_name, role_names]
            properties:
              user_id:
                type: string
                format: uuid
              user_name:
                type: string
              role_names:
                type: array
                items:
                  type: string
                description: Names of the roles this user holds that require review
        tasks:
          type: array
          description: Tasks linked to this artifact that are affected
          items:
            type: object
            required: [id, title]
            properties:
              id:
                type: string
                format: uuid
              title:
                type: string

    ArtifactKind:
      type: string
      enum: [PLAN, REVIEW, GENERIC]
      description: >-
        Fixed artifact kind. PLAN is the primary plan artifact for a task,
        REVIEW is a review artifact produced by the ReviewBot, GENERIC is the
        default for everything else.

    ArtifactDecisionRequest:
      type: object
      required: [version, decision]
      description: Request body for submitting an approval or rejection decision
      properties:
        version:
          type: integer
          minimum: 1
          description: Artifact version this decision applies to
        decision:
          type: string
          enum: [APPROVED, REJECTED]
          description: The reviewer's decision

    ArtifactOpenReview:
      type: object
      required: [role_id, role_name, decided]
      description: A single open review obligation entry
      properties:
        role_id:
          type: string
          format: uuid
        role_name:
          type: string
        user_id:
          type: string
          format: uuid
          nullable: true
        user_name:
          type: string
          nullable: true
        decided:
          type: boolean

    ArtifactDecisionRecord:
      type: object
      required: [id, user_id, user_name, decision, version, created_at]
      description: A single recorded approval/rejection decision
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        user_name:
          type: string
        decision:
          type: string
          enum: [APPROVED, REJECTED]
        version:
          type: integer
        created_at:
          type: string
          format: date-time

    ArtifactApprovalsResponse:
      type: object
      required: [version, latest_version, decided_count, total_required, open_reviews, decisions]
      description: Approval/review status for an artifact version
      properties:
        version:
          type: integer
        latest_version:
          type: integer
        decided_count:
          type: integer
          description: Number of reviewers who have submitted a decision
        total_required:
          type: integer
          description: Total number of reviewers required (role-based union across all linked tasks)
        open_reviews:
          type: array
          items:
            $ref: "#/components/schemas/ArtifactOpenReview"
        decisions:
          type: array
          items:
            $ref: "#/components/schemas/ArtifactDecisionRecord"

    TaskRole:
      type: string
      enum: [OWNER, CONTRIBUTOR, STAKEHOLDER]
      description: Fixed role a task member can hold (ANW-7230). A member may hold multiple roles.

    TaskCapability:
      type: string
      enum: [TASK_COMMENT, TASK_CREATE_REVIEW, TASK_VIEW_ANCESTOR_TITLE, TASK_EDIT_CONTENT, TASK_MANAGE_LINKS, TASK_MANAGE_MEMBERS, TASK_MANAGE_LIFECYCLE]
      description: Task-internal capability (T18 · S04, ANW-7608), mirrored 1:1 from the server-side matrix in src/server/lib/access/taskCapabilities.ts.

    ViewerAccess:
      type: object
      required: [permission, capabilities, via_system_override, is_owner]
      description: >
        The current viewer's effective access on this task (ANW-7750). Powers UI
        gating (members/lifecycle/content edit) without deriving rights from the
        members list alone — Admin/Leadership override elevates capabilities
        without inventing a synthetic OWNER membership.
      properties:
        permission:
          type: string
          enum: [NONE, READ, EDIT, MANAGE]
          description: Effective permission lattice level from resolveTaskAccess.
        capabilities:
          type: array
          items:
            $ref: "#/components/schemas/TaskCapability"
          description: Effective task capabilities after applying the system-role override (if any).
        via_system_override:
          type: boolean
          description: True when ADMIN/LEADERSHIP granted MANAGE via the systemRole source.
        is_owner:
          type: boolean
          description: True only when the viewer holds TaskRole.OWNER on a member row — never set by the system override alone.

    AccessOverviewEntry:
      type: object
      required: [principal_type, roles, level, capabilities, origin]
      description: >
        One access holder on a task — a direct member, a TaskAccessGrant, or a
        member inherited from an ancestor task (T18 · S07, ANW-7613) — with the
        resulting effective access level and the concrete capabilities it grants.
      properties:
        principal_type:
          type: string
          enum: [USER, GROUP, COMPANY]
          description: Kind of principal this entry represents. COMPANY has no individual user (whole-company grant); GROUP is a seam, not yet populated.
        principal:
          type: object
          nullable: true
          required: [id]
          description: The user this entry represents; null for COMPANY (and for GROUP, not yet implemented).
          properties:
            id:
              type: string
              format: uuid
              description: User UUID
            display_name:
              type: string
              nullable: true
            email:
              type: string
              nullable: true
        roles:
          type: array
          items:
            $ref: "#/components/schemas/TaskRole"
          description: TaskRole(s) held by this principal — on this task, or on the source ancestor task for inherited entries.
        level:
          type: string
          enum: [READ, EDIT, MANAGE]
          description: >
            Resulting effective access level on this task, mirroring resolveTaskAccess.
            Inherited membership derives its level from the roles held on the source
            ancestor task (N1, ANW-7886). Inherited grant origin entries (S5, ANW-7888)
            are always READ, mirroring the grant cascade's fixed cap — independent of
            the roles on the ancestor's TaskAccessGrant.
        capabilities:
          type: array
          items:
            $ref: "#/components/schemas/TaskCapability"
          description: Concrete capabilities this level grants, mirroring hasTaskCapability's matrix.
        origin:
          type: string
          enum: [member, grant]
          description: >
            Whether this entry derives from a TaskMember row or from a TaskAccessGrant.
            Orthogonal to the group it sits in: the `inherited` array holds both kinds.
        source_task:
          type: object
          required: [id, title]
          description: The ancestor task this entry's membership is inherited from; present only for inherited entries.
          properties:
            id:
              type: string
              format: uuid
              description: Source task UUID
            title:
              type: string
              description: Source task title

    AccessOverview:
      type: object
      required: [direct, grants, inherited]
      description: >
        Read-only aggregation of everyone with access to a task — direct members,
        TaskAccessGrants (COMPANY today; GROUP is a seam), and members inherited
        from ancestor tasks — powering the access-overview modal (T18 · S07,
        ANW-7613). Purely informational; contains no mutation affordances.
      properties:
        direct:
          type: array
          items:
            $ref: "#/components/schemas/AccessOverviewEntry"
          description: Direct TaskMembers.
        grants:
          type: array
          items:
            $ref: "#/components/schemas/AccessOverviewEntry"
          description: TaskAccessGrant rows (COMPANY today; GROUP is a seam, not yet populated).
        inherited:
          type: array
          items:
            $ref: "#/components/schemas/AccessOverviewEntry"
          description: Members inherited from ancestor tasks (S5, ANW-7610); each entry always carries source_task.

    BroadAccessEntry:
      type: object
      required: [kind, inherited, level, principal_name, source_task]
      description: >
        One source of broad (non-individual) access to a task or artifact —
        a whole-company or group grant (direct or inherited), or an open
        owner-/crew-search that currently lets any user read (ANW-7907, S1).
        Powers the warning box in ShareModal, computed by a dedicated server
        helper so the UI never re-derives access policy. USER-type grants are
        intentionally excluded — individual access belongs in the person
        list, not here.
      properties:
        kind:
          type: string
          enum: [COMPANY_GRANT, GROUP_GRANT, OWNER_SEARCH, CREW_SEARCH]
          description: Source of the broad access.
        inherited:
          type: boolean
          description: True when this entry comes from an ancestor task's grant rather than the object's own.
        level:
          type: string
          enum: [READ, EDIT, MANAGE]
          description: >
            Resulting effective access level, generated via permissionLabel.
            Direct grants derive it from the grant's roles; inherited grants
            and open searches are always READ (the fixed cascade cap).
        principal_name:
          type: string
          nullable: true
          description: Group display name for GROUP_GRANT once group resolution exists (ANW-7611 seam); null for every other kind today.
        source_task:
          type: object
          nullable: true
          required: [id, title]
          description: The ancestor task this entry's grant is inherited from; null for direct grants and for search-flag entries.
          properties:
            id:
              type: string
              format: uuid
              description: Source task UUID
            title:
              type: string
              description: Source task title

    ParticipationStatus:
      type: string
      enum: [ACTIVE, WAITING, OBSERVING]
      description: >
        Participation status of a task member (T18 · S33, ANW-7583). ACTIVE = currently
        driving the task forward; WAITING = involved but temporarily blocked; OBSERVING
        = only watching, no action expected. Derived from the role by default (STAKEHOLDER
        → OBSERVING, otherwise ACTIVE), and settable self-declared or via an owner directive.

    TaskMemberWithRoles:
      type: object
      required: [user, roles, participation_status]
      description: A task member together with their assigned roles and participation
      properties:
        user:
          $ref: "#/components/schemas/UserPickerItem"
        roles:
          type: array
          items:
            $ref: "#/components/schemas/TaskRole"
          description: Roles assigned to this member on the task
        participation_note:
          type: string
          nullable: true
          description: Free-text sentence describing this member's concrete contribution on this task; not mandatory.
        participation_status:
          $ref: "#/components/schemas/ParticipationStatus"
        capacity_percent:
          type: integer
          nullable: true
          description: "T18 · S27 (ANW-7772): the member's committed capacity on this task as a percentage of a full position (10% steps, 0..100). Null = no commitment set. Only core-team members (OWNER/CONTRIBUTOR) set it."

    TaskMemberCapacityUpdate:
      type: object
      required: [capacity_percent]
      description: "T18 · S27 (ANW-7772): set/change/remove a core-team member's capacity commitment on a task. Null clears the commitment."
      properties:
        capacity_percent:
          type: integer
          nullable: true
          minimum: 0
          maximum: 100
          description: Commitment as a percentage of a full position, in 10% steps (0..100). Null removes the commitment.

    CapacitySortField:
      type: string
      enum: [name, utilization]
      description: "Sort field for the leadership capacity overview."

    CapacityTaskCommitment:
      type: object
      required: [task_id, human_key, task_title, task_status, roles, capacity_percent, task_level, hierarchy_path]
      description: "One active task a person is a direct member of, with their roles and (for core-team roles) their committed capacity."
      properties:
        task_id:
          type: string
          format: uuid
        human_key:
          type: string
          description: Human-readable, immutable task identifier (e.g. "AURA-42") — used for browser links; task_id stays the API identifier (ANW-7848).
        task_title:
          type: string
        task_status:
          $ref: "#/components/schemas/TaskStatus"
        roles:
          type: array
          items:
            $ref: "#/components/schemas/TaskRole"
        capacity_percent:
          type: integer
          nullable: true
          description: The person's committed capacity on this task (null when unset or not a core-team role).
        task_level:
          allOf:
            - $ref: "#/components/schemas/TaskLevel"
          nullable: true
          description: Hierarchy level of the task (null when unleveled).
        hierarchy_path:
          type: array
          description: Ancestors from root to direct parent (empty when the task is a root). Used by the leadership matrix to build the hierarchy tree.
          items:
            $ref: "#/components/schemas/TaskHierarchyRef"
        governing_deadline:
          type: string
          format: date
          nullable: true
          description: "The governing deadline of this task, or null when none applies. AURA-1722 / S7: comes straight from `governingDeadline` (no second selection logic), so the payload value and the board display agree. Carries NO ampel and NO overdue flag — the verdict lives in the consuming skill."

    CapacityLeadershipRow:
      type: object
      required: [user, base_percent, committed_percent, free_percent, utilization_percent, over, tasks]
      description: "T18 · S27 (ANW-7772): one person's company-wide capacity summary plus their active-task participation (direct roles only). AURA-1722 / S5: an optional `group` assignment is carried only by `scope: group` rows; null for the other scopes. AURA-1722 / S6: `capacity_updated_at` is the most recent time the person themselves touched their capacity on any of their memberships (unfiltered aggregation, D9); null means \"never recorded\", not \"stale\" (D16)."
      properties:
        user:
          $ref: "#/components/schemas/UserPickerItem"
        base_percent:
          type: integer
          description: The person's base capacity (percentage of a full position).
        committed_percent:
          type: integer
          description: Sum of the person's capacity commitments across active tasks.
        free_percent:
          type: integer
          description: base_percent minus committed_percent (may be negative when over-committed).
        utilization_percent:
          type: integer
          description: committed_percent / base_percent as a percentage (0 when base is 0).
        over:
          type: boolean
          description: True when committed_percent exceeds base_percent (soft-limit warning).
        tasks:
          type: array
          items:
            $ref: "#/components/schemas/CapacityTaskCommitment"
        group:
          type: object
          nullable: true
          description: "Group assignment carried only by `scope: group` rows (AURA-1722 / S5); null for me/person/company. A person in two of the caller's groups produces two rows, each with its own group."
          properties:
            uuid:
              type: string
              format: uuid
            name:
              type: string
        capacity_updated_at:
          type: string
          format: date-time
          nullable: true
          description: "When the person themselves last touched their capacity on any of their memberships (AURA-1722 / S6 / D9). Comes from an UNFILTERED aggregation over TaskMember (max per user), so a capacity set today on a task completed the same day still counts. Moves only on a self-attributable change (D17); a foreign-set or system-cleared capacity leaves it untouched. null means \"never recorded\" (legacy row, or no self-set yet), NOT \"stale\" (D16 — no backfill). Delivered as null, never mapped away."

    CapacityLeadershipList:
      type: object
      required: [items, pagination]
      description: "Paginated, person-centric leadership capacity/participation overview."
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CapacityLeadershipRow"
        pagination:
          $ref: "#/components/schemas/Pagination"

    CapacityReadRow:
      type: object
      required: [user, base_percent, committed_percent, free_percent, utilization_percent, over]
      description: "AURA-1722: one row of a scoped capacity read. Same fields as CapacityLeadershipRow, except that `tasks` is optional: scope=me/person carry the person's active-task list, scope=group/company carry the aggregates only — a measured scope=company answer with every task in every row reached ~122k tokens and left no room for a reply. When absent the field is omitted, never sent as an empty array: for a group row an empty list means \"this member holds no active task\" (D11), so an empty array would turn a missing field into a false fact. Ask again with scope=person to get one member's tasks."
      properties:
        user:
          $ref: "#/components/schemas/UserPickerItem"
        base_percent:
          type: integer
          description: The person's base capacity (percentage of a full position).
        committed_percent:
          type: integer
          description: Sum of the person's capacity commitments across active tasks. Exact for every scope — summed from the full commitments before the task list is dropped.
        free_percent:
          type: integer
          description: base_percent minus committed_percent (may be negative when over-committed).
        utilization_percent:
          type: integer
          description: committed_percent / base_percent as a percentage (0 when base is 0).
        over:
          type: boolean
          description: True when committed_percent exceeds base_percent (soft-limit warning).
        tasks:
          type: array
          description: The person's active tasks and commitments. Present for scope=me/person, omitted for scope=group/company.
          items:
            $ref: "#/components/schemas/CapacityTaskCommitment"
        group:
          type: object
          nullable: true
          description: "Group assignment carried only by `scope: group` rows (AURA-1722 / S5); null for me/person/company. A person in two of the caller's groups produces two rows, each with its own group."
          properties:
            uuid:
              type: string
              format: uuid
            name:
              type: string
        capacity_updated_at:
          type: string
          format: date-time
          nullable: true
          description: "When the person themselves last touched their capacity on any of their memberships (AURA-1722 / S6 / D9). Unfiltered aggregation over TaskMember (max per user). Moves only on a self-attributable change (D17). null means \"never recorded\" (D16 — no backfill), NOT \"stale\". Delivered as null, never mapped away."

    CapacityReadResponse:
      type: object
      required: [items, total, pagination]
      description: "AURA-1722: scoped capacity read. One unified list shape for all scopes — scope=me/person is a one-row list, scope=group is the roster (each row carries its group), scope=company is the paginated firm-wide overview. The row shape is CapacityReadRow, whose `tasks` is optional per scope; CapacityLeadershipRow keeps `tasks` required for the leadership board, which needs it."
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CapacityReadRow"
        total:
          type: integer
          description: Total number of rows across all pages (1 for scope=me).
        pagination:
          $ref: "#/components/schemas/Pagination"

    CapacityPersonal:
      type: object
      required: [base_percent, committed_percent, free_percent, utilization_percent, over, tasks]
      description: "T18 · S27 (ANW-7772): the logged-in user's own capacity — KPI values plus their active tasks and commitments. AURA-1722 / S6: `capacity_updated_at` is the most recent time the person themselves touched their capacity on any of their memberships (unfiltered aggregation, D9); null means \"never recorded\", not \"stale\" (D16)."
      properties:
        base_percent:
          type: integer
        base_capacity_note:
          type: string
          nullable: true
          description: "Optional company override for the base-capacity explanation shown to employees; null → localized default."
        committed_percent:
          type: integer
        free_percent:
          type: integer
        utilization_percent:
          type: integer
        over:
          type: boolean
        tasks:
          type: array
          items:
            $ref: "#/components/schemas/CapacityTaskCommitment"
        capacity_updated_at:
          type: string
          format: date-time
          nullable: true
          description: "When the person themselves last touched their capacity on any of their memberships (AURA-1722 / S6 / D9). Unfiltered aggregation over TaskMember (max per user). Moves only on a self-attributable change (D17). null means \"never recorded\" (D16 — no backfill), NOT \"stale\". Delivered as null, never mapped away."

    CapacitySettings:
      type: object
      required: [base_capacity_percent, base_capacity_note, updated_at, updated_by]
      description: "T18 · S27 (ANW-7772): company-wide base capacity setting (singleton)."
      properties:
