        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: assignTaskToProject
      summary: "Projects: Assign task"
      description: >
        Assigns a task to the project. Requires EDIT on the task (TASK_MANAGE_LINKS tier).
        Idempotent. Rejects if the task already inherits the project from an ancestor.
        When assigning an ancestor, absorbs redundant descendant assignments in the same transaction.
        Rejects assigning to an archived project.
      tags:
        - Projects
      x-mcp: false
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
