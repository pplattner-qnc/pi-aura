        user:
          $ref: "#/components/schemas/RouterMissUser"
        chat_id:
          type: string
          format: uuid
          nullable: true
          description: UUID of the chat where this intent was captured (null if not linked)
        created_at:
          type: string
          format: date-time
          description: ISO 8601 timestamp when the intent was captured

    RouterMissList:
      type: object
      required: [items, pagination]
      description: Paginated list of router misses
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/RouterMissItem"
          description: Router miss items for the current page
        pagination:
          $ref: "#/components/schemas/Pagination"

    LlmTurnSortField:
      type: string
      enum: [created_at, model, run_name, duration_ms]
      description: Sortable fields for LLM turn list

    LlmTurn:
      type: object
      required: [id, uuid, run_name, model, iteration_index, has_payload, success, created_at]
      description: A single LLM provider call (one iteration of the agentic loop)
      properties:
        id:
          type: integer
          description: Internal DB ID
        uuid:
          type: string
          format: uuid
          description: Public UUID
        run_name:
          type: string
          description: Logical run name (e.g. aura-chat-stream)
        model:
          type: string
          description: Model identifier
        iteration_index:
          type: integer
          description: Iteration index within the agentic loop (0-based)
        has_payload:
          type: boolean
          description: Whether the full payload (system prompt, messages, raw response) is available via GET /llm-turns/{uuid}/payload. False for turns predating payload-to-S3 storage, or if the S3 write failed.
        input_tokens:
          type: integer
          nullable: true
        output_tokens:
          type: integer
          nullable: true
        cached_input_tokens:
          type: integer
          nullable: true
        reasoning_tokens:
          type: integer
          nullable: true
        cost_usd:
          type: number
          nullable: true
          description: Estimated cost in USD
        duration_ms:
          type: integer
          nullable: true
          description: Wall-clock duration of the model call in milliseconds
        success:
          type: boolean
        error_message:
          type: string
          nullable: true
        chat_message_id:
          type: string
          format: uuid
          nullable: true
          description: UUID of the associated ChatMessage
        chat_id:
          type: string
          format: uuid
          nullable: true
          description: UUID of the associated Chat
        created_at:
          type: string
          format: date-time
        stop_reason:
          type: string
          nullable: true
          description: Raw provider stop reason (e.g. tool_use, end_turn). Null on turns predating this field.
        tools:
          type: array
          nullable: true
          description: Tools requested in this turn. Null when unknown (old turns); empty when the turn requested none.
          items:
            $ref: "#/components/schemas/LlmTurnTool"

    LlmTurnTool:
      type: object
      required: [name, kind]
      description: A tool the model requested in this LLM turn
      properties:
        name:
          type: string
        provider_call_id:
          type: string
          nullable: true
        kind:
          type: string
          enum: [tool, frontend_tool]
        args:
          description: Arguments as logged when the model requested the tool
        result:
          nullable: true
          description: ChatToolCall result when a matching row exists. Always null for frontend_tool.
        status:
          type: string
          nullable: true
          description: ChatToolCall status when a matching row exists

    LlmTurnList:
      type: object
      required: [items, pagination]
      description: Paginated list of LLM turns
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/LlmTurn"
          description: LLM turn items for the current page
        pagination:
          $ref: "#/components/schemas/Pagination"

    LlmTurnPayload:
      type: object
      description: Full payload content of a single LLM turn, loaded from S3 on demand
      properties:
        system_prompt:
          type: string
          nullable: true
          description: Resolved system prompt sent to the model
        input_messages:
          nullable: true
          description: Messages sent to the model (serialised LangChain format)
        response_text:
          type: string
          nullable: true
          description: Plain text content of the model response
        raw_response:
          nullable: true
          description: Raw model response chunks (JSON)
        parameters:
          nullable: true
          description: Model parameters (e.g. reasoningEffort)

    # ─── Knowledge Base Schemas ────────────────────────────────────────────────

    KnowledgeSpaceVisibility:
      type: string
      enum: [PRIVATE, PUBLIC_READ, PUBLIC_WRITE]

    KnowledgeSpace:
      type: object
      required: [id, slug, title, is_owner, is_editor, is_agent_managed, visibility, embedding_enabled, editors, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        title:
          type: string
        description:
          type: string
          nullable: true
        kind:
          type: string
          enum: [WIKI, SKILL, REPOSITORY, USER_MEMORY]
        owner_user_id:
          type: integer
          nullable: true
        owner:
          allOf:
            - $ref: "#/components/schemas/UserPickerItem"
          nullable: true
          description: Slim owner profile for display; null when the space has no owner.
        editors:
          type: array
          description: Named editors — users granted read+write regardless of visibility.
          items:
            $ref: "#/components/schemas/UserPickerItem"
        is_owner:
          type: boolean
          description: True when the authenticated user is the owner of this space.
        is_editor:
          type: boolean
          description: True when the authenticated user is a named editor of this space.
        is_agent_managed:
          type: boolean
          description: True when the space content is managed by an agent (read-only in the UI).
        repository_id:
          type: string
          format: uuid
          nullable: true
          description: UUID of the linked Repository for REPOSITORY-kind spaces; null otherwise.
        visibility:
          $ref: "#/components/schemas/KnowledgeSpaceVisibility"
        embedding_enabled:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    KnowledgeSpaceCreate:
      type: object
      required: [slug, title]
      properties:
