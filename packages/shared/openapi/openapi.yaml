            type: string
            format: uuid
          description: Task UUID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskCrewRemovalAction"
      responses:
        "200":
          description: Crew removal confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskDetail"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: No pending crew removal exists.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "500":
          $ref: "#/components/responses/InternalError"

  /tasks/{uuid}/crew-search/removal/decline:
    post:
      operationId: declineCrewRemoval
      summary: "Tasks: Decline crew removal"
      description: >
        Declines a pending crew-removal proposal and keeps the crew member's
        granted role in place (T18 · S11, ANW-7759).
      tags:
        - Tasks
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Task UUID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskCrewRemovalAction"
      responses:
        "200":
          description: Crew removal declined
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskDetail"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: No pending crew removal exists.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "500":
          $ref: "#/components/responses/InternalError"

  /tasks/{uuid}/crew-search/removal/override:
    post:
      operationId: overrideCrewRemoval
      summary: "Tasks: Override crew removal"
      description: >
        Leadership/Admin override: removes a crew member directly without the
        counterpart's confirmation, while still writing the audit trail
        (T18 · S11, ANW-7759).
      tags:
        - Tasks
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Task UUID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskCrewRemovalAction"
      responses:
        "200":
          description: Crew removal overridden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskDetail"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Target user is not an active crew member.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "500":
          $ref: "#/components/responses/InternalError"

  /tasks/{uuid}/discard:
    post:
      operationId: discardTask
      summary: "Tasks: Discard"
      description: >
        Aborts a task to DISCARDED from any non-terminal status (T18 · S05, ANW-7525,
        matrix #16). Owner-only, reversible via the reopen endpoint. Ends
        Crew/Stakeholder membership (roles cleared, member row kept).
      tags:
        - Tasks
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Task UUID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskDiscard"
      responses:
        "200":
          description: Task discarded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskDetail"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Task is already in a terminal status.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "500":
          $ref: "#/components/responses/InternalError"

  /tasks/{uuid}/reopen:
    post:
      operationId: reopenTask
      summary: "Tasks: Reopen"
      description: >
        Reopens a DONE or DISCARDED task onto an owner-chosen ACTIVE status of its
        series (T18 · S05, ANW-7525, matrix #17 / reopen-after-DONE). Owner-only.
      tags:
        - Tasks
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Task UUID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskReopen"
      responses:
        "200":
          description: Task reopened
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskDetail"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Task is not in a reopenable status.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "500":
          $ref: "#/components/responses/InternalError"

  /tasks/{uuid}/rank-context:
    get:
      operationId: getTaskRankContext
      summary: "Tasks: Read the priority-ordering context"
      description: >
        Both zones of the priority-ordering context this task belongs to
        (AURA-930 / AURA-1145): the ordered zone first (rank ascending), the
        unordered set behind it. Also returns the expected-state fingerprint the
        matching PUT must carry, and whether the caller may reorder at all.
        `scope=siblings` (default) is the context this task itself sits in;
        `scope=children` is the context of its direct children (`task:<this>`).
      tags:
        - Tasks
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Task UUID
        - $ref: "#/components/parameters/RankContextScopeParam"
      responses:
        "200":
          description: Ordering context
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskRankContext"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      operationId: reorderTaskRankContext
      summary: "Tasks: Apply a new order to the context"
      description: >
        Writes the complete target order of the context in one transaction
        (AURA-930 / AURA-1145, d-016). Every task named in `ordered_task_ids`
        gets its position (1…n) in that order; every other living task in the
        context becomes unordered. Requires edit permission on the context.
        `expected_state` is the fingerprint the order was computed against — if
        the context has moved on, the save is rejected with 409 and the response
        carries the current context in `meta.context`.
        `scope` selects which context is addressed — siblings (default) or
        the children of the named task.
      tags:
        - Tasks
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: UUID of a task in the context being reordered
        - $ref: "#/components/parameters/RankContextScopeParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskRankContextOrder"
      responses:
        "200":
          description: Order applied; the new context state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskRankContext"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >
            The ordering changed since the client read it. `meta.context` holds
            the state that actually applies.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "500":
          $ref: "#/components/responses/InternalError"

  /tasks/{uuid}/asap:
    put:
      operationId: setTaskAsap
      summary: "Tasks: Mark ASAP"
      description: >
        Owner-only (AURA-930 / AURA-1147, d-017). Marks the task ASAP; the
        response carries the current ASAP stock — the sole counter-pressure
        against inflation, since there is no cap and no expiry. Writes
        `task.asap_set`. Idempotent when already ASAP.
      tags:
        - Tasks
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Task UUID
      responses:
        "200":
          description: ASAP set; the current stock
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskAsapState"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: clearTaskAsap
      summary: "Tasks: Clear ASAP"
      description: >
        Owner-only (AURA-930 / AURA-1147, d-017). Removes the ASAP mark; the
        task keeps its rank untouched (d-012). Writes `task.asap_cleared`
        when the task was ASAP; a no-op otherwise.
      tags:
        - Tasks
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Task UUID
      responses:
        "200":
          description: ASAP cleared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskAsapState"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /tasks/{uuid}/rank-reason:
    put:
      operationId: setTaskRankReason
      summary: "Tasks: Publish the ordering rationale"
      description: >
        Owner-only (AURA-930 / AURA-1147, d-004). Publishes the optional,
        always-visible rationale for the task's placement — including one
        edited from an LLM draft. Publishing is always attributed to the
        acting owner.
      tags:
        - Tasks
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Task UUID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskRankReasonInput"
      responses:
        "200":
          description: Rationale saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskRankReasonState"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /tasks/{uuid}/rank-reason/draft:
    post:
      operationId: draftTaskRankReason
      summary: "Tasks: Draft an ordering rationale"
      description: >
        Owner-only (AURA-930 / AURA-1147, d-015). Generates a short rationale
        draft from the task's content via the utility model. Never persisted —
        the owner edits it and publishes via PUT rank-reason.
      tags:
        - Tasks
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Task UUID
      responses:
        "200":
          description: Draft generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskRankReasonDraft"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          description: The draft could not be generated.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "500":
          $ref: "#/components/responses/InternalError"

  /tasks/{uuid}/story-points:
    get:
      operationId: listTaskStoryPointEstimates
      summary: "Tasks: List story-point history"
      description: >
        Append-only estimate history for a task, newest first. Readable with
        task READ access. Does not change the effective value.
      tags:
        - Tasks
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Task UUID
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
          description: Maximum number of history rows to return.
      responses:
        "200":
          description: History listed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoryPointEstimateList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: setTaskStoryPoints
      summary: "Tasks: Set or withdraw a human story-point correction"
      description: >
        Appends a HUMAN history row (set or withdraw) and rewrites the cached
        effective value. Only Stories and Sub-Tasks are eligible. Requires
        task EDIT access. `key` null withdraws the human correction so the
        latest AI estimate with a value becomes effective again.
      tags:
        - Tasks
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Task UUID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoryPointWriteInput"
      responses:
        "200":
          description: Task detail with the new effective value
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskDetail"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /tasks/{uuid}/story-points/estimate:
    post:
      operationId: estimateTaskStoryPoints
      summary: "Tasks: Run the AI story-point estimator"
      description: >
        Runs the STORY_POINT_ESTIMATE agent once and appends an AI history
        row (including a reasoned refusal). A technical abort writes no row.
        Requires task EDIT access. Only Stories and Sub-Tasks are eligible.
      tags:
        - Tasks
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Task UUID
      responses:
        "200":
          description: Task detail after the estimate was written
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskDetail"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          description: The estimate could not be generated.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "500":
          $ref: "#/components/responses/InternalError"

  /tasks/{uuid}/story-points/propose:
    post:
      operationId: proposeTaskStoryPointEstimate
      summary: "Tasks: Propose a story-point size without recording it"
      description: >
        Runs the STORY_POINT_ESTIMATE agent once and returns the result
        without writing a history row — the caller decides whether it becomes
        one. Requires task EDIT access. Only Stories and Sub-Tasks are
        eligible.
      tags:
        - Tasks
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Task UUID
      responses:
        "200":
          description: The proposed size, unrecorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoryPointProposal"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          description: The estimate could not be generated.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "500":
          $ref: "#/components/responses/InternalError"

  /tasks/{uuid}/story-points/accept:
    post:
      operationId: acceptTaskStoryPointEstimate
      summary: "Tasks: Accept a chat-proposed story-point estimate"
      description: >
        Writes the AI estimate that `task_estimate_story_points` proposed
        (trigger `chat`). Answers 409 HUMAN_OVERRIDE when a human correction
        is in effect. Requires task EDIT access.
      tags:
        - Tasks
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Task UUID (must match the proposal)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoryPointAcceptInput"
      responses:
        "200":
          description: Task detail after the estimate was accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskDetail"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /tasks/{uuid}/rank-lock:
    put:
      operationId: setTaskRankLock
      summary: "Tasks: Lock or unlock a priority-ordering context"
      description: >
        Owner-only (AURA-930 / AURA-1150, d-019): locks or unlocks the context
        this task anchors against reordering by anyone but its OWNER. The two
        root contexts ("root:sagas", "root:unparented") have no single owner
        and can never be locked — a lock attempt on one answers 403. ASAP is
        unaffected and stays owner-only regardless (S4).
        `scope=children` locks the children-context of the named task (its own
        `rankLockedAt`); `scope=siblings` (default) locks the context it sits in.
      tags:
        - Tasks
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: UUID of a task in the context to lock or unlock
        - $ref: "#/components/parameters/RankContextScopeParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [locked]
              properties:
                locked:
                  type: boolean
                  description: Target lock state.
      responses:
        "200":
          description: Lock state applied; the current context state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskRankContext"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /tasks/{uuid}/read:
    post:
      operationId: markTaskRead
      summary: "Tasks: Mark as read"
      description: Marks the task as read for the current user (idempotent). Sets readAt to now() only if it is currently null.
      tags:
        - Tasks
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Task UUID
      responses:
        "204":
          description: Marked as read (or already was read).
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /tasks/{uuid}/comments/read:
    post:
      operationId: markTaskCommentsRead
      summary: "Tasks: Mark comments as read"
      description: >
        Advances the viewer's comment-read watermark for this task to the
        `last_rendered_at` timestamp (the `createdAt` of the newest comment
        actually rendered). Access is any viewer with READ on the task
        (membership not required). The watermark only moves forward.
      tags:
        - Tasks
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Task UUID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarkTaskCommentsReadRequest"
      responses:
        "204":
          description: Watermark advanced (or already at/past the given timestamp).
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /tasks/{uuid}/members:
    post:
      operationId: addTaskMember
      summary: "Tasks: Add member"
      description: Adds a user as a member of a task. Accepts userId (integer) or userUuid (UUID string).
      tags:
        - Tasks
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Task UUID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskMemberRef"
      responses:
        "200":
          description: Member added; returns updated task detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskDetail"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /tasks/{uuid}/members/{userIdOrUuid}:
    delete:
      operationId: removeTaskMember
      summary: "Tasks: Remove member"
      description: Removes a user from the member list of a task. Returns 409 if trying to remove the last member, or the last owner (assign another owner first, or start an owner search).
      tags:
        - Tasks
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Task UUID
        - name: userIdOrUuid
          in: path
          required: true
          schema:
            type: string
          description: User integer ID or UUID
      responses:
        "200":
          description: Member removed; returns updated task detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /tasks/{uuid}/members/{userIdOrUuid}/roles:
    put:
      operationId: setTaskMemberRoles
      summary: "Tasks: Set member roles"
      description: Replaces all roles assigned to a task member (idempotent set-replace) with a fixed set of TaskRole enum values. Returns 409 if the replacement would remove the last owner (assign another owner first, or start an owner search).
      tags:
        - Tasks
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Task UUID
        - name: userIdOrUuid
          in: path
          required: true
          schema:
            type: string
