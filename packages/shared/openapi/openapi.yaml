openapi: 3.1.0
info:
  title: AURA API
  version: 1.0.0
  description: |
    Das Personal Access Token aus den Einstellungen (`/settings/mcp-access`) gilt für MCP **und** für diese REST-API — es ist derselbe Token. Für REST-Aufrufe im Header `Authorization: Bearer <dein-token>` mitgeben.

servers:
  - url: http://localhost:3000/api
    description: Local development server

security:
  - cookieAuth: []
  - bearerAuth: []

tags:
  - name: Chats
    description: Chat management
  - name: Users
    description: User management (admin only)
  - name: Artifacts
    description: Artifact management
  - name: Health
    description: System health and status
  - name: Repositories
    description: Repository management (mutations admin only)
  - name: Projects
    description: Project overview — free-floating containers for tasks and repositories (ANW-7846)
  - name: Tasks
  - name: Capacity
    description: Task umbrella management
  - name: Search
    description: Unified semantic search across all resource types
  - name: MCP
    description: MCP Personal Access Token management and MCP-authenticated API routes
  - name: Glossary
    description: Project-wide glossary of terms, acronyms and domain concepts
  - name: Skills
    description: Skill document management (wiki-backed, owner/visibility-aware)
  - name: Memory
    description: Memory Explorer graph and entity endpoints
  - name: Notifications
    description: Notification inbox — list, mark-read, unread badge
  - name: Boards
    description: Personal boards attention aggregate (waiting-on-me / waiting-on-others / overdue)
  - name: Comments
    description: Polymorphic flat comments on artifacts and tasks
  - name: Signals
    description: Planning hints inbox (feedback and research signals)
  - name: Feedback
    description: Product and process feedback inbox (AURA-1761)
  - name: UserGroups
    description: User groups with a LEAD/MEMBER role — managed by Leadership and Admin (AURA-1722)

paths:
  /search:
    post:
      operationId: unifiedSearch
      summary: "Search: Unified semantic search"
      description: Semantic search across one or more source types in a single request. Per-type authorization is enforced silently — unauthorized types are excluded from results without returning 403.
      tags:
        - Search
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UnifiedSearchRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnifiedSearchResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          description: Embedding provider unavailable
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "500":
          $ref: "#/components/responses/InternalError"

  /mcp/blueprint/setup:
    get:
      operationId: aiSetup
      summary: Bootstrap an empty house repository from the wiki blueprint
      description: |
        Call this when the current repository has no Aura control layer yet (no AGENTS.md, no .agents/skills, no .cursor/rules/anwaltde) and you need to set it up. Returns the current ai-setup skill text, the current blueprint manifest, and a short instruction to fetch missing blocks via getBlueprintFiles. Does not write any files. Do not call this to check whether an already-set-up repo is up to date — that is ai-sync.
      tags:
        - MCP
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current ai-setup skill, inline manifest, and fetch instruction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiSetupResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /mcp/blueprint/files:
    get:
      operationId: getBlueprintFiles
      summary: Fetch house-blueprint files by path
      description: |
        Fetch one file or every file in a skill directory from the house blueprint (engineering-foundation, path under blueprint/ only). File vs directory is decided by the node, not by a flag. Pass an optional version stamp (sha256 checksum or integer version) to pin a specific revision; omit it for current. Use when ai-setup or ai-sync needs the bytes of a named building block. Do not use this for Aura product skills (mcpGetSkill) or for wiki pages outside blueprint/.
      tags:
        - MCP
      security:
        - bearerAuth: []
      parameters:
        - name: path
          in: query
          required: true
          schema:
            type: string
            minLength: 1
          description: Slash-separated path under blueprint/ (file or skill directory).
        - name: version
          in: query
          required: false
          schema:
            type: string
            minLength: 1
          description: Optional version pointer — sha256:<hex> checksum or integer latest_version.
      responses:
        "200":
          description: JSON-safe file payloads with checksum and provenance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetBlueprintFilesResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /mcp/search:
    post:
      operationId: mcpUnifiedSearch
      summary: "MCP: Unified semantic search"
      description: Same as POST /search but authenticated via MCP Personal Access Token (Bearer). Used by the native /mcp route and external MCP clients.
      tags:
        - MCP
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UnifiedSearchRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnifiedSearchResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          description: Embedding provider unavailable
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "500":
          $ref: "#/components/responses/InternalError"

  /mcp/tasks:
    post:
      operationId: mcpCreateTask
      summary: "MCP: Create task"
      description: Creates a planning task for the PAT owner without linking an Aura chat. Call search first to avoid duplicates.
      tags:
        - MCP
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/McpCreateTaskRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpTaskDetail"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /mcp/tasks/{id}/artifacts:
    post:
      operationId: mcpLinkArtifactToTask
      summary: "MCP: Link artifact to task"
      tags:
        - MCP
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/McpLinkArtifactRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpLinkArtifactResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /mcp/tasks/{id}/uploads:
    post:
      operationId: mcpLinkUploadToTask
      summary: "MCP: Link upload to task"
      tags:
        - MCP
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/McpLinkUploadRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpLinkUploadResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /mcp/artifacts:
    post:
      operationId: mcpCreateArtifact
      summary: "MCP: Create artifact"
      description: >
        Creates a Markdown artifact without an Aura chat (source MCP). Embedding runs
        fire-and-forget. Server limit: body max 200,000 characters. A large body has to be
        emitted as a single tool argument and may exceed the calling agent's output budget
        long before that limit — for large content, create a short seed here and fill it in
        via mcpUpdateArtifact mode "section", or send the payload from a file to
        PATCH /api/mcp/artifacts/{id} with an MCP PAT.
      tags:
        - MCP
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/McpCreateArtifactRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactDetail"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /mcp/artifacts/{id}:
    get:
      operationId: mcpGetArtifact
      summary: "MCP: Get artifact"
      tags:
        - MCP
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: mcpUpdateArtifact
      summary: "MCP: Update artifact"
      description: >
        Updates an artifact body. Server limits: body max 200,000 characters in mode
        "whole", 50,000 in mode "section". Prefer mode "section" (target_heading + section
        body) for large or multi-part edits: a whole body has to be emitted as a single tool
        argument and may exceed the calling agent's output budget long before the server
        limit. For very large content, send the payload from a file to
        PATCH /api/mcp/artifacts/{id} with an MCP PAT (same JSON body).
      tags:
        - MCP
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/McpUpdateArtifactRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpUpdateArtifactResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /mcp/upload-documents:
    post:
      operationId: mcpCreateUploadDocument
      summary: "MCP: Upload document (base64)"
      description: Ingests a file from base64 content. Maximum 10 MB per request.
      tags:
        - MCP
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/McpCreateUploadDocumentRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpUploadDocumentDetail"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          description: Payload exceeds 10 MB MCP limit
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "415":
          description: Unsupported media type
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

  /mcp/upload-documents/{id}:
    get:
      operationId: mcpGetUploadDocument
      summary: "MCP: Get upload document"
      tags:
        - MCP
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpUploadDocumentDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /mcp/questions/{id}:
    get:
      operationId: mcpGetQuestion
      summary: "MCP: Get question"
      tags:
        - MCP
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpQuestionDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /mcp/questions/{id}/answer:
    post:
      operationId: mcpAnswerQuestion
      summary: "MCP: Answer question"
      description: Saves an answer and marks the question ANSWERED. Requires EDIT access; no chatbot guard.
      tags:
        - MCP
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/McpAnswerQuestionRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpQuestionDetail"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /mcp/skills/{id}:
    get:
      operationId: mcpGetSkill
      summary: "MCP: Get skill"
      tags:
        - MCP
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpSkillDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /mcp/knowledge/documents/{id}:
    get:
      operationId: mcpGetKnowledgeDocument
      summary: "MCP: Get knowledge document"
      tags:
        - MCP
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpKnowledgeDocument"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /mcp/wiki-search:
    get:
      operationId: mcpWikiSearch
      summary: "MCP: Search the wiki (literal + semantic)"
      description: Searches Wiki, Repository and Skill knowledge spaces for pages matching the query, combining a literal (German full-text plus a trigram fallback for compound words) and a semantic search and merging both into one ranked list. Restricted to the caller's readable spaces.
      tags:
        - MCP
      security:
        - bearerAuth: []
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 200
        - name: space_slug
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpWikiSearchResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /mcp/repo-documents:
    get:
      operationId: mcpGetRepoDocument
      summary: "MCP: Get repository document"
      tags:
        - MCP
      security:
        - bearerAuth: []
      parameters:
        - name: repo_slug
          in: query
          required: true
          schema:
            type: string
        - name: path
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpRepoDocument"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /mcp/code-repositories:
    get:
      operationId: mcpListCodeRepositories
      summary: "MCP: List code-search-enabled repositories"
      description: Returns repositories with codeSearchEnabled=true for intersection with repo-mcp allowlist.
      tags:
        - MCP
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpCodeRepositoryList"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /mcp/graph/expand:
    post:
      operationId: mcpExpandGraph
      summary: "MCP: Expand knowledge graph"
      tags:
        - MCP
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/McpGraphExpandRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpGraphExpandResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /me/mcp-tokens:
    get:
      operationId: listMcpAccessTokens
      summary: "Me: List MCP access tokens"
      description: Returns active MCP access tokens for the authenticated user. Token secrets are never included.
      # AURA-1279 / S17: token management must never be reachable by an agent.
      x-mcp: false
      tags:
        - MCP
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpAccessTokenList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: createMcpAccessToken
      summary: "Me: Create MCP access token"
      description: Creates a new MCP access token. The plaintext token is returned once in the response and cannot be retrieved again.
      # AURA-1279 / S17: token management must never be reachable by an agent.
      x-mcp: false
      tags:
        - MCP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMcpAccessTokenRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateMcpAccessTokenResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /me/mcp-tokens/{id}:
    delete:
      operationId: revokeMcpAccessToken
      summary: "Me: Revoke MCP access token"
      description: Revokes an MCP access token owned by the authenticated user. Idempotent for already-revoked tokens returns 404.
      tags:
        - MCP
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpAccessTokenRevokeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /health:
    get:
      operationId: getHealth
      summary: "Health: Status check"
      tags:
        - Health
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ok]

  /system/health:
    get:
      operationId: systemHealth
      summary: "System: Health and build identity"
      description: Authenticated health check with process uptime and the current build identity (hash, tag, timestamps). Distinct from the unauthenticated Docker `/health` probe.
      tags:
        - Health
      responses:
        "200":
          description: Health status, uptime in seconds, and optional build block
          content:
            application/json:
              schema:
                type: object
                required: [status, uptime]
                properties:
                  status:
                    type: string
                    enum: [success]
                  uptime:
                    type: integer
                    description: Process uptime in whole seconds
                  build:
                    type: object
                    nullable: true
                    properties:
                      hash:
                        type: string
                      tag:
                        type: string
                      germanTime:
                        type: string
                      utcTime:
                        type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /users:
    get:
      operationId: listUsers
      summary: "Users: List all"
      description: Returns paginated users with optional search, filter and sort. Admin only.
      tags:
        - Users
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/SearchParam"
        - name: sort_by
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/UserSortField"
          description: Field to sort by
        - $ref: "#/components/parameters/SortDirParam"
        - name: role
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/UserRole"
          description: Filter by user role
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserList"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /users/{id}:
    patch:
      operationId: updateUser
      summary: "Users: Update role"
      description: Updates the role of a user. Admin only. Self-demotion is not allowed.
      tags:
        - Users
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: User UUID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdateInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /users/search:
    get:
      operationId: searchUsers
      summary: "Users: Search (picker)"
      description: Searches users by display name or email. Available to all authenticated users. Minimum 2 characters required.
      tags:
        - Users
      parameters:
        - name: q
          in: query
