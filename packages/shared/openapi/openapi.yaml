      description: Fields by which Jira issue lists can be sorted

    JiraIssueListItem:
      type: object
      required: [id, issue_key, cloud_id, project_key, issue_type, summary, status, labels, created_at, updated_at]
      description: Lightweight Jira issue row for list views
      properties:
        id:
          type: string
          format: uuid
          description: Local mirror UUID
        issue_key:
          type: string
          description: Jira issue key (e.g. ANW-1234)
        cloud_id:
          type: string
          description: Atlassian cloud ID
        project_key:
          type: string
          description: Jira project key
        project_name:
          type: string
          nullable: true
          description: Jira project display name
        issue_type:
          type: string
          description: Issue type name (e.g. Bug, Story)
        summary:
          type: string
          description: Issue summary
        status:
          type: string
          description: Current status name
        status_category:
          type: string
          nullable: true
          enum: [new, indeterminate, done]
          description: Language-independent Jira status category key; null for legacy rows not yet backfilled or synced
        priority:
          type: string
          nullable: true
          description: Priority name
        labels:
          type: array
          items:
            type: string
          description: Issue labels
        assignee:
          type: string
          nullable: true
          description: Display name of the assignee
        team_id:
          type: string
          nullable: true
          description: Team/Topic UUID from customfield_10001
        jira_updated_at:
          type: string
          format: date-time
          nullable: true
          description: Timestamp of last update as reported by Jira
        created_at:
          type: string
          format: date-time
          description: Local mirror creation timestamp
        updated_at:
          type: string
          format: date-time
          description: Local mirror last update timestamp
        linked_task:
          allOf:
            - $ref: "#/components/schemas/JiraIssueLinkedTask"
          nullable: true
          description: Aura task linked to this Jira issue (if any)

    JiraIssueList:
      type: object
      required: [items, pagination]
      description: Paginated list of locally mirrored Jira issues
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/JiraIssueListItem"
        pagination:
          $ref: "#/components/schemas/Pagination"

    JiraIssueLinkedTask:
      type: object
      required: [id, title]
      description: Slim reference to an Aura task linked to this Jira issue
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string

    JiraIssueDetail:
      type: object
      required: [id, issue_key, cloud_id, project_key, issue_type, summary, status, labels, created_at, updated_at]
      description: Full detail of a locally mirrored Jira issue
      properties:
        id:
          type: string
          format: uuid
          description: Local mirror UUID
        issue_key:
          type: string
        cloud_id:
          type: string
        project_key:
          type: string
        project_name:
          type: string
          nullable: true
        issue_type:
          type: string
        summary:
          type: string
        description:
          type: string
          nullable: true
          description: Plain-text description extracted from Atlassian Document Format
        status:
          type: string
        priority:
          type: string
          nullable: true
        labels:
          type: array
          items:
            type: string
        assignee:
          type: string
          nullable: true
        team_id:
          type: string
          nullable: true
        jira_updated_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        linked_task:
          allOf:
            - $ref: "#/components/schemas/JiraIssueLinkedTask"
          nullable: true
          description: Aura task linked to this Jira issue (if any)
