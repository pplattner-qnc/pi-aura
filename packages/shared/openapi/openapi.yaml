      required: [id, display_name]
      description: Slim user reference within a router miss item
      properties:
        id:
          type: string
          format: uuid
          description: User UUID
        display_name:
          type: string
          description: Display name (falls back to ldapUid, always set)

    RouterMissItem:
      type: object
