  /projects/{uuid}/tasks:
    get:
      operationId: getProjectTaskTree
      summary: "Projects: Task tree"
      description: >
        Nested task tree for a project. Roots are directly assigned tasks with no
        assigned ancestor in the same project (after viewer visibility filtering).
        Leadership/Admin see all; others see only tasks from taskViewerAccessWhere.
        Archived tasks are excluded; done tasks are included.
      tags:
        - Projects
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Nested task tree
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectTaskTree"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
