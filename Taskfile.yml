version: "3"

# Taskfile: install and typecheck targets for the pi-aura repo.
#
# The agent-facing CLI and REST reference build surface is removed (the
# remove-cli-rest-surface retirement), and the internal REST library followed
# the consumer rule (the rest-library-consumer-rule ticket): there is no
# bundle step, no typed-client codegen, and no OpenAPI spec sync anymore.
# What remains is the shared package's install and typecheck flow.
#
# The @pi-aura/shared workspace package (packages/shared/) holds the keyring
# and settings modules the extensions resolve at runtime.
#
# Common flows:
#   task                       # install build deps, typecheck
#   task install               # install build deps (root npm install)
#   task typecheck             # tsc --noEmit (assumes deps are installed)

vars:
  SHARED_DIR: packages/shared

tasks:
  # Default: install build deps, then typecheck.
  default:
    desc: Install build deps and typecheck
    cmds:
      - task: install
      - task: typecheck

  # Install build deps (the root workspace populates packages/shared).
  install:
    desc: Install build deps
    cmds:
      - npm install

  # tsc --noEmit for the shared package (assumes deps are installed).
  typecheck:
    desc: Typecheck packages/shared (tsc --noEmit)
    cmds:
      - cd {{.SHARED_DIR}} && npm run typecheck
